<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المبيعات وإحصائيات المخزون</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding: 10px; max-width: 900px; margin: 0 auto; }

        .main-card {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            padding: 14px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .page-title {
            text-align: center;
            color: #1e3a8a;
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .filter-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid #cbd5e1;
            font-size: 0.9rem;
            font-weight: 700;
            color: #0f172a;
            background: #fff;
            outline: none;
        }

        .date-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .btn-reset {
            background: #64748b;
            color: #ffffff;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-reset:hover { background: #475569; }

        input[type="date"] {
            flex: 1;
            padding: 9px 10px;
            border-radius: 8px;
            border: 1.5px solid #cbd5e1;
            font-size: 0.85rem;
            font-weight: 700;
            color: #0f172a;
            background: #fff;
            outline: none;
            text-align: center;
        }

        .sold-company-card {
            background: #eff6ff;
            border: 1.5px solid #bfdbfe;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .sold-header {
            text-align: center;
            font-size: 0.98rem;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #dbeafe;
        }
        .company-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        @media (max-width: 420px) {
            .company-grid {
                grid-template-columns: 1fr;
            }
        }
        .company-item {
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .company-name {
            font-size: 0.88rem;
            font-weight: 800;
            color: #1e293b;
        }
        .company-count {
            font-size: 1.05rem;
            font-weight: 800;
            color: #2563eb;
            background: #eff6ff;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .table-card {
            margin-top: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }
        .table-title {
            background: #f1f5f9;
            padding: 10px 12px;
            font-weight: 800;
            font-size: 0.9rem;
            color: #1e3a8a;
            border-bottom: 1px solid #e2e8f0;
        }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 9px 8px; text-align: center; white-space: nowrap; }
        th { background: #1e293b; color: #fff; font-weight: 700; }
        tr:last-child td { border-bottom: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLlNld1YOKrX6uq15aF4BhJjWPwV40osY",
            authDomain: "ahmed-hassan-bb80b.firebaseapp.com",
            projectId: "ahmed-hassan-bb80b",
            storageBucket: "ahmed-hassan-bb80b.firebasestorage.app",
            messagingSenderId: "503682153846",
            appId: "1:503682153846:web:93b3a174ab31e351a04e57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.doc = doc;
        window.getDoc = getDoc;

        if (window.initSalesDashboard) { window.initSalesDashboard(); }
    </script>
</head>
<body>

    <div class="main-card">
        <div class="page-title">
            <span>📊</span>
            <span>لوحة المبيعات وإحصائيات المخزون</span>
        </div>

        <div class="filter-box">
            <select id="itemFilter" onchange="renderDashboard()">
                <option value="ALL">📦 كل المحلات / الأصناف</option>
            </select>

            <div class="date-row">
                <button class="btn-reset" onclick="resetFilters()">
                    <span>🔄</span>
                    <span>عرض الكل</span>
                </button>
                <input type="date" id="dateFilter" onchange="renderDashboard()">
            </div>
        </div>

        <div class="sold-company-card">
            <div class="sold-header">📦 مباع (حسب فواتير البيع لكل محل والمدة)</div>
            <div class="company-grid" id="soldByCompanyGrid"></div>
        </div>

        <div class="table-card">
            <div class="table-title">📊 ملخص المحلات والمدة</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>المحل / الصنف</th>
                            <th>المدة</th>
                            <th>الرصيد المتاح</th>
                            <th>الممسوح</th>
                            <th>المباع (حبة)</th>
                            <th>قيمة المبيعات</th>
                        </tr>
                    </thead>
                    <tbody id="companySummaryBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let categoriesList = ['Mobily', 'STC', 'Zain', 'Redbull'];
        let durationsList = ['30', '60'];
        let simsList = [];
        let invoicesList = [];

        // استخراج اسم الشركة والمدة بدقة من النص مثل "Mobily (30)" أو "Mobily (60)"
        function parseCompanyAndDuration(rawStr, explicitDur) {
            const s = String(rawStr || '').trim();
            let dur = explicitDur ? String(explicitDur).trim() : '';

            // البحث عن رقم المدة داخل الأقواس مثل (30) أو (60)
            const parenMatch = s.match(/\((\d+)\)/);
            if (!dur && parenMatch) {
                dur = parenMatch[1];
            } else if (!dur) {
                const numMatch = s.match(/(30|60|90|180|365)/);
                if (numMatch) dur = numMatch[1];
            }

            const cleanName = s.replace(/\(\d+\)/g, '').replace(/(30|60|90)/g, '').trim();
            const lower = cleanName.toLowerCase();

            let company = cleanName || 'Mobily';
            if (lower.includes('mobily') || lower.includes('موبايلي')) company = 'Mobily';
            else if (lower.includes('stc') || lower.includes('اس تي سي') || lower.includes('إس تي سي') || lower.includes('سوا')) company = 'STC';
            else if (lower.includes('zain') || lower.includes('زين')) company = 'Zain';
            else if (lower.includes('redbull') || lower.includes('red bull') || lower.includes('ريد بل') || lower.includes('ريدبل')) company = 'Redbull';
            else {
                for (const cat of categoriesList) {
                    if (lower === cat.toLowerCase() || lower.includes(cat.toLowerCase())) {
                        company = cat;
                        break;
                    }
                }
            }

            if (!dur || dur === '-' || dur === 'غير محدد') {
                dur = (company === 'Redbull') ? '30' : '60';
            }

            return { company, duration: dur };
        }

        function extractInvoiceItems(inv) {
            const extracted = [];

            if (Array.isArray(inv.cartItems) && inv.cartItems.length > 0) {
                inv.cartItems.forEach(it => {
                    const rawCat = it.item || it.category || it.company || it.name || '';
                    const { company, duration } = parseCompanyAndDuration(rawCat, it.duration || it.dur);
                    const qty = parseFloat(it.qty ?? it.quantity ?? it.count ?? 0) || 0;
                    const price = parseFloat(it.price ?? 0) || 0;
                    const total = parseFloat(it.total ?? (qty * price) ?? 0) || 0;
                    if (company || qty > 0) {
                        extracted.push({ company, duration, qty, total });
                    }
                });
                return extracted;
            }

            const altArray = inv.items || inv.products;
            if (Array.isArray(altArray) && altArray.length > 0) {
                altArray.forEach(it => {
                    const rawCat = it.item || it.category || it.company || it.name || '';
                    const { company, duration } = parseCompanyAndDuration(rawCat, it.duration || it.dur);
                    const qty = parseFloat(it.qty ?? it.quantity ?? it.count ?? 0) || 0;
                    const price = parseFloat(it.price ?? 0) || 0;
                    const total = parseFloat(it.total ?? (qty * price) ?? 0) || 0;
                    if (company || qty > 0) {
                        extracted.push({ company, duration, qty, total });
                    }
                });
                return extracted;
            }

            const rawCat = inv.item || inv.category || inv.company || inv.simType || '';
            const { company, duration } = parseCompanyAndDuration(rawCat, inv.duration);
            const qty = parseFloat(inv.qty ?? inv.quantity ?? inv.count ?? inv.totalQty ?? 0) || 0;
            const total = parseFloat(inv.total ?? inv.totalAmount ?? 0) || 0;
            if (company || qty > 0) {
                extracted.push({ company, duration, qty, total });
            }

            return extracted;
        }

        function populateFilterDropdown() {
            const select = document.getElementById('itemFilter');
            const currentVal = select.value || 'ALL';
            let html = `<option value="ALL">📦 كل المحلات / الأصناف</option>`;
            categoriesList.forEach(cat => {
                html += `<option value="${cat}">${cat}</option>`;
            });
            select.innerHTML = html;
            if ([...select.options].some(o => o.value === currentVal)) {
                select.value = currentVal;
            }
        }

        window.resetFilters = function() {
            document.getElementById('itemFilter').value = 'ALL';
            document.getElementById('dateFilter').value = '';
            renderDashboard();
        };

        window.renderDashboard = function() {
            const selectedCat = document.getElementById('itemFilter').value;
            const selectedDate = document.getElementById('dateFilter').value;

            const allScannedMap = {};
            const allSoldMap = {};
            const filteredScannedMap = {};
            const filteredSoldMap = {};
            const filteredRevenueMap = {};

            categoriesList.forEach(c => {
                durationsList.forEach(d => {
                    const key = `${c}_${d}`;
                    allScannedMap[key] = 0;
                    allSoldMap[key] = 0;
                    filteredScannedMap[key] = 0;
                    filteredSoldMap[key] = 0;
                    filteredRevenueMap[key] = 0;
                });
            });

            // 1. حساب الشرائح الممسوحة لكل شركة ومدة
            simsList.forEach(sim => {
                const { company, duration } = parseCompanyAndDuration(sim.category || sim.company || '', sim.duration);
                const key = `${company}_${duration}`;
                allScannedMap[key] = (allScannedMap[key] || 0) + 1;

                const simDate = (sim.date || '').slice(0, 10);
                if (!selectedDate || simDate === selectedDate) {
                    filteredScannedMap[key] = (filteredScannedMap[key] || 0) + 1;
                }
            });

            // 2. حساب المبيعات من الفواتير لكل شركة ومدة (يقرأ "Mobily (30)" و "Mobily (60)" بشكل منفصل تماماً)
            invoicesList.forEach(inv => {
                const items = extractInvoiceItems(inv);
                const invDate = (inv.date || '').slice(0, 10);
                const matchesDate = !selectedDate || invDate === selectedDate;

                items.forEach(it => {
                    const key = `${it.company}_${it.duration}`;
                    allSoldMap[key] = (allSoldMap[key] || 0) + it.qty;

                    if (matchesDate) {
                        filteredSoldMap[key] = (filteredSoldMap[key] || 0) + it.qty;
                        filteredRevenueMap[key] = (filteredRevenueMap[key] || 0) + it.total;
                    }
                });
            });

            let activeKeys = [];
            categoriesList.forEach(c => {
                durationsList.forEach(d => {
                    activeKeys.push({ company: c, duration: d, key: `${c}_${d}` });
                });
            });

            if (selectedCat !== 'ALL') {
                activeKeys = activeKeys.filter(item => item.company === selectedCat);
            }

            // تحديث بطاقة "مباع"
            const grid = document.getElementById('soldByCompanyGrid');
            grid.innerHTML = activeKeys.map(item => {
                const soldQty = filteredSoldMap[item.key] || 0;
                return `
                    <div class="company-item">
                        <span class="company-name">🔹 ${item.company} (${item.duration})</span>
                        <span class="company-count">${soldQty} حبة</span>
                    </div>
                `;
            }).join('');

            // تحديث جدول ملخص المحلات والمدة
            const summaryBody = document.getElementById('companySummaryBody');
            summaryBody.innerHTML = activeKeys.map(item => {
                const availableStock = Math.max(0, (allScannedMap[item.key] || 0) - (allSoldMap[item.key] || 0));
                const scanned = filteredScannedMap[item.key] || 0;
                const sold = filteredSoldMap[item.key] || 0;
                const rev = filteredRevenueMap[item.key] || 0;
                return `
                    <tr>
                        <td style="font-weight:800; color:#1e3a8a;">${item.company}</td>
                        <td style="font-weight:700; color:#b45309;">${item.duration}</td>
                        <td style="font-weight:700;">${availableStock}</td>
                        <td>${scanned}</td>
                        <td style="font-weight:800; color:#2563eb;">${sold} حبة</td>
                        <td style="font-weight:700; color:#15803d;">${rev.toLocaleString('en-US')}</td>
                    </tr>
                `;
            }).join('');
        };

        window.initSalesDashboard = async function() {
            const localConfig = JSON.parse(localStorage.getItem('app_config') || 'null');
            if (localConfig) {
                categoriesList = localConfig.categoriesList || localConfig.customItems || categoriesList;
                durationsList = localConfig.durationsList || durationsList;
            }

            const localSims = JSON.parse(localStorage.getItem('scanned_sims_offline') || '[]');
            if (Array.isArray(localSims)) simsList = localSims;

            const localInvoices = JSON.parse(
                localStorage.getItem('sales_records_offline') ||
                localStorage.getItem('sales_records') ||
                '[]'
            );
            if (Array.isArray(localInvoices)) invoicesList = localInvoices;

            populateFilterDropdown();
            renderDashboard();

            try {
                if (window.db) {
                    const configSnap = await window.getDoc(window.doc(window.db, "settings", "app_config"));
                    if (configSnap.exists()) {
                        const cData = configSnap.data();
                        categoriesList = cData.categoriesList || cData.customItems || categoriesList;
                        durationsList = cData.durationsList || durationsList;
                    }

                    const simsSnap = await window.getDocs(window.collection(window.db, "scanned_sims"));
                    simsList = [];
                    simsSnap.forEach(d => simsList.push(d.data()));
                    localStorage.setItem('scanned_sims_offline', JSON.stringify(simsList));

                    const recordsSnap = await window.getDocs(window.collection(window.db, "sales_records"));
                    invoicesList = [];
                    recordsSnap.forEach(docSnap => {
                        invoicesList.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    localStorage.setItem('sales_records_offline', JSON.stringify(invoicesList));
                }
            } catch (e) {
                console.log("وضع الأوفلاين مفعل:", e);
            }

            populateFilterDropdown();
            renderDashboard();
        };

        window.addEventListener('DOMContentLoaded', () => {
            populateFilterDropdown();
            renderDashboard();
        });
    </script>
</body>
</html>
