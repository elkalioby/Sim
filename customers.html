<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء - متجر سيم</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 900px; margin: 0 auto; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .top-bar h1 { font-size: 1.25rem; color: var(--primary); }
        
        .stat-badge-box { background: var(--card); border-top: 4px solid var(--primary); padding: 10px 18px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); text-align: center; min-width: 130px; }
        .stat-title { font-size: 0.75rem; color: #6b7280; margin-bottom: 4px; }
        .stat-value { font-size: 1.1rem; font-weight: bold; color: var(--primary); }

        .btn { padding: 10px 14px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:active { opacity: 0.8; }
        .btn-primary { background-color: var(--primary-light); color: white; width: 100%; margin-top: 12px; padding: 12px; font-size: 1rem; }
        .btn-success { background-color: var(--success); color: white; padding: 7px 12px; font-size: 0.8rem; }
        .btn-danger { background-color: #fee2e2; color: var(--danger); padding: 7px 12px; font-size: 0.8rem; }
        .btn-warning { background-color: #fef3c7; color: var(--warning); padding: 7px 12px; font-size: 0.8rem; }

        .card { background: var(--card); padding: 18px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--primary); border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #374151; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; outline: none; background: #fff; }
        input:focus, select:focus { border-color: var(--primary-light); }

        .icon-btn {
            width: 42px;
            height: 42px;
            padding: 0;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
        }
        .icon-btn-add { background-color: var(--success); }
        .icon-btn-del { background-color: var(--danger); }

        #phone { text-align: right; direction: rtl; }

        .image-preview-box { margin-top: 8px; display: none; align-items: center; gap: 10px; background: #f8fafc; padding: 8px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        .image-preview-box img { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; }

        .search-bar { width: 100%; margin-bottom: 15px; }
        .customer-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fafafa; border-right: 5px solid var(--primary-light); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
        .customer-details { flex: 1; min-width: 220px; }
        .customer-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .client-name { font-weight: bold; font-size: 1.05rem; color: var(--primary); }
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .shop-badge { background: #dbeafe; color: var(--primary); }
        .market-badge { background: #fef3c7; color: #d97706; }
        .emp-badge { background: #e0e7ff; color: #3730a3; font-size: 0.75rem; }

        .info-row { font-size: 0.88rem; color: #4b5563; margin-top: 5px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .phone-link { color: var(--primary-light); cursor: pointer; text-decoration: underline; font-weight: bold; }
        .loc-link { background: #dcfce7; color: #15803d; padding: 3px 8px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px; }

        .shop-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; border: 2px solid #e5e7eb; cursor: pointer; transition: transform 0.2s; }
        .shop-thumb:hover { transform: scale(1.05); }

        .card-actions { width: 100%; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e5e7eb; padding-top: 8px; margin-top: 6px; flex-wrap: wrap; gap: 8px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-img { max-width: 95%; max-height: 85vh; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.5); }
    </style>

    <!-- ربط Firebase السحابي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLlNld1YOKrX6uq15aF4BhJjWPwV40osY",
            authDomain: "ahmed-hassan-bb80b.firebaseapp.com",
            projectId: "ahmed-hassan-bb80b",
            storageBucket: "ahmed-hassan-bb80b.firebasestorage.app",
            messagingSenderId: "503682153846",
            appId: "1:503682153846:web:93b3a174ab31e351a04e57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;

        if (window.initCustomersApp) { window.initCustomersApp(); }
    </script>
</head>
<body>

    <div class="top-bar">
        <h1>🏪 دليل وإدارة العملاء</h1>
        <div class="stat-badge-box">
            <div class="stat-title">إجمالي العملاء</div>
            <div class="stat-value" id="topCustomersCount">0</div>
        </div>
    </div>

    <div class="card" id="customerFormCard">
        <h2 id="formTitle">+ إضافة عميل جديد</h2>
        <form id="customerForm" onsubmit="saveCustomer(event)" novalidate>
            <input type="hidden" id="editCustomerId" value="">

            <div class="form-group">
                <label>اسم العميل</label>
                <input type="text" id="clientName" placeholder="أدخل اسم العميل">
            </div>

            <div class="form-group">
                <label>اسم المحل وصورة المحل</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="shopName" placeholder="أدخل اسم المحل" style="flex: 1;">
                    
                    <input type="file" id="shopImageGallery" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                    <button type="button" class="btn" onclick="document.getElementById('shopImageGallery').click()" style="background:#e5e7eb; color:#1f2937; padding:10px 12px;" title="اختيار صورة من الهاتف">📁</button>
                    
                    <input type="file" id="shopImageCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleImageUpload(event)">
                    <button type="button" class="btn" onclick="document.getElementById('shopImageCamera').click()" style="background:#2563eb; color:white; padding:10px 12px;" title="تصوير بالكاميرا">📷</button>
                </div>

                <div class="image-preview-box" id="imagePreviewBox">
                    <img id="imagePreview" src="" alt="معاينة">
                    <span style="font-size: 0.8rem; color: var(--success); font-weight: 600; flex: 1;">تم إرفاق صورة المحل ✓</span>
                    <button type="button" class="btn btn-danger" onclick="clearImage()" style="padding: 4px 8px;">حذف الصورة</button>
                </div>
            </div>

            <!-- خانة السوق: قائمة منسدلة + زر (+) للإضافة + زر (✕) للحذف -->
            <div class="form-group">
                <label>السوق</label>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <select id="marketSelect" style="flex: 1;">
                        <option value="">-- اختر السوق أو المنطقة --</option>
                    </select>
                    <button type="button" class="icon-btn icon-btn-add" onclick="addNewMarketPrompt()" title="إضافة سوق جديد">+</button>
                    <button type="button" class="icon-btn icon-btn-del" onclick="deleteSelectedMarket()" title="حذف السوق المحدد">✕</button>
                </div>
            </div>

            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="05xxxxxxxx">
            </div>

            <div class="form-group">
                <label>اللوكيشن (الموقع الجغرافي)</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="locationInput" placeholder="رابط الخريطة أو وصف الموقع..." style="flex: 1;">
                    <button type="button" class="btn" onclick="getCurrentLocation()" style="background:#10b981; color:white; padding:10px 12px; white-space:nowrap;" title="تحديد موقعي الحالي تلقائياً">
                        📍 موقعي
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">💾 حفظ بيانات العميل</button>
            <button type="button" class="btn" id="cancelEditBtn" onclick="resetForm()" style="background:#e5e7eb; color:#374151; width:100%; margin-top:8px; display:none;">إلغاء التعديل</button>
        </form>
    </div>

    <div class="card">
        <h2>📋 قائمة العملاء المسجلين</h2>
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 ابحث باسم العميل، المحل، السوق، أو رقم الهاتف..." oninput="renderCustomers()">
        <div id="customersList">
            <p style="text-align:center; color:#6b7280; padding:20px;">جاري تحميل العملاء...</p>
        </div>
    </div>

    <div class="modal-overlay" id="imageModal" onclick="this.style.display='none'">
        <img id="modalFullImage" class="modal-img" src="" alt="صورة المحل">
    </div>

    <script>
        let customers = [];
        let marketsList = [];
        let tempImageBase64 = '';
        let currentUser = JSON.parse(localStorage.getItem('logged_user')) || { username: 'admin', role: 'admin' };

        function normalizePhone(p) {
            if (!p) return '';
            const arabicNums = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            let str = String(p);
            for (let i = 0; i < 10; i++) {
                str = str.replace(new RegExp(arabicNums[i], 'g'), i);
            }
            return str.replace(/\D/g, '');
        }

        function loadLocalMarketsAndCustomers() {
            const appConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
            const localMarkets = JSON.parse(localStorage.getItem('markets_list_offline') || '[]');
            const localCust = JSON.parse(localStorage.getItem('customers_records_offline') || '[]');
            const localSales = JSON.parse(localStorage.getItem('sales_records_offline') || '[]');

            if (Array.isArray(localCust)) customers = localCust;

            const merged = new Set([
                ...(Array.isArray(appConfig.marketList) ? appConfig.marketList : []),
                ...(Array.isArray(localMarkets) ? localMarkets : [])
            ]);

            customers.forEach(c => { if (c.marketName && c.marketName.trim()) merged.add(c.marketName.trim()); });
            if (Array.isArray(localSales)) {
                localSales.forEach(r => { if (r.marketName && r.marketName.trim()) merged.add(r.marketName.trim()); });
            }

            marketsList = Array.from(merged);
        }

        async function syncMarketsToStorageAndCloud() {
            localStorage.setItem('markets_list_offline', JSON.stringify(marketsList));
            const appConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
            appConfig.marketList = marketsList;
            localStorage.setItem('app_config', JSON.stringify(appConfig));

            try {
                if (window.db) {
                    await window.setDoc(window.doc(window.db, "settings", "app_config"), { marketList: marketsList }, { merge: true });
                    await window.setDoc(window.doc(window.db, "settings", "markets_config"), { marketsList: marketsList }, { merge: true });
                }
            } catch (e) {
                console.error("خطأ في مزامنة الأسواق:", e);
            }
        }

        window.initCustomersApp = async function() {
            loadLocalMarketsAndCustomers();
            renderMarketsDropdown();
            renderCustomers();
            await loadCloudData();
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalMarketsAndCustomers();
            renderMarketsDropdown();
            renderCustomers();
        });

        function renderMarketsDropdown(selectedVal = '') {
            const selectEl = document.getElementById('marketSelect');
            if (!selectEl) return;

            const currentVal = selectedVal || selectEl.value || '';
            const sorted = [...marketsList].sort((a, b) => a.localeCompare(b, 'ar'));
            let html = `<option value="">-- اختر السوق أو المنطقة --</option>`;
            sorted.forEach(m => {
                html += `<option value="${m}" ${m === currentVal ? 'selected' : ''}>${m}</option>`;
            });
            selectEl.innerHTML = html;
        }

        async function addNewMarketPrompt() {
            const newMarket = prompt('✨ أدخل اسم السوق أو المنطقة الجديدة:');
            if (!newMarket || !newMarket.trim()) return;

            const trimmed = newMarket.trim();
            if (!marketsList.includes(trimmed)) {
                marketsList.push(trimmed);
                await syncMarketsToStorageAndCloud();
            }
            renderMarketsDropdown(trimmed);
        }

        async function deleteSelectedMarket() {
            const selectEl = document.getElementById('marketSelect');
            const selected = selectEl.value;
            if (!selected) {
                alert('⚠️ يرجى اختيار السوق من القائمة أولاً لحذفه.');
                return;
            }
            if (confirm(`هل أنت متأكد من حذف السوق (${selected}) من القائمة؟`)) {
                marketsList = marketsList.filter(m => m !== selected);
                await syncMarketsToStorageAndCloud();
                renderMarketsDropdown('');
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxSize) {
                        height *= maxSize / width;
                        width = maxSize;
                    } else if (height > maxSize) {
                        width *= maxSize / height;
                        height = maxSize;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    tempImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    showImagePreview(tempImageBase64);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showImagePreview(src) {
            const box = document.getElementById('imagePreviewBox');
            const img = document.getElementById('imagePreview');
            if (src) {
                img.src = src;
                box.style.display = 'flex';
            } else {
                img.src = '';
                box.style.display = 'none';
            }
        }

        function clearImage() {
            tempImageBase64 = '';
            document.getElementById('shopImageGallery').value = '';
            document.getElementById('shopImageCamera').value = '';
            showImagePreview('');
        }

        function getCurrentLocation() {
            const locInput = document.getElementById('locationInput');
            if (!navigator.geolocation) {
                alert('متصفحك لا يدعم تحديد الموقع تلقائياً.');
                return;
            }

            locInput.value = 'جاري جلب الموقع...';
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    locInput.value = `https://maps.google.com/?q=${lat},${lng}`;
                },
                (err) => {
                    locInput.value = '';
                    alert('تعذر جلب الموقع تلقائياً. تأكد من تفعيل الموقع (GPS) وإعطاء الصلاحية للمتصفح.');
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // استخراج أسماء مجموعات المبيعات والفواتير من الصفحة الرئيسية تلقائياً
        async function getTargetSalesCollections() {
            const cols = new Set(["sales", "sales_records", "invoices", "invoices_records"]);
            try {
                let scriptsText = "";
                if (window.parent && window.parent !== window && window.parent.document) {
                    scriptsText = Array.from(window.parent.document.scripts).map(s => s.textContent || "").join("\n");
                }
                if (!scriptsText) {
                    const res = await fetch("index.html");
                    if (res.ok) scriptsText = await res.text();
                }
                const regex = /collection\s*\(\s*[^,]+,\s*['"]([^'"]+)['"]\s*\)/g;
                let match;
                while ((match = regex.exec(scriptsText)) !== null) {
                    const colName = match[1].trim();
                    const ignore = ["customers", "settings", "employees", "users", "expenses", "inventory", "stock", "sim_cards", "items", "products"];
                    if (colName && !ignore.includes(colName)) {
                        cols.add(colName);
                    }
                }
            } catch (e) {
                console.warn("تعذر فحص مجموعات الصفحة الرئيسية:", e);
            }
            return Array.from(cols);
        }

        // مطابقة سجل فاتورة/مبيعات مع بيانات العميل وتحديد التحديثات المطلوبة
        function computeSaleUpdatesForCustomer(sale, cust, oldCust = null) {
            if (!sale || typeof sale !== 'object') return null;
            // استبعاد سجلات العملاء نفسها
            if (sale.shopImage !== undefined && sale.total === undefined && sale.items === undefined && sale.amount === undefined && sale.price === undefined && sale.remaining === undefined) {
                return null;
            }

            const sClient = (sale.clientName || sale.customerName || '').trim();
            const sShop = (sale.shopName || sale.storeName || '').trim();
            const sPhone = normalizePhone(sale.phone || sale.clientPhone || sale.customerPhone || '');

            const cClient = (cust.clientName || '').trim();
            const cShop = (cust.shopName || '').trim();
            const cPhone = normalizePhone(cust.phone || '');

            const oldClient = oldCust ? (oldCust.clientName || '').trim() : '';
            const oldShop = oldCust ? (oldCust.shopName || '').trim() : '';
            const oldPhone = oldCust ? normalizePhone(oldCust.phone || '') : '';

            let matched = false;

            // 1. مطابقة بمعرف العميل
            if (cust.id && (sale.customerId === cust.id || sale.clientId === cust.id)) {
                matched = true;
            }

            // 2. مطابقة برقم الهاتف (أولوية عالية جداً للفواتير المسجلة سابقاً مثل 0568457868)
            if (!matched && sPhone.length >= 8) {
                if ((cPhone && sPhone === cPhone) || (oldPhone && sPhone === oldPhone)) {
                    matched = true;
                }
            }

            // 3. مطابقة بالاسم القديم عند التعديل المباشر
            if (!matched && oldCust) {
                const oldNames = [oldClient, oldShop].filter(Boolean);
                const saleNames = [sClient, sShop].filter(Boolean);
                if (oldNames.length > 0 && saleNames.some(sn => oldNames.includes(sn))) {
                    matched = true;
                }
            }

            // 4. مطابقة إذا كان أحد الاسمين (العميل أو المحل) متطابقاً والآخر تم تعديله
            if (!matched) {
                if (sClient && sShop && sClient === sShop) {
                    if ((cClient === sClient && cShop && cShop !== sShop) || (cShop === sShop && cClient && cClient !== sClient)) {
                        matched = true;
                    }
                }
            }

            if (!matched) return null;

            // تحديد الاسم الجديد المعتمد
            let targetClientName = cClient || cShop || 'بدون اسم';
            let targetShopName = cShop || cClient || '';

            // إذا كانت الفاتورة تحمل نفس الاسم في الخانتين (مثل: محل كنوز الحاج للاتصال)
            // وكان العميل قد تم تعديل إحدى خانتيه فقط وبقيت الأخرى بالاسم القديم، نعتمد الاسم المعدل للخانتين
            if (sClient && sShop && sClient === sShop) {
                if (cClient && cClient !== sClient && (!cShop || cShop === sShop)) {
                    targetClientName = cClient;
                    targetShopName = cClient;
                } else if (cShop && cShop !== sShop && (!cClient || cClient === sClient)) {
                    targetClientName = cShop;
                    targetShopName = cShop;
                }
            } else if (oldClient && oldShop && oldClient === oldShop) {
                if (cClient !== oldClient && cShop === oldShop) {
                    targetClientName = cClient;
                    targetShopName = cClient;
                } else if (cShop !== oldShop && cClient === oldClient) {
                    targetClientName = cShop;
                    targetShopName = cShop;
                }
            }

            const updates = {};

            if (sale.clientName !== undefined && sale.clientName !== targetClientName) {
                updates.clientName = targetClientName;
            }
            if (sale.customerName !== undefined && sale.customerName !== targetClientName) {
                updates.customerName = targetClientName;
            }
            if (sale.shopName !== undefined && targetShopName && sale.shopName !== targetShopName) {
                updates.shopName = targetShopName;
            }
            if (sale.storeName !== undefined && targetShopName && sale.storeName !== targetShopName) {
                updates.storeName = targetShopName;
            }
            if (cust.marketName && sale.marketName !== undefined && sale.marketName !== cust.marketName) {
                updates.marketName = cust.marketName;
            }
            if (cust.phone && sale.phone !== undefined && sale.phone !== cust.phone) {
                updates.phone = cust.phone;
            }

            return Object.keys(updates).length > 0 ? updates : null;
        }

        // تحديث جميع الفواتير والمبيعات في التخزين المحلي + الصفحة الرئيسية + السحابة
        async function syncCustomerChangesEverywhere(targetCustomers, oldCust = null) {
            const custArray = Array.isArray(targetCustomers) ? targetCustomers : [targetCustomers];
            if (custArray.length === 0) return;

            // 1. توحيد بيانات العميل نفسه إذا كان يحمل اسماً قديماً في إحدى الخانتين
            let customersUpdatedLocally = false;

            // 2. تحديث جميع الجداول المحفوظة في localStorage
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!key || key === 'customers_records_offline' || key === 'markets_list_offline' || key === 'logged_user' || key === 'app_config') continue;

                    const raw = localStorage.getItem(key);
                    if (!raw || !raw.trim().startsWith('[')) continue;

                    try {
                        const arr = JSON.parse(raw);
                        if (!Array.isArray(arr)) continue;

                        let changed = false;
                        arr.forEach(record => {
                            custArray.forEach(c => {
                                const upd = computeSaleUpdatesForCustomer(record, c, oldCust);
                                if (upd) {
                                    Object.assign(record, upd);
                                    changed = true;
                                }
                            });
                        });

                        if (changed) {
                            localStorage.setItem(key, JSON.stringify(arr));
                        }
                    } catch (e) {}
                }
            } catch (e) {
                console.warn("خطأ أثناء تحديث التخزين المحلي:", e);
            }

            // 3. تحديث الذاكرة الحية والواجهة في الصفحة الرئيسية (index.html) فوراً
            syncParentWindowMemoryAndUI(custArray, oldCust);

            // 4. تحديث مجموعات المبيعات والفواتير في Firebase السحابي
            if (window.db) {
                const collectionsToSync = await getTargetSalesCollections();
                for (const colName of collectionsToSync) {
                    try {
                        const snap = await window.getDocs(window.collection(window.db, colName));
                        const updatePromises = [];

                        snap.forEach(docSnap => {
                            const sData = docSnap.data();
                            let combinedUpdates = null;

                            custArray.forEach(c => {
                                const upd = computeSaleUpdatesForCustomer(sData, c, oldCust);
                                if (upd) {
                                    combinedUpdates = { ...(combinedUpdates || {}), ...upd };
                                    // إذا كان العميل نفسه في قاعدة العملاء لا يزال يحتفظ بالاسم القديم في إحدى الخانتين، نحدثه أيضاً
                                    if (upd.clientName && upd.shopName && upd.clientName === upd.shopName) {
                                        if (c.clientName !== upd.clientName || c.shopName !== upd.shopName) {
                                            c.clientName = upd.clientName;
                                            c.shopName = upd.shopName;
                                            customersUpdatedLocally = true;
                                            if (c.id && !String(c.id).startsWith('local_')) {
                                                window.updateDoc(window.doc(window.db, "customers", String(c.id)), {
                                                    clientName: c.clientName,
                                                    shopName: c.shopName
                                                }).catch(() => {});
                                            }
                                        }
                                    }
                                }
                            });

                            if (combinedUpdates && Object.keys(combinedUpdates).length > 0) {
                                updatePromises.push(
                                    window.updateDoc(window.doc(window.db, colName, docSnap.id), combinedUpdates)
                                );
                            }
                        });

                        if (updatePromises.length > 0) {
                            await Promise.all(updatePromises);
                        }
                    } catch (e) {
                        console.warn(`تعذر مزامنة المجموعة ${colName}:`, e);
                    }
                }
            }

            if (customersUpdatedLocally) {
                localStorage.setItem('customers_records_offline', JSON.stringify(customers));
                renderCustomers();
            }

            // إعادة تحديث الصفحة الأم بعد اكتمال مزامنة السحابة
            syncParentWindowMemoryAndUI(custArray, oldCust);
        }

        // تحديث المصفوفات والدوال داخل الصفحة الأم (index.html) بدون الحاجة لعمل ريفريش يدوي
        function syncParentWindowMemoryAndUI(custArray, oldCust = null) {
            try {
                if (!window.parent || window.parent === window) return;

                const pWin = window.parent;
                const scriptsText = Array.from(pWin.document.scripts).map(s => s.textContent || "").join("\n");

                // استخراج أسماء المتغيرات المعرفة في index.html
                const varNames = new Set(["sales", "salesRecords", "salesList", "allSales", "invoices", "invoicesRecords", "invoicesList", "records", "transactions"]);
                const varRegex = /\b(?:let|var|const)\s+([a-zA-Z_$][0-9a-zA-Z_$]*)\s*=/g;
                let m;
                while ((m = varRegex.exec(scriptsText)) !== null) {
                    varNames.add(m[1]);
                }

                let parentDataChanged = false;

                varNames.forEach(vName => {
                    if (vName === "customers" || vName === "marketsList") return;
                    try {
                        const val = pWin.eval(vName);
                        if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'object') {
                            val.forEach(item => {
                                custArray.forEach(c => {
                                    const upd = computeSaleUpdatesForCustomer(item, c, oldCust);
                                    if (upd) {
                                        Object.assign(item, upd);
                                        parentDataChanged = true;
                                    }
                                });
                            });
                        }
                    } catch (e) {}
                });

                // تحديث قائمة العملاء في الصفحة الأم إن وجدت
                try {
                    const pCust = pWin.eval("typeof customers !== 'undefined' ? customers : null");
                    if (Array.isArray(pCust)) {
                        pCust.length = 0;
                        customers.forEach(c => pCust.push({ ...c }));
                    }
                } catch (e) {}

                // استدعاء دوال إعادة الرسم في الصفحة الأم لتحديث الفواتير والمبيعات فوراً
                if (parentDataChanged) {
                    const fnNames = new Set([
                        "renderInvoices", "renderSales", "renderRecords", "renderAll",
                        "renderDebts", "updateDashboard", "updateStats", "filterInvoices", "filterSales"
                    ]);
                    const fnRegex = /function\s+((?:render|update|filter)[a-zA-Z0-9_$]*)\s*\(\s*\)/g;
                    let fm;
                    while ((fm = fnRegex.exec(scriptsText)) !== null) {
                        fnNames.add(fm[1]);
                    }
                    fnNames.forEach(fn => {
                        try {
                            pWin.eval(`if (typeof ${fn} === 'function') ${fn}();`);
                        } catch (e) {}
                    });
                }
            } catch (e) {
                console.warn("تعذر تحديث ذاكرة الصفحة الأم مباشرة:", e);
            }
        }

        async function loadCloudData() {
            try {
                if (!window.db) {
                    renderCustomers();
                    return;
                }

                const mergedMarkets = new Set(marketsList);

                const appConfigSnap = await window.getDoc(window.doc(window.db, "settings", "app_config"));
                if (appConfigSnap.exists()) {
                    const cData = appConfigSnap.data();
                    if (Array.isArray(cData.marketList)) {
                        cData.marketList.forEach(m => { if (m && m.trim()) mergedMarkets.add(m.trim()); });
                    }
                }

                const marketSnap = await window.getDoc(window.doc(window.db, "settings", "markets_config"));
                if (marketSnap.exists()) {
                    const mData = marketSnap.data();
                    if (Array.isArray(mData.marketsList)) {
                        mData.marketsList.forEach(m => { if (m && m.trim()) mergedMarkets.add(m.trim()); });
                    }
                }

                const querySnapshot = await window.getDocs(window.collection(window.db, "customers"));
                const cloudList = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    cloudList.push({ ...data, id: docSnap.id });
                    if (data.marketName && data.marketName.trim()) {
                        mergedMarkets.add(data.marketName.trim());
                    }
                });

                marketsList = Array.from(mergedMarkets);
                localStorage.setItem('markets_list_offline', JSON.stringify(marketsList));
                const appConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
                appConfig.marketList = marketsList;
                localStorage.setItem('app_config', JSON.stringify(appConfig));

                cloudList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                customers = cloudList;
                localStorage.setItem('customers_records_offline', JSON.stringify(customers));

                // مزامنة تلقائية لجميع العملاء مع الفواتير والمبيعات (لتعديل أي فواتير قديمة مثل محل كنوز)
                await syncCustomerChangesEverywhere(customers);
            } catch (error) {
                console.error("خطأ أثناء جلب البيانات من السحابة:", error);
            } finally {
                renderMarketsDropdown();
                renderCustomers();
            }
        }

        async function saveCustomer(event) {
            event.preventDefault();

            const editId = document.getElementById('editCustomerId').value;
            let clientName = document.getElementById('clientName').value.trim();
            let shopName = document.getElementById('shopName').value.trim();
            const marketName = document.getElementById('marketSelect').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const location = document.getElementById('locationInput').value.trim();

            if (!clientName && !shopName && !phone) {
                alert('يرجى إدخال اسم العميل أو اسم المحل أو رقم الهاتف على الأقل.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ جاري الحفظ وتحديث الفواتير...';

            let oldCustomerSnapshot = null;

            if (editId) {
                const existing = customers.find(c => String(c.id) === String(editId));
                if (existing) {
                    oldCustomerSnapshot = { ...existing };
                    const oldC = (existing.clientName || '').trim();
                    const oldS = (existing.shopName || '').trim();

                    // إذا كان اسم العميل واسم المحل متطابقين سابقاً وعدّل المستخدم أحدهما فقط، نوحد الجديد في الخانتين
                    if (oldC && oldS && oldC === oldS) {
                        if (clientName !== oldC && shopName === oldS) {
                            shopName = clientName;
                        } else if (shopName !== oldS && clientName === oldC) {
                            clientName = shopName;
                        }
                    }
                }
            }

            const finalClientName = clientName || shopName || 'بدون اسم';
            const finalShopName = shopName || clientName || '';

            const customerData = {
                clientName: finalClientName,
                shopName: finalShopName,
                marketName: marketName || '',
                phone: phone || '',
                location: location || '',
                shopImage: tempImageBase64 || '',
                addedBy: currentUser.username || 'admin',
                updatedAt: Date.now()
            };

            try {
                let savedRecord = null;

                if (editId) {
                    const index = customers.findIndex(c => String(c.id) === String(editId));
                    if (index !== -1) {
                        customerData.createdAt = customers[index].createdAt || Date.now();
                        savedRecord = { ...customerData, id: editId };
                        customers[index] = savedRecord;
                    } else {
                        savedRecord = { ...customerData, id: editId };
                    }

                    localStorage.setItem('customers_records_offline', JSON.stringify(customers));

                    if (window.db && !String(editId).startsWith('local_')) {
                        const docRef = window.doc(window.db, "customers", String(editId));
                        await window.updateDoc(docRef, customerData);
                    }

                    // تحديث الفواتير والمبيعات فوراً
                    await syncCustomerChangesEverywhere(savedRecord, oldCustomerSnapshot);
                } else {
                    customerData.createdAt = Date.now();
                    if (window.db) {
                        const docRef = await window.addDoc(window.collection(window.db, "customers"), customerData);
                        savedRecord = { ...customerData, id: docRef.id };
                    } else {
                        savedRecord = { ...customerData, id: 'local_' + Date.now() };
                    }
                    customers.unshift(savedRecord);
                    localStorage.setItem('customers_records_offline', JSON.stringify(customers));
                    await syncCustomerChangesEverywhere(savedRecord, null);
                }

                resetForm();
                renderCustomers();
            } catch (error) {
                console.error("خطأ أثناء حفظ العميل:", error);
                if (!editId) {
                    customerData.createdAt = Date.now();
                    customers.unshift({ ...customerData, id: 'local_' + Date.now() });
                }
                localStorage.setItem('customers_records_offline', JSON.stringify(customers));
                resetForm();
                renderCustomers();
                alert('تم حفظ البيانات محلياً على الجهاز (تعذر الاتصال بالسحابة حالياً).');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '💾 حفظ بيانات العميل';
            }
        }

        function renderCustomers() {
            const listEl = document.getElementById('customersList');
            const countEl = document.getElementById('topCustomersCount');
            const searchQuery = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();

            if (countEl) {
                countEl.textContent = customers.length;
            }

            const filtered = customers.filter(c => {
                return (
                    (c.clientName && c.clientName.toLowerCase().includes(searchQuery)) ||
                    (c.shopName && c.shopName.toLowerCase().includes(searchQuery)) ||
                    (c.marketName && c.marketName.toLowerCase().includes(searchQuery)) ||
                    (c.phone && c.phone.includes(searchQuery))
                );
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:#6b7280; padding:20px;">${
                    customers.length === 0 ? 'لا يوجد عملاء مسجلين حالياً. ابدأ بإضافة عميل جديد من الأعلى.' : 'لا توجد نتائج مطابقة للبحث.'
                }</p>`;
                return;
            }

            listEl.innerHTML = filtered.map(c => {
                const isUrl = c.location && (c.location.startsWith('http://') || c.location.startsWith('https://'));
                const locHtml = c.location
                    ? (isUrl
                        ? `<a href="${c.location}" target="_blank" class="loc-link">📍 فتح الموقع</a>`
                        : `<span class="loc-link">📍 ${c.location}</span>`)
                    : '';

                const phoneHtml = c.phone
                    ? `<a href="tel:${c.phone}" class="phone-link">📞 ${c.phone}</a>`
                    : '';

                const thumbHtml = c.shopImage
                    ? `<img src="${c.shopImage}" class="shop-thumb" alt="صورة المحل" onclick="openImageModal('${c.shopImage}')">`
                    : '';

                return `
                    <div class="customer-card">
                        <div class="customer-details">
                            <div class="customer-title">
                                <span class="client-name">👤 ${c.clientName || 'بدون اسم'}</span>
                                ${c.shopName ? `<span class="badge shop-badge">🏪 ${c.shopName}</span>` : ''}
                                ${c.marketName ? `<span class="badge market-badge">📍 ${c.marketName}</span>` : ''}
                            </div>
                            <div class="info-row">
                                ${phoneHtml}
                                ${locHtml}
                            </div>
                        </div>
                        ${thumbHtml}
                        <div class="card-actions">
                            <span class="badge emp-badge">بواسطة: ${c.addedBy || 'admin'}</span>
                            <div style="display:flex; gap:6px;">
                                <button type="button" class="btn btn-warning" onclick="editCustomer('${c.id}')">✏️ تعديل</button>
                                <button type="button" class="btn btn-danger" onclick="deleteCustomer('${c.id}')">🗑️ حذف</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editCustomer(id) {
            const c = customers.find(item => String(item.id) === String(id));
            if (!c) return;

            document.getElementById('editCustomerId').value = c.id;
            document.getElementById('clientName').value = c.clientName || '';
            document.getElementById('shopName').value = c.shopName || '';
            
            if (c.marketName && !marketsList.includes(c.marketName)) {
                marketsList.push(c.marketName);
            }
            renderMarketsDropdown(c.marketName || '');
            
            document.getElementById('phone').value = c.phone || '';
            document.getElementById('locationInput').value = c.location || '';

            tempImageBase64 = c.shopImage || '';
            showImagePreview(tempImageBase64);

            document.getElementById('formTitle').textContent = '✏️ تعديل بيانات العميل';
            document.getElementById('submitBtn').textContent = '💾 تحديث بيانات العميل';
            document.getElementById('cancelEditBtn').style.display = 'inline-flex';

            document.getElementById('customerFormCard').scrollIntoView({ behavior: 'smooth' });
        }

        async function deleteCustomer(id) {
            if (!confirm('هل أنت متأكد من حذف هذا العميل؟')) return;

            customers = customers.filter(c => String(c.id) !== String(id));
            localStorage.setItem('customers_records_offline', JSON.stringify(customers));
            renderCustomers();

            try {
                if (window.db && !String(id).startsWith('local_')) {
                    await window.deleteDoc(window.doc(window.db, "customers", String(id)));
                }
            } catch (error) {
                console.error("خطأ أثناء حذف العميل من السحابة:", error);
            }
        }

        function resetForm() {
            document.getElementById('customerForm').reset();
            document.getElementById('editCustomerId').value = '';
            renderMarketsDropdown('');
            clearImage();
            document.getElementById('formTitle').textContent = '+ إضافة عميل جديد';
            document.getElementById('submitBtn').textContent = '💾 حفظ بيانات العميل';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function openImageModal(src) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalFullImage');
            if (modal && modalImg) {
                modalImg.src = src;
                modal.style.display = 'flex';
            }
        }
    </script>
