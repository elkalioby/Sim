<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللوكيشن - متجر سيم</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 950px;
            margin: 0 auto;
        }

        /* شريط البحث والفلترة بالأيقونات */
        .top-controls {
            background: var(--card);
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #f9fafb;
        }

        .search-box input:focus {
            border-color: var(--primary-light);
            background: #fff;
        }

        .clear-search-btn {
            position: absolute;
            left: 8px;
            background: #e5e7eb;
            color: #374151;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .category-filter-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .filter-chip {
            border: 1px solid var(--border);
            background: #f8fafc;
            color: var(--text);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 3px 8px rgba(30, 58, 138, 0.22);
        }

        /* البطاقة والنموذج */
        .card {
            background: var(--card);
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #374151;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 68px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-light);
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            opacity: 0.85;
        }

        .btn-primary {
            background-color: var(--primary-light);
            color: white;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            font-size: 1rem;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            padding: 0;
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
        }

        .icon-btn-add { background-color: var(--success); }
        .icon-btn-del { background-color: var(--danger); }

        /* معاينة الصورة المرفقة */
        .image-preview-box {
            margin-top: 8px;
            display: none;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }

        .image-preview-box img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        /* اختيار اللون للتاب */
        .color-picker-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 4px;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .color-dot.selected {
            border-color: #111827;
            transform: scale(1.15);
        }

        /* أقسام العرض بالأيقونات فقط */
        .sections-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-section {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-header.has-items {
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
        }

        .category-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
        }

        .category-count {
            background: #e2e8f0;
            color: #1e293b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
        }

        /* شبكة التابات الملونة للأماكن */
        .places-tabs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .place-tab-card {
            border-radius: 14px;
            padding: 14px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .place-tab-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
        }

        /* تدرجات ألوان متنوعة للتابات */
        .theme-blue { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
        .theme-emerald { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
        .theme-sunset { background: linear-gradient(135deg, #f97316 0%, #c2410c 100%); }
        .theme-purple { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); }
        .theme-rose { background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%); }
        .theme-teal { background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%); }
        .theme-amber { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); }
        .theme-indigo { background: linear-gradient(135deg, #6366f1 0%, #3730a3 100%); }

        .place-top-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .place-thumb {
            width: 60px;
            height: 60px;
            border-radius: 11px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
        }

        .place-icon-fallback {
            width: 52px;
            height: 52px;
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .place-info {
            flex: 1;
            min-width: 0;
        }

        .place-name {
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1.3;
        }

        .place-notes {
            font-size: 0.83rem;
            background: rgba(0, 0, 0, 0.16);
            padding: 6px 9px;
            border-radius: 8px;
            margin-top: 6px;
            line-height: 1.4;
            word-break: break-word;
        }

        .place-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            font-size: 0.78rem;
        }

        .map-open-hint {
            background: rgba(255, 255, 255, 0.24);
            padding: 5px 10px;
            border-radius: 7px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .place-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .action-icon-btn {
            background: rgba(255, 255, 255, 0.22);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.15s, background 0.15s;
        }

        .action-icon-btn:hover {
            background: rgba(255, 255, 255, 0.38);
            transform: scale(1.07);
        }

        /* زرار واتساب الرسمي الأخضر */
        .whatsapp-btn {
            background: #25D366 !important;
            color: white !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .whatsapp-btn:hover {
            background: #1ebe5d !important;
        }

        .no-results-box {
            background: var(--card);
            border-radius: 14px;
            padding: 28px 16px;
            text-align: center;
            color: var(--text-muted);
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* نافذة تكبير الصورة */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.78);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-img {
            max-width: 95%;
            max-height: 85vh;
            border-radius: 12px;
        }
    </style>

    <!-- ربط Firebase السحابي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLlNld1YOKrX6uq15aF4BhJjWPwV40osY",
            authDomain: "ahmed-hassan-bb80b.firebaseapp.com",
            projectId: "ahmed-hassan-bb80b",
            storageBucket: "ahmed-hassan-bb80b.firebasestorage.app",
            messagingSenderId: "503682153846",
            appId: "1:503682153846:web:93b3a174ab31e351a04e57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;

        if (window.initLocationsCloud) {
            window.initLocationsCloud();
        }
    </script>
</head>
<body>

    <!-- شريط البحث والفلترة بالأيقونات فقط -->
    <div class="top-controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو الملاحظات..." oninput="handleSearch()" onkeyup="handleSearch()">
            <button type="button" class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()" title="مسح البحث">✕</button>
        </div>
        <div class="category-filter-bar" id="categoryFilterBar"></div>
    </div>

    <!-- بطاقة التسجيل -->
    <div class="card" id="formCard">
        <h2 id="formTitle">التسجيل</h2>
        <form id="locationForm" onsubmit="savePlace(event)" novalidate>
            <input type="hidden" id="editPlaceId" value="">

            <!-- اسم المكان + أزرار الصورة -->
            <div class="form-group">
                <label>اسم المكان</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="placeName" placeholder="أدخل اسم المكان..." style="flex: 1;">
                    
                    <input type="file" id="placeImageGallery" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                    <button type="button" class="btn" onclick="document.getElementById('placeImageGallery').click()" style="background:#e5e7eb; color:#1f2937; padding:10px 12px;" title="اختيار صورة من الهاتف">📁</button>
                    
                    <input type="file" id="placeImageCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleImageUpload(event)">
                    <button type="button" class="btn" onclick="document.getElementById('placeImageCamera').click()" style="background:#2563eb; color:white; padding:10px 12px;" title="تصوير بالكاميرا">📷</button>
                </div>

                <div class="image-preview-box" id="imagePreviewBox">
                    <img id="imagePreview" src="" alt="معاينة">
                    <span style="font-size: 0.8rem; color: var(--success); font-weight: 600; flex: 1;">تم إرفاق الصورة ✓</span>
                    <button type="button" class="btn" onclick="clearImage()" style="background:#fee2e2; color:var(--danger); padding: 4px 8px; font-size:0.8rem;">✕</button>
                </div>
            </div>

            <!-- القسم -->
            <div class="form-group">
                <label>القسم</label>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <select id="placeCategory" style="flex: 1; font-size: 1.15rem;"></select>
                    <button type="button" class="icon-btn icon-btn-add" onclick="addNewCategoryPrompt()" title="إضافة قسم جديد">+</button>
                    <button type="button" class="icon-btn icon-btn-del" onclick="deleteSelectedCategory()" title="حذف القسم المحدد">✕</button>
                </div>
            </div>

            <!-- اللوكيشن تحت القسم مباشرة -->
            <div class="form-group">
                <label>اللوكيشن</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="locationInput" placeholder="رابط الخريطة أو اضغط موقعي..." style="flex: 1;">
                    <button type="button" class="btn" id="gpsBtn" onclick="getCurrentLocation()" style="background:#10b981; color:white; padding:10px 14px; white-space:nowrap;" title="تحديد موقعي بالضبط تلقائياً">
                        📍 موقعي
                    </button>
                </div>
            </div>

            <!-- اللون -->
            <div class="form-group">
                <label>اللون</label>
                <div class="color-picker-row">
                    <div class="color-dot selected" data-theme="auto" style="background: conic-gradient(#2563eb, #10b981, #f97316, #8b5cf6, #f43f5e);" onclick="selectColorTheme('auto', this)">تلقائي</div>
                    <div class="color-dot" data-theme="theme-blue" style="background: #2563eb;" onclick="selectColorTheme('theme-blue', this)"></div>
                    <div class="color-dot" data-theme="theme-emerald" style="background: #10b981;" onclick="selectColorTheme('theme-emerald', this)"></div>
                    <div class="color-dot" data-theme="theme-sunset" style="background: #f97316;" onclick="selectColorTheme('theme-sunset', this)"></div>
                    <div class="color-dot" data-theme="theme-purple" style="background: #8b5cf6;" onclick="selectColorTheme('theme-purple', this)"></div>
                    <div class="color-dot" data-theme="theme-rose" style="background: #f43f5e;" onclick="selectColorTheme('theme-rose', this)"></div>
                    <div class="color-dot" data-theme="theme-teal" style="background: #06b6d4;" onclick="selectColorTheme('theme-teal', this)"></div>
                    <div class="color-dot" data-theme="theme-amber" style="background: #eab308;" onclick="selectColorTheme('theme-amber', this)"></div>
                </div>
            </div>

            <!-- ملاحظات -->
            <div class="form-group">
                <label>ملاحظات</label>
                <textarea id="placeNotes" placeholder="اكتب ملاحظة..."></textarea>
            </div>

            <!-- زر حفظ -->
            <button type="submit" class="btn btn-primary" id="submitBtn">حفظ</button>
            <button type="button" class="btn" id="cancelEditBtn" onclick="resetForm()" style="background:#e5e7eb; color:#374151; width:100%; margin-top:8px; display:none;">إلغاء</button>
        </form>
    </div>

    <!-- عرض الأقسام والتابات الملونة -->
    <div class="sections-wrapper" id="sectionsWrapper"></div>

    <!-- نافذة تكبير الصورة -->
    <div class="modal-overlay" id="imageModal" onclick="this.style.display='none'">
        <img id="modalFullImage" class="modal-img" src="" alt="صورة المكان">
    </div>

    <script>
        const TAB_THEMES = [
            'theme-blue',
            'theme-emerald',
            'theme-sunset',
            'theme-purple',
            'theme-rose',
            'theme-teal',
            'theme-amber',
            'theme-indigo'
        ];

        const DEFAULT_CATEGORIES = [
            { id: 'markets', icon: '🛒', color: '#2563eb' },
            { id: 'restaurants', icon: '🍽️', color: '#ea580c' }
        ];

        let categories = [];
        let places = [];
        let activeCategoryFilter = 'all';
        let selectedTheme = 'auto';
        let tempImageBase64 = '';

        // دالة توحيد الحروف العربية لضمان دقة البحث
        function normalizeArabic(text) {
            if (!text) return '';
            return String(text)
                .toLowerCase()
                .trim()
                .replace(/[\u064B-\u065F\u0670]/g, '') // إزالة التشكيل
                .replace(/[أإآٱ]/g, 'ا')              // توحيد الألف
                .replace(/ة/g, 'ه')                   // توحيد التاء المربوطة والهاء
                .replace(/ى/g, 'ي')                   // توحيد الياء
                .replace(/ؤ/g, 'و')
                .replace(/ئ/g, 'ي');
        }

        function handleSearch() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            const formCard = document.getElementById('formCard');
            const editId = document.getElementById('editPlaceId').value;
            const hasQuery = input && input.value.trim().length > 0;

            if (clearBtn) {
                clearBtn.style.display = hasQuery ? 'inline-flex' : 'none';
            }

            // إخفاء نموذج التسجيل مؤقتاً أثناء البحث لتظهر النتائج فوراً تحت شريط البحث
            if (formCard && !editId) {
                formCard.style.display = hasQuery ? 'none' : 'block';
            }

            renderAllSections();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            if (input) {
                input.value = '';
                handleSearch();
                input.focus();
            }
        }

        function loadLocalData() {
            const savedCats = JSON.parse(localStorage.getItem('sim_loc_categories') || 'null');
            if (Array.isArray(savedCats) && savedCats.length > 0) {
                categories = savedCats.map(c => ({
                    id: c.id,
                    icon: c.icon || '📍',
                    color: c.color || '#2563eb'
                }));
            } else {
                categories = [...DEFAULT_CATEGORIES];
            }

            const savedPlaces = JSON.parse(localStorage.getItem('sim_saved_places') || '[]');
            if (Array.isArray(savedPlaces)) {
                places = savedPlaces;
            }
            localStorage.setItem('sim_loc_categories', JSON.stringify(categories));
        }

        function saveLocalData() {
            localStorage.setItem('sim_loc_categories', JSON.stringify(categories));
            localStorage.setItem('sim_saved_places', JSON.stringify(places));
        }

        window.initLocationsCloud = async function() {
            loadLocalData();
            renderCategoryControls();
            renderAllSections();
            await loadFromCloud();
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalData();
            renderCategoryControls();
            renderAllSections();
        });

        async function syncCategoriesToCloud() {
            saveLocalData();
            try {
                if (window.db) {
                    await window.setDoc(window.doc(window.db, "settings", "locations_config"), { categories: categories }, { merge: true });
                }
            } catch (e) {
                console.error("خطأ في مزامنة الأقسام:", e);
            }
        }

        async function loadFromCloud() {
            try {
                if (!window.db) return;

                const catSnap = await window.getDoc(window.doc(window.db, "settings", "locations_config"));
                if (catSnap.exists() && Array.isArray(catSnap.data().categories) && catSnap.data().categories.length > 0) {
                    categories = catSnap.data().categories.map(c => ({
                        id: c.id,
                        icon: c.icon || '📍',
                        color: c.color || '#2563eb'
                    }));
                }

                const querySnapshot = await window.getDocs(window.collection(window.db, "locations"));
                const cloudPlaces = [];
                querySnapshot.forEach((docSnap) => {
                    cloudPlaces.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (cloudPlaces.length > 0) {
                    cloudPlaces.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    places = cloudPlaces;
                }

                saveLocalData();
            } catch (e) {
                console.error("خطأ في جلب اللوكيشن من السحابة:", e);
            } finally {
                renderCategoryControls();
                renderAllSections();
            }
        }

        function renderCategoryControls() {
            const select = document.getElementById('placeCategory');
            const filterBar = document.getElementById('categoryFilterBar');
            const currentSelected = select.value;

            select.innerHTML = categories.map(cat =>
                `<option value="${cat.id}" ${cat.id === currentSelected ? 'selected' : ''}>${cat.icon}</option>`
            ).join('');

            let filterHtml = `
                <button type="button" class="filter-chip ${activeCategoryFilter === 'all' ? 'active' : ''}" onclick="setCategoryFilter('all')">
                    🌟 (${places.length})
                </button>
            `;

            categories.forEach(cat => {
                const count = places.filter(p => p.categoryId === cat.id).length;
                filterHtml += `
                    <button type="button" class="filter-chip ${activeCategoryFilter === cat.id ? 'active' : ''}" onclick="setCategoryFilter('${cat.id}')">
                        <span>${cat.icon}</span> <span>(${count})</span>
                    </button>
                `;
            });

            filterBar.innerHTML = filterHtml;
        }

        function setCategoryFilter(catId) {
            activeCategoryFilter = catId;
            renderCategoryControls();
            renderAllSections();
        }

        async function addNewCategoryPrompt() {
            const icon = prompt('أدخل أيقونة القسم الجديد (مثال: ☕ أو 📦 أو 🏢):', '📍');
            if (!icon || !icon.trim()) return;

            const colors = ['#0d9488', '#7c3aed', '#e11d48', '#0284c7', '#16a34a'];
            const newCat = {
                id: 'cat_' + Date.now(),
                icon: icon.trim(),
                color: colors[categories.length % colors.length]
            };

            categories.push(newCat);
            await syncCategoriesToCloud();
            renderCategoryControls();
            renderAllSections();
            document.getElementById('placeCategory').value = newCat.id;
        }

        async function deleteSelectedCategory() {
            const selectEl = document.getElementById('placeCategory');
            const catId = selectEl.value;
            if (!catId) return;

            const catObj = categories.find(c => c.id === catId);
            if (!confirm(`هل أنت متأكد من حذف القسم (${catObj ? catObj.icon : ''})؟`)) return;

            const toDeletePlaces = places.filter(p => p.categoryId === catId);
            categories = categories.filter(c => c.id !== catId);
            places = places.filter(p => p.categoryId !== catId);
            if (activeCategoryFilter === catId) activeCategoryFilter = 'all';

            await syncCategoriesToCloud();
            renderCategoryControls();
            renderAllSections();

            if (window.db) {
                for (const p of toDeletePlaces) {
                    if (!String(p.id).startsWith('local_')) {
                        try { await window.deleteDoc(window.doc(window.db, "locations", p.id)); } catch (e) {}
                    }
                }
            }
        }

        function selectColorTheme(theme, el) {
            selectedTheme = theme;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 700;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxSize) {
                        height *= maxSize / width;
                        width = maxSize;
                    } else if (height > maxSize) {
                        width *= maxSize / height;
                        height = maxSize;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    tempImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    showImagePreview(tempImageBase64);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showImagePreview(src) {
            const box = document.getElementById('imagePreviewBox');
            const img = document.getElementById('imagePreview');
            if (src) {
                img.src = src;
                box.style.display = 'flex';
            } else {
                img.src = '';
                box.style.display = 'none';
            }
        }

        function clearImage() {
            tempImageBase64 = '';
            document.getElementById('placeImageGallery').value = '';
            document.getElementById('placeImageCamera').value = '';
            showImagePreview('');
        }

        function getCurrentLocation() {
            return new Promise((resolve, reject) => {
                const locInput = document.getElementById('locationInput');
                if (!navigator.geolocation) {
                    alert('متصفحك لا يدعم تحديد الموقع تلقائياً.');
                    reject('no_geolocation');
                    return;
                }

                locInput.value = 'جاري جلب الموقع الدقيق...';
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const exactUrl = `https://maps.google.com/?q=${lat},${lng}`;
                        locInput.value = exactUrl;
                        resolve(exactUrl);
                    },
                    (err) => {
                        locInput.value = '';
                        alert('تعذر جلب الموقع تلقائياً. تأكد من تفعيل الموقع (GPS) وإعطاء الصلاحية للمتصفح.');
                        reject(err);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 20000,
                        maximumAge: 0
                    }
                );
            });
        }

        async function savePlace(event) {
            event.preventDefault();

            const editId = document.getElementById('editPlaceId').value;
            const name = document.getElementById('placeName').value.trim();
            const categoryId = document.getElementById('placeCategory').value;
            const notes = document.getElementById('placeNotes').value.trim();
            let locationUrl = document.getElementById('locationInput').value.trim();

            if (!name) {
                alert('يرجى إدخال اسم المكان أولاً.');
                document.getElementById('placeName').focus();
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳...';

            if (!locationUrl || locationUrl === 'جاري جلب الموقع الدقيق...') {
                try {
                    locationUrl = await getCurrentLocation();
                } catch (e) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'حفظ';
                    return;
                }
            }

            let chosenTheme = selectedTheme;
            if (chosenTheme === 'auto') {
                chosenTheme = TAB_THEMES[places.length % TAB_THEMES.length];
            }

            const placeData = {
                name: name,
                categoryId: categoryId,
                location: locationUrl,
                notes: notes,
                photo: tempImageBase64 || '',
                theme: chosenTheme,
                timestamp: Date.now()
            };

            try {
                if (editId) {
                    const idx = places.findIndex(p => p.id === editId);
                    if (idx !== -1) {
                        if (selectedTheme === 'auto' && places[idx].theme) {
                            placeData.theme = places[idx].theme;
                        }
                        places[idx] = { id: editId, ...placeData };
                    }
                    if (window.db && !String(editId).startsWith('local_')) {
                        await window.updateDoc(window.doc(window.db, "locations", editId), placeData);
                    }
                } else {
                    if (window.db) {
                        const docRef = await window.addDoc(window.collection(window.db, "locations"), placeData);
                        places.unshift({ id: docRef.id, ...placeData });
                    } else {
                        places.unshift({ id: 'local_' + Date.now(), ...placeData });
                    }
                }

                saveLocalData();
                resetForm();
                renderCategoryControls();
                renderAllSections();
            } catch (error) {
                console.error("خطأ أثناء حفظ المكان:", error);
                if (!editId) {
                    places.unshift({ id: 'local_' + Date.now(), ...placeData });
                    saveLocalData();
                    resetForm();
                    renderCategoryControls();
                    renderAllSections();
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'حفظ';
            }
        }

        function getPlaceMapUrl(place) {
            let loc = (place.location || '').trim();
            if (!loc && place.lat && place.lng) {
                loc = `https://maps.google.com/?q=${place.lat},${place.lng}`;
            }
            if (loc && !loc.startsWith('http://') && !loc.startsWith('https://')) {
                loc = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`;
            }
            return loc;
        }

        function openPlaceInMap(placeId) {
            const place = places.find(p => p.id === placeId);
            if (!place) return;
            const url = getPlaceMapUrl(place);
            if (url) window.open(url, '_blank');
        }

        function sharePlaceWhatsApp(event, placeId) {
            event.stopPropagation();
            const place = places.find(p => p.id === placeId);
            if (!place) return;

            const mapUrl = getPlaceMapUrl(place);
            const text = `📍 *${place.name}*\n${place.notes ? '📝 ' + place.notes + '\n' : ''}🗺️ ${mapUrl}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function editPlace(event, id) {
            event.stopPropagation();
            const p = places.find(item => item.id === id);
            if (!p) return;

            const formCard = document.getElementById('formCard');
            if (formCard) formCard.style.display = 'block';

            document.getElementById('editPlaceId').value = p.id;
            document.getElementById('placeName').value = p.name || '';
            document.getElementById('placeCategory').value = p.categoryId || (categories[0] && categories[0].id);
            document.getElementById('locationInput').value = p.location || (p.lat && p.lng ? `https://maps.google.com/?q=${p.lat},${p.lng}` : '');
            document.getElementById('placeNotes').value = p.notes || '';

            tempImageBase64 = p.photo || '';
            showImagePreview(tempImageBase64);

            document.getElementById('cancelEditBtn').style.display = 'inline-flex';
            formCard.scrollIntoView({ behavior: 'smooth' });
        }

        async function deletePlace(event, id) {
            event.stopPropagation();
            if (!confirm('حذف هذا المكان؟')) return;

            places = places.filter(p => p.id !== id);
            saveLocalData();
            renderCategoryControls();
            renderAllSections();

            try {
                if (window.db && !String(id).startsWith('local_')) {
                    await window.deleteDoc(window.doc(window.db, "locations", id));
                }
            } catch (e) {
                console.error("خطأ أثناء الحذف من السحابة:", e);
            }
        }

        function resetForm() {
            document.getElementById('locationForm').reset();
            document.getElementById('editPlaceId').value = '';
            clearImage();
            document.getElementById('cancelEditBtn').style.display = 'none';
            handleSearch();
        }

        function openImageModal(event, src) {
            event.stopPropagation();
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalFullImage');
            if (modal && modalImg) {
                modalImg.src = src;
                modal.style.display = 'flex';
            }
        }

        function buildPlaceCardHtml(place, idx, fallbackIcon) {
            const themeClass = place.theme || TAB_THEMES[idx % TAB_THEMES.length];
            const thumbHtml = place.photo
                ? `<img src="${place.photo}" class="place-thumb" alt="${place.name}" onclick="openImageModal(event, '${place.photo}')">`
                : `<div class="place-icon-fallback">${fallbackIcon || '📍'}</div>`;

            return `
                <div class="place-tab-card ${themeClass}" onclick="openPlaceInMap('${place.id}')">
                    <div class="place-top-row">
                        ${thumbHtml}
                        <div class="place-info">
                            <div class="place-name">${place.name || 'بدون اسم'}</div>
                            ${place.notes ? `<div class="place-notes">${place.notes}</div>` : ''}
                        </div>
                    </div>
                    <div class="place-footer">
                        <span class="map-open-hint">🗺️ Google Maps</span>
                        <div class="place-actions">
                            <button type="button" class="action-icon-btn whatsapp-btn" onclick="sharePlaceWhatsApp(event, '${place.id}')" title="مشاركة عبر واتساب">
                                <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
                                    <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c0 .072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12 0 2.124.556 4.119 1.529 5.847l-1.529 5.583 5.714-1.499c1.693.922 3.635 1.449 5.702 1.449 6.627 0 12-5.373 12-12s-5.373-12-12-12z"/>
                                </svg>
                            </button>
                            <button type="button" class="action-icon-btn" onclick="editPlace(event, '${place.id}')" title="تعديل">✏️</button>
                            <button type="button" class="action-icon-btn" onclick="deletePlace(event, '${place.id}')" title="حذف">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAllSections() {
            const wrapper = document.getElementById('sectionsWrapper');
            const rawQuery = (document.getElementById('searchInput')?.value || '').trim();
            const normalizedQuery = normalizeArabic(rawQuery);

            const matchesQuery = (p) => {
                if (!normalizedQuery) return true;
                const normName = normalizeArabic(p.name || '');
                const normNotes = normalizeArabic(p.notes || '');
                return normName.includes(normalizedQuery) || normNotes.includes(normalizedQuery);
            };

            // في حالة كتابة نص في البحث: ابحث في كافة الأقسام وأخفِ الأقسام الفارغة
            if (normalizedQuery) {
                let totalMatches = 0;
                const knownCatIds = new Set(categories.map(c => c.id));

                let sectionsHtml = categories.map(cat => {
                    if (activeCategoryFilter !== 'all' && activeCategoryFilter !== cat.id) return '';
                    const catPlaces = places.filter(p => p.categoryId === cat.id && matchesQuery(p));
                    if (catPlaces.length === 0) return '';

                    totalMatches += catPlaces.length;
                    return `
                        <section class="category-section">
                            <div class="category-header has-items">
                                <div class="category-title-group">
                                    <div class="category-icon-box" style="background: ${cat.color || '#2563eb'}">${cat.icon}</div>
                                    <span class="category-count">${catPlaces.length}</span>
                                </div>
                            </div>
                            <div class="places-tabs-grid">
                                ${catPlaces.map((place, idx) => buildPlaceCardHtml(place, idx, cat.icon)).join('')}
                            </div>
                        </section>
                    `;
                }).join('');

                // إظهار أي أماكن مطابقة غير مرتبطة بقسم حالي
                const uncategorizedPlaces = places.filter(p => !knownCatIds.has(p.categoryId) && matchesQuery(p));
                if (uncategorizedPlaces.length > 0 && activeCategoryFilter === 'all') {
                    totalMatches += uncategorizedPlaces.length;
                    sectionsHtml += `
                        <section class="category-section">
                            <div class="category-header has-items">
                                <div class="category-title-group">
                                    <div class="category-icon-box" style="background: #64748b">📍</div>
                                    <span class="category-count">${uncategorizedPlaces.length}</span>
                                </div>
                            </div>
                            <div class="places-tabs-grid">
                                ${uncategorizedPlaces.map((place, idx) => buildPlaceCardHtml(place, idx, '📍')).join('')}
                            </div>
                        </section>
                    `;
                }

                wrapper.innerHTML = totalMatches > 0
                    ? sectionsHtml
                    : `<div class="no-results-box">🔍 لا توجد نتائج مطابقة لـ "${rawQuery}"</div>`;
                return;
            }

            // الوضع العادي (بدون بحث)
            const visibleCategories = activeCategoryFilter === 'all'
                ? categories
                : categories.filter(c => c.id === activeCategoryFilter);

            wrapper.innerHTML = visibleCategories.map(cat => {
                const catPlaces = places.filter(p => p.categoryId === cat.id);
                const cardsHtml = catPlaces.length > 0
                    ? `<div class="places-tabs-grid">
                        ${catPlaces.map((place, idx) => buildPlaceCardHtml(place, idx, cat.icon)).join('')}
                       </div>`
                    : '';

                return `
                    <section class="category-section">
                        <div class="category-header ${catPlaces.length > 0 ? 'has-items' : ''}">
                            <div class="category-title-group">
                                <div class="category-icon-box" style="background: ${cat.color || '#2563eb'}">${cat.icon}</div>
                                <span class="category-count">${catPlaces.length}</span>
                            </div>
                        </div>
                        ${cardsHtml}
                    </section>
                `;
            }).join('');
        }
    </script>
</body>
