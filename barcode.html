<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة شريحة للمخزون</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; max-width: 850px; margin: 0 auto; padding: 12px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #e2e8f0; }
        label { display: block; margin-top: 10px; margin-bottom: 4px; font-weight: bold; font-size: 13px; color: #333; }
        input, select, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; font-size: 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; }
        
        .stats { display: flex; justify-content: flex-start; flex-wrap: wrap; gap: 8px; background: #f1f5f9; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; }
        .stat-badge { background: white; padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0; color: #1e3a8a; flex: 1 1 auto; text-align: center; }
        .stat-badge.total { background: #1e3a8a; color: white; border-color: #1e3a8a; }

        .cam-controls { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-live { flex: 1; background: #2563eb; color: white; border: none; font-weight: bold; font-size: 15px; padding: 13px; cursor: pointer; margin: 0; border-radius: 8px; }
        .btn-torch { flex: 0 0 52px; background: #f59e0b; color: white; border: none; font-weight: bold; font-size: 18px; padding: 0; cursor: pointer; margin: 0; display: none; align-items: center; justify-content: center; border-radius: 8px; }
        
        .zoom-bar { display: none; align-items: center; gap: 8px; margin-bottom: 8px; background: #f1f5f9; padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .zoom-bar span { font-size: 13px; font-weight: bold; color: #1e3a8a; white-space: nowrap; }
        .zoom-bar input[type="range"] { margin: 0; padding: 0; flex: 1; accent-color: #2563eb; cursor: pointer; }

        .row-group { display: flex; gap: 8px; align-items: center; margin-top: 4px; margin-bottom: 6px; }
        .row-group input, .row-group select { margin: 0; flex: 1; }
        .btn-action { margin: 0; width: auto; padding: 10px 16px; color: white; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; white-space: nowrap; }
        .btn-green { background: #16a34a; }
        .btn-blue { background: #0284c7; }

        #reader { width: 100%; margin-bottom: 8px; border-radius: 8px; overflow: hidden; }
        #scanMonitor { display: none; font-size: 12px; background: #f8fafc; color: #475569; padding: 6px 10px; border-radius: 6px; border: 1px dashed #cbd5e1; margin-bottom: 8px; text-align: center; font-family: monospace; }
        #msg { padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; display: none; margin-bottom: 10px; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 9px 8px; text-align: center; white-space: nowrap; }
        th { background: #1e293b; color: white; }
        .barcode-cell { font-family: monospace; font-size: 13px; font-weight: bold; color: #0f172a; letter-spacing: 0.5px; }
        .btn-del-row { background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; width: auto; margin: 0; }
        .company-badge { background: #dbeafe; color: #1e3a8a; padding: 3px 10px; border-radius: 8px; font-weight: bold; }
        .user-badge { background: #e0f2fe; color: #0369a1; padding: 3px 10px; border-radius: 10px; font-weight: bold; }
    </style>

    <!-- ربط Firebase السحابي بنفس قاعدة الفواتير (ahmed-hassan-bb80b)[span_0](start_span)[span_0](end_span) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLlNld1YOKrX6uq15aF4BhJjWPwV40osY",
            authDomain: "ahmed-hassan-bb80b.firebaseapp.com",
            projectId: "ahmed-hassan-bb80b",
            storageBucket: "ahmed-hassan-bb80b.firebasestorage.app",
            messagingSenderId: "503682153846",
            appId: "1:503682153846:web:93b3a174ab31e351a04e57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;

        if (window.initBarcodeApp) { window.initBarcodeApp(); }
    </script>
</head>
<body>

    <h3 style="text-align:center; margin-top:0; margin-bottom:12px; color:#1e3a8a;">📱 إضافة شريحة للمخزون</h3>

    <!-- ملخص رصيد المخزون الديناميكي -->
    <div class="card" style="padding: 10px; margin-bottom: 12px;">
        <div class="stats" id="dynamicStats"></div>
    </div>

    <!-- الكاميرا والخيارات والتاريخ -->
    <div class="card">
        <div id="msg"></div>

        <div class="cam-controls">
            <button id="liveBtn" class="btn-live" onclick="toggleLiveCamera()">
                🎥 تشغيل الكاميرا السريعة (مسح الباركود)
            </button>
            <button id="torchBtn" class="btn-torch" onclick="toggleTorch()" title="تشغيل/إيقاف الكشاف">
                🔦
            </button>
        </div>

        <div id="zoomWrap" class="zoom-bar">
            <span>🔍 تقريب العدسة:</span>
            <input type="range" id="zoomSlider" min="1" max="3.5" step="0.1" value="1.5" oninput="applyZoom(this.value)">
            <span id="zoomVal" style="min-width: 35px; text-align: left;">1.5x</span>
        </div>

        <div id="reader"></div>
        <div id="scanMonitor">في انتظار توجيه الكاميرا نحو الباركود...</div>

        <!-- إدخال يدوي للباركود -->
        <label>إدخال يدوي للباركود:</label>
        <div class="row-group">
            <input type="text" id="manualCodeInput" inputmode="numeric" placeholder="✍️ اكتب أو الصق رقم الباركود هنا..." onkeydown="if(event.key==='Enter') submitManualCode()">
            <button class="btn-action btn-green" onclick="submitManualCode()">➕ مسح يدوي</button>
        </div>

        <!-- القائمة المنسدلة وزر إضافة خيار جديد مسماة باسم "المدة" -->
        <label>المدة (أو التصنيف):</label>
        <div class="row-group">
            <select id="itemSelect"></select>
        </div>
        <div class="row-group">
            <input type="text" id="newOptionInput" placeholder="✨ اكتب مدة / صنف جديد لإضافته للقائمة..." onkeydown="if(event.key==='Enter') addNewItemOption()">
            <button class="btn-action btn-blue" onclick="addNewItemOption()">➕ إضافة المدة</button>
        </div>

        <div>
            <label>التاريخ:</label>
            <input type="date" id="inDate">
        </div>
    </div>

    <!-- جدول الشرائح المضافة -->
    <div class="card">
        <input type="text" id="searchInput" placeholder="🔍 البحث بالباركود أو المدة أو التاريخ أو اسم اليوزر..." oninput="renderTable()">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>حذف</th>
                        <th>الباركود الكامل</th>
                        <th>المدة</th>
                        <th>التاريخ</th>
                        <th>اسم اليوزر</th>
                    </tr>
                </thead>
                <tbody id="simTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('logged_user')) || { username: 'مجهول', role: 'employee' };
        let simsList = [];
        let marketList = [];
        let customItems = ['Mobily', 'STC', 'Zain'];
        let stockInventory = { 'Mobily': 0, 'STC': 0, 'Zain': 0 };

        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        document.getElementById('inDate').value = getTodayStr();

        const scannerConfig = {
            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            verbose: false
        };
        if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
            scannerConfig.formatsToSupport = [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13
            ];
        }

        const html5QrCode = new Html5Qrcode("reader", scannerConfig);
        let isLiveRunning = false;
        let isTorchOn = false;
        let lastScanned = "";
        let lastScanTime = 0;
        let audioCtx = null;

        function unlockAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }

        function playBeep(success = true) {
            try {
                unlockAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (success) {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(1400, now);
                    osc.frequency.setValueAtTime(1800, now + 0.06);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                    osc.start(now);
                    osc.stop(now + 0.16);
                    if (navigator.vibrate) navigator.vibrate(70);
                } else {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(220, now);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
                }
            } catch (e) {}
        }

        function cleanAndExtractDigits(str) {
            return str
                .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
                .replace(/[^0-9]/g, '');
        }

        function detectCompanyByCode(code) {
            if (code.startsWith('8996601') || code.includes('8996601')) return 'STC';
            if (code.startsWith('8996603') || code.includes('8996603')) return 'Mobily';
            if (code.startsWith('8996604') || code.includes('8996604')) return 'Zain';
            return customItems[0] || 'Mobily';
        }

        function resolveSelectedCompany(code) {
            const selected = document.getElementById('itemSelect').value;
            if (selected && selected !== 'AUTO') {
                return selected;
            }
            return detectCompanyByCode(code);
        }

        function renderItemDropdown(selectedVal = null) {
            const select = document.getElementById('itemSelect');
            const currentVal = selectedVal || select.value || 'AUTO';
            
            let html = `<option value="AUTO">🔄 تحديد تلقائي حسب الباركود (STC / Mobily / Zain)</option>`;
            customItems.forEach(item => {
                html += `<option value="${item}">${item}</option>`;
            });
            select.innerHTML = html;
            if ([...select.options].some(o => o.value === currentVal)) {
                select.value = currentVal;
            }
        }

        window.addNewItemOption = async function() {
            const input = document.getElementById('newOptionInput');
            const newName = input.value.trim();
            if (!newName) {
                showMessage("⚠️ يرجى كتابة اسم المدة الجديدة أولاً.", true);
                return;
            }

            if (!customItems.includes(newName)) {
                customItems.push(newName);
            }
            if (stockInventory[newName] === undefined) {
                stockInventory[newName] = 0;
            }

            input.value = '';
            renderItemDropdown(newName);
            renderTable();
            showMessage(`✅ تم إضافة المدة (${newName}) وتحديث القوائم بنجاح!`);
            await saveConfigAndSync();
        };

        function showMessage(text, isError = false) {
            const msg = document.getElementById('msg');
            msg.style.display = 'block';
            msg.style.background = isError ? '#fee2e2' : '#dcfce7';
            msg.style.color = isError ? '#991b1b' : '#166534';
            msg.innerText = text;
        }

        window.initBarcodeApp = async function() {
            const localConfig = JSON.parse(localStorage.getItem('app_config'));
            if (localConfig) {
                marketList = localConfig.marketList || [];
                customItems = localConfig.customItems || customItems;
                stockInventory = localConfig.stockInventory || stockInventory;
            }

            const localSims = JSON.parse(localStorage.getItem('scanned_sims_offline'));
            if (localSims) {
                simsList = localSims;
            }

            renderItemDropdown();
            renderTable();

            try {
                if (window.db) {
                    const configRef = window.doc(window.db, "settings", "app_config");
                    const configSnap = await window.getDoc(configRef);
                    if (configSnap.exists()) {
                        const data = configSnap.data();
                        marketList = data.marketList || marketList;
                        customItems = data.customItems || customItems;
                        stockInventory = data.stockInventory || stockInventory;
                        localStorage.setItem('app_config', JSON.stringify({ marketList, customItems, stockInventory }));
                    }

                    const querySnapshot = await window.getDocs(window.collection(window.db, "scanned_sims"));
                    simsList = [];
                    querySnapshot.forEach((docSnap) => {
                        simsList.push(docSnap.data());
                    });
                    localStorage.setItem('scanned_sims_offline', JSON.stringify(simsList));
                    renderItemDropdown();
                    renderTable();
                }
            } catch (e) {
                console.log("وضع الأوفلاين مفعل.");
            }
        };

        async function saveConfigAndSync() {
            localStorage.setItem('app_config', JSON.stringify({ marketList, customItems, stockInventory }));
            try {
                if (window.db) {
                    const configRef = window.doc(window.db, "settings", "app_config");
                    await window.setDoc(configRef, { marketList, customItems, stockInventory });
                }
            } catch (e) {}
        }

        async function applyZoom(val) {
            document.getElementById('zoomVal').innerText = val + 'x';
            if (!isLiveRunning) return;
            try {
                await html5QrCode.applyVideoConstraints({
                    advanced: [{ zoom: parseFloat(val) }]
                });
            } catch (e) {}
        }

        function submitManualCode() {
            unlockAudio();
            const input = document.getElementById('manualCodeInput');
            const val = input.value.trim();
            if (!val) return;
            handleInScan(val, true);
            input.value = '';
        }

        async function toggleLiveCamera() {
            unlockAudio();
            const btn = document.getElementById('liveBtn');
            const torchBtn = document.getElementById('torchBtn');
            const zoomWrap = document.getElementById('zoomWrap');
            const monitor = document.getElementById('scanMonitor');

            if (isLiveRunning) {
                await html5QrCode.stop();
                isLiveRunning = false;
                isTorchOn = false;
                btn.innerText = "🎥 تشغيل الكاميرا السريعة (مسح الباركود)";
                btn.style.background = "#2563eb";
                torchBtn.style.display = "none";
                torchBtn.style.background = "#f59e0b";
                zoomWrap.style.display = "none";
                monitor.style.display = "none";
                return;
            }

            const qrBoxConfig = function(viewfinderWidth, viewfinderHeight) {
                return {
                    width: Math.floor(viewfinderWidth * 0.94),
                    height: Math.floor(viewfinderHeight * 0.35)
                };
            };

            try {
                try {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        {
                            fps: 20,
                            disableFlip: false,
                            qrbox: qrBoxConfig,
                            videoConstraints: {
                                facingMode: "environment",
                                width: { ideal: 1920 },
                                height: { ideal: 1080 },
                                focusMode: "continuous"
                            }
                        },
                        (text) => handleInScan(text, false)
                    );
                } catch (hdErr) {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        {
                            fps: 15,
                            disableFlip: false,
                            qrbox: qrBoxConfig
                        },
                        (text) => handleInScan(text, false)
                    );
                }

                isLiveRunning = true;
                btn.innerText = "⏹️ إيقاف الكاميرا";
                btn.style.background = "#dc2626";
                torchBtn.style.display = "flex";
                zoomWrap.style.display = "flex";
                monitor.style.display = "block";
                monitor.innerText = "الكاميرا جاهزة.. وجه المستطيل على الباركود";

                document.getElementById('zoomSlider').value = "1.5";
                setTimeout(() => applyZoom(1.5), 400);
            } catch (err) {
                showMessage("⚠️ تعذر تشغيل الكاميرا، تأكد من إعطاء الصلاحية للمتصفح.", true);
            }
        }

        async function toggleTorch() {
            if (!isLiveRunning) return;
            try {
                isTorchOn = !isTorchOn;
                await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] });
                document.getElementById('torchBtn').style.background = isTorchOn ? "#16a34a" : "#f59e0b";
            } catch (err) {
                showMessage("⚠️ الفلاش غير مدعوم من المتصفح في هذا الجهاز", true);
            }
        }

        async function handleInScan(scannedCode, isManual = false) {
            const rawStr = String(scannedCode || '').trim();
            if (!rawStr) return;

            const monitor = document.getElementById('scanMonitor');

            const lowerRaw = rawStr.toLowerCase();
            if (lowerRaw.includes('http://') || lowerRaw.includes('https://') || lowerRaw.includes('www.') || lowerRaw.includes('.com') || lowerRaw.includes('.sa') || lowerRaw.includes('/')) {
                if (monitor) monitor.innerText = "تم تجاهل رابط ويب غير صالح";
                if (isManual) showMessage("⚠️ لا يمكن إضافة روابط ويب كباركود شريحة!", true);
                return; 
            }

            let code = cleanAndExtractDigits(rawStr);
            const iccidIdx = code.indexOf('89966');
            if (iccidIdx > 0) {
                code = code.substring(iccidIdx);
            }

            if (code.length < 8) {
                if (monitor && code.length > 0) {
                    monitor.innerText = `قراءة غير مكتملة (${code}).. اثبت قليلاً على الباركود كامل`;
                }
                if (isManual) {
                    playBeep(false);
                    showMessage("⚠️ رقم الباركود قصير جداً! يجب أن يكون 8 أرقام فأكثر.", true);
                }
                return;
            }

            if (monitor) monitor.innerText = `تم التقاط الكود: ${code}`;

            const now = Date.now();
            if (code === lastScanned && (now - lastScanTime) < 2500) return;
            lastScanned = code;
            lastScanTime = now;

            if (simsList.some(s => s.code === code)) {
                playBeep(false);
                showMessage(`⚠️ الشريحة (${code}) مضافة مسبقاً!`, true);
                return;
            }

            const chosenOption = resolveSelectedCompany(code);
            const inDate = document.getElementById('inDate').value || getTodayStr();

            const newSim = {
                code: code,
                company: chosenOption,
                date: inDate,
                addedBy: currentUser.username,
                timestamp: now
            };

            simsList.push(newSim);
            localStorage.setItem('scanned_sims_offline', JSON.stringify(simsList));

            if (!customItems.includes(chosenOption)) {
                customItems.push(chosenOption);
                renderItemDropdown(chosenOption);
            }
            stockInventory[chosenOption] = (parseFloat(stockInventory[chosenOption]) || 0) + 1;

            playBeep(true);
            showMessage(`✅ تم إضافة الشريحة تحت المدة (${chosenOption}) وتحديث الرصيد!`);
            renderTable();

            await saveConfigAndSync();
            try {
                if (window.db) {
                    await window.setDoc(window.doc(window.db, "scanned_sims", code), newSim);
                }
            } catch (e) {}
        }

        window.deleteSim = async function(code) {
            const target = simsList.find(s => s.code === code);
            if (!target) return;

            if (confirm(`هل أنت متأكد من حذف الشريحة (${code}) وخصمها من المخزون؟`)) {
                simsList = simsList.filter(s => s.code !== code);
                localStorage.setItem('scanned_sims_offline', JSON.stringify(simsList));

                const company = target.company;
                if (stockInventory[company] !== undefined && stockInventory[company] > 0) {
                    stockInventory[company] = parseFloat(stockInventory[company]) - 1;
                }

                renderTable();
                showMessage(`🗑️ تم حذف الشريحة (${code}) وتحديث الرصيد.`);

                await saveConfigAndSync();
                try {
                    if (window.db) {
                        await window.deleteDoc(window.doc(window.db, "scanned_sims", code));
                    }
                } catch (e) {}
            }
        };

        window.renderTable = function() {
            const tbody = document.getElementById('simTable');
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            
            const statsDiv = document.getElementById('dynamicStats');
            let statsHtml = `<span class="stat-badge total">إجمالي الممسوح: ${simsList.length}</span>`;
            customItems.forEach(item => {
                const count = stockInventory[item] || 0;
                statsHtml += `<span class="stat-badge">${item}: ${count}</span>`;
            });
            statsDiv.innerHTML = statsHtml;

            const sorted = [...simsList].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            const filtered = sorted.filter(item => {
                if (!search) return true;
                return (item.code && item.code.toLowerCase().includes(search)) ||
                       (item.company && item.company.toLowerCase().includes(search)) ||
                       (item.date && item.date.toLowerCase().includes(search)) ||
                       (item.addedBy && item.addedBy.toLowerCase().includes(search));
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="padding:15px; color:#64748b; font-weight:bold;">لا توجد شرائح مسجلة</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr>
                    <td><button class="btn-del-row" onclick="deleteSim('${item.code}')">❌</button></td>
                    <td class="barcode-cell">${item.code}</td>
                    <td><span class="company-badge">${item.company || '-'}</span></td>
                    <td>${item.date || '-'}</td>
                    <td><span class="user-badge">${item.addedBy || '-'}</span></td>
                </tr>
            `).join('');
        };
    </script>
</body>
</html>
