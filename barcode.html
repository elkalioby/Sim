<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة شريحة للمخزون</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; max-width: 850px; margin: 0 auto; padding: 12px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #e2e8f0; }
        label { display: block; margin-top: 10px; margin-bottom: 4px; font-weight: bold; font-size: 13px; color: #333; }
        input, select, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; font-size: 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; }
        
        /* --- تنسيقات لوحة الإحصائيات المحدثة --- */
        .stats-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 10px; background: #f1f5f9; padding: 6px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .btn-month-nav { width: 38px; height: 38px; padding: 0; margin: 0; background: #ffffff; color: #1e3a8a; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.15s; }
        .btn-month-nav:active { background: #e2e8f0; }
        .month-select { margin: 0; padding: 7px 10px; height: 38px; font-weight: bold; font-size: 13.5px; color: #1e3a8a; text-align: center; border: 1px solid #cbd5e1; background: #ffffff; flex: 1; cursor: pointer; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .kpi-box { padding: 10px 6px; border-radius: 10px; text-align: center; border: 1px solid transparent; }
        .kpi-box .kpi-title { font-size: 12px; font-weight: bold; margin-bottom: 3px; display: block; }
        .kpi-box .kpi-val { font-size: 19px; font-weight: 800; font-family: monospace; }

        /* ألوان المؤشرات: أزرق للممسوح، أخضر للمنصرف، أحمر للمرتجع */
        .kpi-scanned { background: #eff6ff; border-color: #bfdbfe; color: #1e3a8a; }
        .kpi-dispatched { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
        .kpi-returned { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

        .stats-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        .stats-table { width: 100%; border-collapse: collapse; margin: 0; font-size: 13px; }
        .stats-table th { background: #f8fafc; color: #334155; font-weight: bold; padding: 8px 6px; border-bottom: 1.5px solid #cbd5e1; border-top: none; border-left: 1px solid #e2e8f0; border-right: none; }
        .stats-table td { padding: 8px 6px; border-bottom: 1px solid #f1f5f9; border-left: 1px solid #f1f5f9; border-right: none; font-weight: bold; }
        .stats-table tr:last-child td { border-bottom: none; }
        .stats-table tbody tr { cursor: pointer; transition: background 0.15s; }
        .stats-table tbody tr:hover { background: #f1f5f9; }
        
        .col-pkg { text-align: right !important; padding-right: 10px !important; color: #0f172a; }
        .val-scanned { color: #1d4ed8; font-family: monospace; font-size: 14px; }
        .val-dispatched { color: #16a34a; font-family: monospace; font-size: 14px; }
        .val-returned { color: #dc2626; font-family: monospace; font-size: 14px; }
        .val-zero { color: #cbd5e1 !important; font-weight: normal !important; }
        /* --- نهاية تنسيقات الإحصائيات --- */

        .scan-mode-bar { display: flex; gap: 8px; margin-bottom: 8px; background: #f1f5f9; padding: 5px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .btn-scan-mode { flex: 1; padding: 9px 10px; margin: 0; border: 1.5px solid transparent; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; background: transparent; color: #475569; transition: 0.15s; }
        .btn-scan-mode.active { background: #ffffff; color: #1e3a8a; border-color: #93c5fd; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

        .cam-controls { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-live { flex: 1; background: #2563eb; color: white; border: none; font-weight: bold; font-size: 15px; padding: 13px; cursor: pointer; margin: 0; border-radius: 8px; }
        .btn-torch { flex: 0 0 52px; background: #f59e0b; color: white; border: none; font-weight: bold; font-size: 18px; padding: 0; cursor: pointer; margin: 0; display: none; align-items: center; justify-content: center; border-radius: 8px; }
        
        .zoom-bar { display: none; align-items: center; gap: 8px; margin-bottom: 8px; background: #f1f5f9; padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .zoom-bar span { font-size: 13px; font-weight: bold; color: #1e3a8a; white-space: nowrap; }
        .zoom-bar input[type="range"] { margin: 0; padding: 0; flex: 1; accent-color: #2563eb; cursor: pointer; }

        .row-group { display: flex; gap: 8px; align-items: center; margin-top: 4px; margin-bottom: 6px; }
        .row-group input, .row-group select { margin: 0; flex: 1; }
        .btn-action { margin: 0; width: auto; padding: 10px 16px; color: white; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; white-space: nowrap; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .btn-green { background: #16a34a; }
        .btn-blue { background: #0284c7; }
        .btn-red { background: #dc2626; }

        #reader { width: 100%; margin-bottom: 8px; border-radius: 8px; overflow: hidden; }
        #scanMonitor { display: none; font-size: 12px; background: #f8fafc; color: #475569; padding: 6px 10px; border-radius: 6px; border: 1px dashed #cbd5e1; margin-bottom: 8px; text-align: center; font-family: monospace; font-weight: bold; }
        #msg { padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; display: none; margin-bottom: 10px; }

        .table-wrap { overflow-x: auto; }
        table.main-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        table.main-table th, table.main-table td { border: 1px solid #e2e8f0; padding: 9px 8px; text-align: center; white-space: nowrap; }
        table.main-table th { background: #1e293b; color: white; }
        .barcode-cell { font-family: monospace; font-size: 13px; font-weight: bold; color: #0f172a; letter-spacing: 0.5px; }
        .btn-del-row { background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; width: auto; margin: 0; }
        .badge { background: #dbeafe; color: #1e3a8a; padding: 3px 10px; border-radius: 8px; font-weight: bold; }
        .user-badge { background: #e0f2fe; color: #0369a1; padding: 3px 10px; border-radius: 10px; font-weight: bold; }
        .status-cell { font-size: 15px; font-weight: bold; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc, setDoc, getDoc, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLlNld1YOKrX6uq15aF4BhJjWPwV40osY",
            authDomain: "ahmed-hassan-bb80b.firebaseapp.com",
            projectId: "ahmed-hassan-bb80b",
            storageBucket: "ahmed-hassan-bb80b.firebasestorage.app",
            messagingSenderId: "503682153846",
            appId: "1:503682153846:web:93b3a174ab31e351a04e57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;

        if (window.initBarcodeApp) { window.initBarcodeApp(); }
    </script>
</head>
<body>

    <h3 style="text-align:center; margin-top:0; margin-bottom:12px; color:#1e3a8a;">📱 إضافة شريحة للمخزون</h3>

    <!-- بطاقة الإحصائيات الشهرية المدمجة -->
    <div class="card" style="padding: 12px; margin-bottom: 12px;">
        <div class="stats-header">
            <button type="button" class="btn-month-nav" onclick="changeStatsMonth(-1)" title="الشهر السابق">❮</button>
            <select id="statsMonthSelect" class="month-select" onchange="onStatsMonthChange()"></select>
            <button type="button" class="btn-month-nav" onclick="changeStatsMonth(1)" title="الشهر التالي">❯</button>
        </div>
        <div id="dynamicStats"></div>
    </div>

    <div class="card">
        <div id="msg"></div>

        <div class="scan-mode-bar">
            <button type="button" id="modeSimBtn" class="btn-scan-mode active" onclick="setScanMode('sim')">📱 وضع الشرائح (SIM)</button>
            <button type="button" id="modeRouterBtn" class="btn-scan-mode" onclick="setScanMode('router')">📡 وضع الراوترات (IMEI)</button>
        </div>

        <div class="cam-controls">
            <button id="liveBtn" class="btn-live" onclick="toggleLiveCamera()">
                🎥 تشغيل الكاميرا السريعة (مسح الباركود)
            </button>
            <button id="torchBtn" class="btn-torch" onclick="toggleTorch()" title="تشغيل/إيقاف الكشاف">
                🔦
            </button>
        </div>

        <div id="zoomWrap" class="zoom-bar">
            <span>🔍 تقريب العدسة:</span>
            <input type="range" id="zoomSlider" min="1" max="3.5" step="0.1" value="1.5" oninput="applyZoom(this.value)">
            <span id="zoomVal" style="min-width: 35px; text-align: left;">1.5x</span>
        </div>

        <div id="reader"></div>
        <div id="scanMonitor">في انتظار توجيه الكاميرا نحو الباركود...</div>

        <label>إدخال يدوي للباركود:</label>
        <div class="row-group">
            <input type="text" id="manualCodeInput" inputmode="numeric" placeholder="✍️ اكتب أو الصق رقم الباركود أو IMEI هنا..." onkeydown="if(event.key==='Enter') submitManualCode()">
            <button class="btn-action btn-green" onclick="submitManualCode()" title="مسح يدوي">➕</button>
        </div>

        <label>التصنيف (الشركة):</label>
        <div class="row-group">
            <select id="categorySelect" onchange="onCategoryChange()"></select>
            <button class="btn-action btn-red" onclick="deleteSelectedCategory()" title="حذف التصنيف المحدد">🗑️</button>
        </div>
        <div class="row-group">
            <input type="text" id="newCategoryInput" placeholder="✨ إضافة تصنيف جديد..." onkeydown="if(event.key==='Enter') addNewCategory()">
            <button class="btn-action btn-blue" onclick="addNewCategory()" title="إضافة تصنيف">➕</button>
        </div>

        <label>المدة (تثبت أثناء المسح المتعدد):</label>
        <div class="row-group">
            <select id="durationSelect"></select>
            <button class="btn-action btn-red" onclick="deleteSelectedDuration()" title="حذف المدة المحددة">🗑️</button>
        </div>
        <div class="row-group">
            <input type="text" id="newDurationInput" placeholder="✨ إضافة مدة جديدة (مثال: 30، 60)..." onkeydown="if(event.key==='Enter') addNewDuration()">
            <button class="btn-action btn-green" onclick="addNewDuration()" title="إضافة مدة">➕</button>
        </div>

        <div>
            <label>التاريخ:</label>
            <input type="date" id="inDate">
        </div>
    </div>

    <div class="card">
        <input type="text" id="searchInput" placeholder="🔍 البحث بالباركود، التصنيف، المدة، التاريخ، الرمز، العميل، أو اسم اليوزر..." oninput="renderTable()">
        <div class="table-wrap">
            <table class="main-table">
                <thead>
                    <tr>
                        <th>الحالة</th>
                        <th>الباركود الكامل</th>
                        <th>التصنيف</th>
                        <th>المدة</th>
                        <th>التاريخ</th>
                        <th>اسم اليوزر</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="simTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('logged_user')) || { username: 'مجهول', role: 'employee' };
        let simsList = [];
        let categoriesList = ['Mobily', 'STC', 'Zain', 'Redbull', 'روتر زين'];
        let durationsList = ['0', '30', '60'];

        // دالة حساب الشهر المحاسبي الموحدة: الشهر يبدأ يوم 5 وينتهي يوم 4 من الشهر التالي
        function getAccountingMonth(dateStr, timestampFallback) {
            let year = NaN, month = NaN, day = NaN;
            if (dateStr) {
                const clean = String(dateStr).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
                const isoMatch = clean.match(/^(\d{4})[-/](\d{1,2})(?:[-/](\d{1,2}))?/);
                const dmyMatch = clean.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
                if (isoMatch) {
                    year = parseInt(isoMatch[1], 10);
                    month = parseInt(isoMatch[2], 10);
                    day = isoMatch[3] ? parseInt(isoMatch[3], 10) : 5;
                } else if (dmyMatch) {
                    day = parseInt(dmyMatch[1], 10);
                    month = parseInt(dmyMatch[2], 10);
                    year = parseInt(dmyMatch[3], 10);
                }
            }
            if ((isNaN(year) || isNaN(month)) && timestampFallback) {
                const d = new Date(Number(timestampFallback));
                if (!isNaN(d.getTime())) {
                    year = d.getFullYear();
                    month = d.getMonth() + 1;
                    day = d.getDate();
                }
            }
            if (isNaN(year) || isNaN(month)) return '';
            if (!isNaN(day) && day < 5) {
                month -= 1;
                if (month < 1) { month = 12; year -= 1; }
            }
            return `${year}-${String(month).padStart(2, '0')}`;
        }

        function getCurrentYearMonth() {
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            return getAccountingMonth(todayStr, d.getTime());
        }
        let selectedStatsMonth = getCurrentYearMonth();

        function ensureBaseDurations() {
            ['0', '30', '60'].forEach(d => {
                if (!durationsList.map(String).includes(d)) {
                    durationsList.unshift(d);
                }
            });
        }
        let stockInventory = {};
        let scannedCountsByGroup = {};
        let currentScanMode = 'sim';

        // --- نظام المزامنة التلقائية الموحد (SimAutoSync Bridge) ---
        const SYNC_QUEUE_KEY = 'sim_offline_sync_queue';

        function queueCloudOperation(entry) {
            try {
                if (window.parent && window.parent !== window && window.parent.SimAutoSync) {
                    window.parent.SimAutoSync.enqueue(entry);
                    return;
                }
            } catch (e) {}

            try {
                const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                const key = `${entry.op}::${entry.collectionName}::${entry.docId || ''}`;
                if (entry.op === 'delete') {
                    const withoutPrior = q.filter(i => !(i.collectionName === entry.collectionName && String(i.docId) === String(entry.docId)));
                    if (!String(entry.docId).startsWith('local_')) {
                        withoutPrior.push({ ...entry, timestamp: Date.now() });
                    }
                    localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(withoutPrior));
                    notifyParentQueueUpdated();
                    return;
                }
                const filtered = q.filter(i => !(i.op === 'delete' && i.collectionName === entry.collectionName && String(i.docId) === String(entry.docId)));
                const idx = filtered.findIndex(i => `${i.op}::${i.collectionName}::${i.docId || ''}` === key);
                const item = { ...entry, timestamp: Date.now() };
                if (idx !== -1) {
                    if (entry.merge && filtered[idx].data && entry.data) item.data = { ...filtered[idx].data, ...entry.data };
                    filtered[idx] = item;
                } else {
                    filtered.push(item);
                }
                localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(filtered));
                notifyParentQueueUpdated();
            } catch (e) {}
        }

        function notifyParentQueueUpdated() {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'SIM_QUEUE_UPDATED' }, '*');
                }
            } catch (e) {}
        }

        function getPendingIdsForCollection(collectionName) {
            try {
                const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                return new Set(q.filter(i => i.collectionName === collectionName && i.op !== 'delete').map(i => String(i.docId)));
            } catch (e) {
                return new Set();
            }
        }

        function getPendingDeletesForCollection(collectionName) {
            try {
                const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                return new Set(q.filter(i => i.collectionName === collectionName && i.op === 'delete').map(i => String(i.docId)));
            } catch (e) {
                return new Set();
            }
        }

        async function flushLocalQueueFallback() {
            try {
                if (window.parent && window.parent !== window && window.parent.SimAutoSync) {
                    await window.parent.SimAutoSync.flush();
                    return;
                }
                if (!navigator.onLine || !window.db) return;
                const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                if (q.length === 0) return;

                const remaining = [];
                for (const item of q) {
                    try {
                        if (item.op === 'add') {
                            await window.addDoc(window.collection(window.db, item.collectionName), item.data);
                        } else if (item.op === 'set') {
                            await window.setDoc(window.doc(window.db, item.collectionName, String(item.docId)), item.data, item.merge !== false ? { merge: true } : undefined);
                        } else if (item.op === 'update') {
                            await window.updateDoc(window.doc(window.db, item.collectionName, String(item.docId)), item.data);
                        } else if (item.op === 'delete') {
                            await window.deleteDoc(window.doc(window.db, item.collectionName, String(item.docId)));
                        }
                    } catch (err) {
                        remaining.push(item);
                    }
                }
                localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(remaining));
            } catch (e) {}
        }

        window.addEventListener('online', async () => {
            await flushLocalQueueFallback();
            if (window.initBarcodeApp) await window.initBarcodeApp();
        });

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'SIM_CLOUD_SYNCED') {
                const localConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
                if (localConfig) {
                    categoriesList = localConfig.categoriesList || localConfig.customItems || categoriesList;
                    durationsList = localConfig.durationsList || durationsList;
                }
                ensureRouterCategoryExists();
                simsList = JSON.parse(localStorage.getItem('scanned_sims_offline') || '[]');
                recalculateUnifiedStock();
                renderDropdowns();
                renderTable();
            }
        });
        // --- نهاية نظام المزامنة التلقائية ---

        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        document.getElementById('inDate').value = getTodayStr();

        // --- دوال فلترة الشهور للإحصائيات ---
        const ARABIC_MONTHS = [
            'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
            'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
        ];

        function formatMonthLabel(ym) {
            if (!ym || ym === 'ALL') return 'الكل (الإجمالي العام)';
            const [y, m] = ym.split('-');
            const mIdx = parseInt(m, 10) - 1;
            const currentYm = getCurrentYearMonth();
            const label = `${ARABIC_MONTHS[mIdx] || m} ${y}`;
            return ym === currentYm ? `${label} (الحالي)` : label;
        }

        function extractYearMonthFromRecord(item, fieldName) {
            const tsField = fieldName === 'dispatchDate'
                ? item.dispatchTimestamp
                : (fieldName === 'returnDate' ? item.returnTimestamp : item.timestamp);
            return getAccountingMonth(item[fieldName], tsField);
        }

        function populateMonthSelector() {
            const select = document.getElementById('statsMonthSelect');
            if (!select) return;

            const currentYm = getCurrentYearMonth();
            const monthsSet = new Set([currentYm]);

            simsList.forEach(item => {
                const mIn = extractYearMonthFromRecord(item, 'date');
                if (mIn) monthsSet.add(mIn);
                const mOut = extractYearMonthFromRecord(item, 'dispatchDate');
                if (mOut) monthsSet.add(mOut);
                const mRet = extractYearMonthFromRecord(item, 'returnDate');
                if (mRet) monthsSet.add(mRet);
            });

            if (selectedStatsMonth && selectedStatsMonth !== 'ALL') {
                monthsSet.add(selectedStatsMonth);
            }

            const sortedMonths = Array.from(monthsSet).sort((a, b) => b.localeCompare(a));

            let html = `<option value="ALL">📊 الكل (الإجمالي العام)</option>`;
            sortedMonths.forEach(ym => {
                html += `<option value="${ym}">📅 ${formatMonthLabel(ym)}</option>`;
            });

            select.innerHTML = html;
            select.value = selectedStatsMonth;
        }

        window.onStatsMonthChange = function() {
            const select = document.getElementById('statsMonthSelect');
            selectedStatsMonth = select.value;
            renderMonthlyStatsPanel();
        };

        window.changeStatsMonth = function(delta) {
            const select = document.getElementById('statsMonthSelect');
            if (!select) return;

            if (selectedStatsMonth === 'ALL') {
                selectedStatsMonth = getCurrentYearMonth();
            } else {
                const [y, m] = selectedStatsMonth.split('-').map(Number);
                const d = new Date(y, m - 1 + delta, 1);
                selectedStatsMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            }
            populateMonthSelector();
            renderMonthlyStatsPanel();
        };

        window.filterTableByPackage = function(cat, dur) {
            const searchInput = document.getElementById('searchInput');
            const targetQuery = `${cat} ${dur}`;
            if (searchInput.value.trim() === targetQuery) {
                searchInput.value = '';
            } else {
                searchInput.value = targetQuery;
            }
            renderTable();
            searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        function renderMonthlyStatsPanel() {
            populateMonthSelector();
            const container = document.getElementById('dynamicStats');
            if (!container) return;

            let totalScanned = 0;
            let totalDispatched = 0;
            let totalReturned = 0;

            const groupMap = {};

            const ensureGroup = (cat, dur) => {
                const key = `${cat} (${dur})`;
                if (!groupMap[key]) {
                    groupMap[key] = { key, cat, dur, scanned: 0, dispatched: 0, returned: 0 };
                }
                return groupMap[key];
            };

            simsList.forEach(item => {
                const cat = item.category || item.company || 'Mobily';
                const dur = getFixedDuration(item);
                const isZeroDur = String(dur).trim() === '0';

                const inYm = extractYearMonthFromRecord(item, 'date');
                const dispYm = extractYearMonthFromRecord(item, 'dispatchDate') || extractYearMonthFromRecord(item, 'actionDate') || inYm;
                const retYm = extractYearMonthFromRecord(item, 'returnDate') || extractYearMonthFromRecord(item, 'actionDate') || inYm;

                const isAll = (selectedStatsMonth === 'ALL');

                // 1. الممسوح (الوارد خلال الشهر المحدد)
                if (isAll || inYm === selectedStatsMonth) {
                    const grp = ensureGroup(cat, dur);
                    grp.scanned += 1;
                    totalScanned += 1;
                }

                // 2. المنصرف (المصروف خلال الشهر المحدد - مع استبعاد المدة 0 لأنها بدل مرتجع)
                if (item.status === 'dispatched' && !isSimReturned(item) && !isZeroDur) {
                    if (isAll || dispYm === selectedStatsMonth) {
                        const grp = ensureGroup(cat, dur);
                        grp.dispatched += 1;
                        totalDispatched += 1;
                    }
                }

                // 3. المرتجع (المرتجع خلال الشهر المحدد)
                if (isSimReturned(item)) {
                    if (isAll || retYm === selectedStatsMonth) {
                        const grp = ensureGroup(cat, dur);
                        grp.returned += 1;
                        totalReturned += 1;
                    }
                }
            });

            const rows = Object.values(groupMap).sort((a, b) => {
                const totalA = a.scanned + a.dispatched + a.returned;
                const totalB = b.scanned + b.dispatched + b.returned;
                return totalB - totalA;
            });

            let tableRowsHtml = '';
            if (rows.length === 0) {
                tableRowsHtml = `
                    <tr>
                        <td colspan="4" style="padding:14px; color:#64748b; font-weight:normal;">
                            لا توجد حركة مسجلة في هذا الشهر

            } else {
                tableRowsHtml = rows.map(r => `

                        <td class="val-returned ${r.returned === 0 ? 'val-zero' : ''}">${r.returned}</td>
                    </tr>
                `).join('');
            }

            container.innerHTML = `
                <div class="kpi-grid">
                    <div class="kpi-box kpi-scanned">
                        <span class="kpi-title">📥 ممسوح</span>
                        <span class="kpi-val">${totalScanned}</span>
                    </div>
                    <div class="kpi-box kpi-dispatched">
                        <span class="kpi-title">📤 منصرف</span>
                        <span class="kpi-val">${totalDispatched}</span>
                    </div>
                    <div class="kpi-box kpi-returned">
                        <span class="kpi-title">↩️ مرتجع</span>
                        <span class="kpi-val">${totalReturned}</span>
                    </div>
                </div>

                <div class="stats-table-wrap">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th class="col-pkg">الباقة / النوع</th>
                                <th style="color:#1e3a8a;">ممسوح</th>
                                <th style="color:#15803d;">منصرف</th>
                                <th style="color:#b91c1c;">مرتجع</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHtml}
                        </tbody>
                    </table>
                </div>
            `;

        function unlockAudio() {
            try {

                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }

        function playBeep(success = true) {
            try {
                unlockAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (success) {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(1400, now);
                    osc.frequency.setValueAtTime(1800, now + 0.06);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                    osc.start(now);
                    osc.stop(now + 0.16);
                    if (navigator.vibrate) navigator.vibrate(70);
                } else {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(220, now);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
                }
            } catch (e) {}
        }

        function isSimReturned(item) {
            if (!item) return false;
            if (item.returned === true || item.isReturned === true) return true;
            const st = String(item.status || '').trim().toLowerCase();
            return ['returned', 'return', 'مرتجع', 'مرتجعه', 'مرتجعة', 'refunded', 'canceled', 'cancelled'].includes(st);
        }

        function isReturnInvoice(inv) {
            if (!inv) return false;
            if (inv.isReturn === true || inv.returned === true) return true;
            const type = String(inv.type || inv.invoiceType || '').trim().toLowerCase();
            const st = String(inv.status || '').trim().toLowerCase();
            return ['return', 'returned', 'مرتجع', 'مرتجعه', 'مرتجعة', 'refund'].includes(type) ||
                   ['return', 'returned', 'مرتجع', 'مرتجعه', 'مرتجعة', 'refunded'].includes(st);
        }

        function cleanAndExtractDigits(str) {

        function recalculateUnifiedStock() {
            const existingConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
            const stockOffsets = existingConfig.stockOffsets || {};
            const deletedStockItems = existingConfig.deletedStockItems || [];
            const salesRecords = JSON.parse(localStorage.getItem('sales_records_offline') || '[]');

            scannedCountsByGroup = {};
            const autoStock = {};

            simsList.forEach(item => {
                const cat = item.category || item.company || 'Mobily';
                let dur = item.duration;
                if (dur === undefined || dur === null || dur === '-' || dur === 'غير محدد' || String(dur).trim() === '') {
                    dur = (cat === 'Redbull') ? '30' : '60';
                    item.duration = dur;
                } else {
                    dur = String(dur).trim();
                }

                const itemKey = `${cat} (${dur})`;
                if (!isSimReturned(item)) {
                    scannedCountsByGroup[itemKey] = (scannedCountsByGroup[itemKey] || 0) + 1;
                }

                if (dur === '0') return;
                autoStock[itemKey] = (autoStock[itemKey] || 0) + 1;
            });

            salesRecords.forEach(r => {
                const sign = isReturnInvoice(r) ? -1 : 1;
                if (r.cartItems && Array.isArray(r.cartItems)) {
                    r.cartItems.forEach(ci => {
                        if (!ci.item || !ci.item.includes('(') || ci.item.endsWith('(0)')) return;
                        if (autoStock[ci.item] === undefined) autoStock[ci.item] = 0;
                        autoStock[ci.item] -= sign * (parseFloat(ci.qty) || 0);
                    });
                }
            });

            stockInventory = {};
            const allKeys = new Set([...Object.keys(autoStock), ...Object.keys(stockOffsets)]);
            allKeys.forEach(key => {
                if (!key.includes('(') || key.endsWith('(0)')) return;
                const base = autoStock[key] || 0;
                const offset = stockOffsets[key] !== undefined ? parseFloat(stockOffsets[key]) : 0;
                const finalQty = base + offset;
                stockInventory[key] = finalQty >= 0 ? finalQty : 0;
            });

            deletedStockItems.forEach(delItem => {
                delete stockInventory[delItem];
            });
        }

        }

        window.initBarcodeApp = async function() {
            const localConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
            if (localConfig) {
                categoriesList = localConfig.categoriesList || localConfig.customItems || categoriesList;
                durationsList = localConfig.durationsList || ['0', '30', '60'];
                ensureBaseDurations();
            }
            ensureRouterCategoryExists();

            const localSims = JSON.parse(localStorage.getItem('scanned_sims_offline'));
            if (localSims) {
                simsList = localSims;
            }

            recalculateUnifiedStock();
            renderDropdowns('AUTO');
            renderTable();

            try {
                if (window.db && navigator.onLine) {
                    await flushLocalQueueFallback();

                    const configRef = window.doc(window.db, "settings", "app_config");
                    const configSnap = await window.getDoc(configRef);
                    if (configSnap.exists()) {
                        const data = configSnap.data();
                        const currentLocalCfg = JSON.parse(localStorage.getItem('app_config') || '{}');
                        const localTs = currentLocalCfg.configUpdatedAt || 0;
                        const cloudTs = data.configUpdatedAt || 0;

                        if (cloudTs >= localTs) {
                            categoriesList = data.categoriesList || data.customItems || categoriesList;
                            durationsList = data.durationsList || durationsList;
                            ensureBaseDurations();
                            ensureRouterCategoryExists();
                            const merged = { ...currentLocalCfg, ...data, categoriesList };
                            localStorage.setItem('app_config', JSON.stringify(merged));
                        }
                    }

                    const pendingSimIds = getPendingIdsForCollection("scanned_sims");
                    const pendingDeleteIds = getPendingDeletesForCollection("scanned_sims");
                    const localMap = new Map();
                    simsList.forEach(s => {
                        if (s.code && !pendingDeleteIds.has(String(s.code))) {
                            localMap.set(String(s.code), s);
                        }
                    });

                    const querySnapshot = await window.getDocs(window.collection(window.db, "scanned_sims"));
                    const mergedSims = [];
                    const pendingCloudUpdates = [];

                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (!data.code) data.code = docSnap.id;
                        if (!data.category && data.company) data.category = data.company;
                        const codeKey = String(data.code);

                        if (pendingDeleteIds.has(codeKey)) return;

                        const locSim = localMap.get(codeKey);
                        const isLocalPending = pendingSimIds.has(codeKey);

                        if (locSim && (isLocalPending || (locSim.updatedAt || 0) > (data.updatedAt || 0))) {
                            mergedSims.push(locSim);
                            pendingCloudUpdates.push(locSim);
                        } else {
                            mergedSims.push(data);
                        }
                        localMap.delete(codeKey);
                    });

                    localMap.forEach((remSim, codeKey) => {
                        if (pendingSimIds.has(codeKey)) {
                            mergedSims.push(remSim);
                            pendingCloudUpdates.push(remSim);
                        }
                    });

                    simsList = mergedSims;

                    for (const upSim of pendingCloudUpdates) {
                        try {
                            await window.setDoc(window.doc(window.db, "scanned_sims", String(upSim.code)), upSim, { merge: true });
                        } catch (err) {
                            queueCloudOperation({
                                op: 'set',
                                collectionName: 'scanned_sims',
                                docId: String(upSim.code),
                                data: { ...upSim },
                                merge: true
                            });
                        }
                    }
                }
            } catch (e) {
                console.log("وضع الأوفلاين مفعل.");
            }

            resetUnassignedDispatchedSims();
            localStorage.setItem('scanned_sims_offline', JSON.stringify(simsList));
            recalculateUnifiedStock();
            await saveConfigAndSync();
            renderDropdowns();
            renderTable();
        };

        async function toggleLiveCamera() {
            unlockAudio();
            const btn = document.getElementById('liveBtn');
            const torchBtn = document.getElementById('torchBtn');
            const zoomWrap = document.getElementById('zoomWrap');
            const monitor = document.getElementById('scanMonitor');

            if (isLiveRunning) {
                await html5QrCode.stop();
                isLiveRunning = false;
                isTorchOn = false;
                btn.innerText = "🎥 تشغيل الكاميرا السريعة (مسح الباركود)";
                btn.style.background = "#2563eb";
                torchBtn.style.display = "none";
                torchBtn.style.background = "#f59e0b";
                zoomWrap.style.display = "none";
                monitor.style.display = "none";
                return;
            }

            const isRouterMode = (currentScanMode === 'router');
            const qrBoxConfig = function(viewfinderWidth, viewfinderHeight) {
                return {
                    width: Math.floor(viewfinderWidth * 0.94),
                    height: isRouterMode
                        ? Math.max(115, Math.floor(viewfinderHeight * 0.25))
                        : Math.floor(viewfinderHeight * 0.35)
                };
            };

            try {
                try {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        {
                            fps: 25,
                            disableFlip: false,
                            qrbox: qrBoxConfig,
                            videoConstraints: {
                                facingMode: "environment",
                                width: { ideal: 1920 },
                                height: { ideal: 1080 },
                                focusMode: "continuous"
                            }
                        },
                        (text) => handleInScan(text, false)
                    );
                } catch (hdErr) {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        {
                            fps: 20,
                            disableFlip: false,
                            qrbox: qrBoxConfig
                        },
                        (text) => handleInScan(text, false)
                    );
                }

                isLiveRunning = true;
                btn.innerText = "⏹️ إيقاف الكاميرا";
                btn.style.background = "#dc2626";
                torchBtn.style.display = "flex";
                zoomWrap.style.display = "flex";
                monitor.style.display = "block";
                monitor.innerText = isRouterMode
                    ? "وضع الراوترات (IMEI).. وجه الإطار على باركود IMEI"
                    : "الكاميرا جاهزة.. وجه المستطيل على الباركود";

                document.getElementById('zoomSlider').value = "1.5";
                setTimeout(() => applyZoom(1.5), 400);
            } catch (err) {
                showMessage("⚠️ تعذر تشغيل الكاميرا، تأكد من إعطاء الصلاحية للمتصفح.", true);
            }
        }

        async function toggleTorch() {
            if (!isLiveRunning) return;
            try {
                isTorchOn = !isTorchOn;
                await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] });
                document.getElementById('torchBtn').style.background = isTorchOn ? "#16a34a" : "#f59e0b";
            } catch (err) {
                showMessage("⚠️ الفلاش غير مدعوم من المتصفح في هذا الجهاز", true);
            }
        }

        async function handleInScan(scannedCode, isManual = false) {
            const rawStr = String(scannedCode || '').trim();
            if (!rawStr) return;

            const monitor = document.getElementById('scanMonitor');

            const lowerRaw = rawStr.toLowerCase();
            if (lowerRaw.includes('http://') || lowerRaw.includes('https://') || lowerRaw.includes('www.') || lowerRaw.includes('.com') || lowerRaw.includes('.sa') || lowerRaw.includes('/')) {
                if (monitor) monitor.innerText = "تم تجاهل رابط ويب غير صالح";
                if (isManual) showMessage("⚠️ لا يمكن إضافة روابط ويب كباركود شريحة!", true);
                return; 
            }

            const normalizedRaw = rawStr.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
            const withoutImeiPrefix = normalizedRaw.replace(/^imei\s*[:\-]?\s*/i, '').trim();

            if (!isManual && !normalizedRaw.includes('89966') && (/^(s\/?n|serial)/i.test(withoutImeiPrefix) || /[a-zA-Z]/.test(withoutImeiPrefix))) {
                if (monitor) monitor.innerText = `تم تجاهل S/N (${withoutImeiPrefix}).. ارفع الكاميرا قليلاً على باركود IMEI`;
                return;
            }

            let code = cleanAndExtractDigits(withoutImeiPrefix);
            const iccidIdx = code.indexOf('89966');
            if (iccidIdx > 0) {
                code = code.substring(iccidIdx);
            }

            if (!isManual && currentScanMode === 'router' && !code.startsWith('89966') && (code.length < 14 || code.length > 16)) {
                if (monitor && code.length > 0) {
                    monitor.innerText = `قراءة غير مكتملة (${code}).. وجه الكاميرا على باركود IMEI كاملاً`;
                }
                return;
            }

            if (code.length < 8) {
                if (monitor && code.length > 0) {
                    monitor.innerText = `قراءة غير مكتملة (${code}).. اثبت قليلاً على الباركود كامل`;
                }
                if (isManual) {
                    playBeep(false);
                    showMessage("⚠️ رقم الباركود قصير جداً! يجب أن يكون 8 أرقام فأكثر.", true);
                }
                return;
            }

            if (monitor) monitor.innerText = `تم التقاط الكود: ${code}`;

            const now = Date.now();
            if (code === lastScanned && (now - lastScanTime) < 2500) return;
            lastScanned = code;
            lastScanTime = now;

            if (simsList.some(s => s.code === code)) {
                playBeep(false);
                showMessage(`⚠️ الكود (${code}) مضاف مسبقاً!`, true);
                return;
            }

            const isRouterCode = !code.startsWith('89966') && ((code.length >= 14 && code.length <= 16) || currentScanMode === 'router');
            const selectedCatInput = document.getElementById('categorySelect').value;
            let category = (selectedCatInput && selectedCatInput !== 'AUTO') ? selectedCatInput : detectCategoryByCode(code);

            if (isRouterCode && (!selectedCatInput || selectedCatInput === 'AUTO')) {
                category = ensureRouterCategoryExists();
                renderDropdowns(category, document.getElementById('durationSelect').value);
            }
            
            let duration = document.getElementById('durationSelect').value;
            if (!duration) {
                duration = (category === 'Redbull') ? '30' : '60';
            }

            const inDate = document.getElementById('inDate').value || getTodayStr();

            const newSim = {
                code: code,
                category: category,
                company: category,
                duration: duration,
                date: inDate,
                addedBy: currentUser.username,
                status: '',
                timestamp: now,
                updatedAt: now
            };

            simsList.push(newSim);
            localStorage.setItem('scanned_sims_offline', JSON.stringify(simsList));

            const itemKey = `${category} (${duration})`;
            playBeep(true);
            showMessage(`✅ تم إضافة (${itemKey}) بنجاح!`);

            await saveConfigAndSync();
            renderTable();

            try {
                if (!window.db || !navigator.onLine) throw new Error('offline');
                await window.setDoc(window.doc(window.db, "scanned_sims", code), newSim);
            } catch (e) {
                queueCloudOperation({
                    op: 'set',
                    collectionName: 'scanned_sims',
                    docId: String(code),
                    data: { ...newSim },
                    merge: true
                });
            }
        }

        window.deleteSim = async function(code) {
            const target = simsList.find(s => s.code === code);
            if (!target) return;

            if (confirm(`هل أنت متأكد من حذف (${code}) وخصمه من المخزون؟`)) {
                simsList = simsList.filter(s => s.code !== code);
                localStorage.setItem('scanned_sims_offline', JSON.stringify(simsList));

                await saveConfigAndSync();
                renderTable();
                showMessage(`🗑️ تم حذف (${code}) وتحديث الرصيد.`);

                try {
                    if (!window.db || !navigator.onLine) throw new Error('offline');
                    await window.deleteDoc(window.doc(window.db, "scanned_sims", code));
                } catch (e) {
                    queueCloudOperation({
                        op: 'delete',
                        collectionName: 'scanned_sims',
                        docId: String(code)
                    });
                }
            }
        };

        function getFixedDuration(item) {
            let dur = item.duration;
            const cat = item.category || item.company || '';
            if (dur === undefined || dur === null || dur === '-' || dur === 'غير محدد' || String(dur).trim() === '') {
                return (cat === 'Redbull') ? '30' : '60';
            }
            return String(dur).trim();
        }

        window.renderTable = function() {
            recalculateUnifiedStock();
            renderMonthlyStatsPanel();

            const tbody = document.getElementById('simTable');
            const search = document.getElementById('searchInput').value.trim().toLowerCase();

            const sorted = [...simsList].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            const filtered = sorted.filter(item => {
                const cat = item.category || item.company || '';
                const dur = getFixedDuration(item);
                const pkgCombo = `${cat} ${dur}`.toLowerCase();
                if (!search) return true;
                return (item.code && String(item.code).toLowerCase().includes(search)) ||
                       (cat.toLowerCase().includes(search)) ||
                       (String(dur).toLowerCase().includes(search)) ||
                       (pkgCombo.includes(search)) ||
                       (item.date && String(item.date).toLowerCase().includes(search)) ||
                       (item.dispatchDate && String(item.dispatchDate).toLowerCase().includes(search)) ||
                       (item.returnDate && String(item.returnDate).toLowerCase().includes(search)) ||
                       (item.tagCode && String(item.tagCode).toLowerCase().includes(search)) ||
                       (item.clientName && String(item.clientName).toLowerCase().includes(search)) ||
                       (item.shopName && String(item.shopName).toLowerCase().includes(search)) ||
                       (item.addedBy && String(item.addedBy).toLowerCase().includes(search));
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="padding:15px; color:#64748b; font-weight:bold;">لا توجد شرائح مسجلة</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => {
                const cat = item.category || item.company || '-';
                const dur = getFixedDuration(item);
                let statusMark = '';
                if (isSimReturned(item)) {
                    statusMark = `<span title="مرتجع">❌</span>`;
                } else if (item.status === 'dispatched') {
                    statusMark = `<span title="تم الصرف">✅</span>`;
                }

                return `
                    <tr>
                        <td class="status-cell">${statusMark}</td>
                        <td class="barcode-cell">${item.code}</td>
                        <td><span class="badge">${cat}</span></td>
                        <td><span class="badge" style="background:#fef3c7; color:#b45309;">${dur}</span></td>
                        <td>${item.date || '-'}</td>
                        <td><span class="user-badge">${item.addedBy || '-'}</span></td>
                        <td><button class="btn-del-row" onclick="deleteSim('${item.code}')">❌</button></td>
                    </tr>
                `;
            }).join('');
        };
    </script>
</body>
