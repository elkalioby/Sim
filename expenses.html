<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المصروفات - متجر سيم</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --danger: #dc2626;
            --success: #16a34a;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 950px; margin: 0 auto; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }
        .stat-card {
            background: var(--card);
            border-top: 4px solid var(--primary-light);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stat-card.total-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            border-top: none;
        }
        .stat-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-light);
        }
        .stat-card.total-card .stat-title { color: #dbeafe; }
        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-card.total-card .stat-value { color: #ffffff; }

        .filter-bar {
            background: var(--card);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .filter-bar label {
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--primary);
            white-space: nowrap;
        }
        .month-input {
            flex: 1;
            max-width: 240px;
            padding: 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #f8fafc;
            color: var(--text);
            outline: none;
        }
        .month-input:focus { border-color: var(--primary-light); background: #fff; }

        .card {
            background: var(--card);
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 18px;
        }
        .card h2 {
            font-size: 1.05rem;
            margin-bottom: 14px;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #374151; }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-light); }

        .spender-row { display: flex; gap: 6px; align-items: center; }
        .spender-row select { flex: 1; }
        .icon-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
        }
        .icon-btn-add { background-color: var(--success); }
        .icon-btn-del { background-color: var(--danger); }

        .btn-submit {
            background-color: var(--primary-light);
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            transition: 0.2s;
        }
        .btn-submit:hover { background-color: var(--primary); }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.9rem; }
        th, td { padding: 11px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { background: #1e293b; color: white; font-weight: 700; }
        tr:hover { background: #f8fafc; }
        .amount-cell { font-weight: 800; color: var(--danger); }
        .person-badge {
            background: #dbeafe;
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .btn-edit-row {
            background: #fef3c7;
            color: #d97706;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 4px;
        }
        .btn-edit-row:hover { background: #d97706; color: white; }
        .btn-del-row {
            background: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .btn-del-row:hover { background: var(--danger); color: white; }
        .empty-row { text-align: center; padding: 24px; color: var(--text-light); font-weight: 600; }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLlNld1YOKrX6uq15aF4BhJjWPwV40osY",
            authDomain: "ahmed-hassan-bb80b.firebaseapp.com",
            projectId: "ahmed-hassan-bb80b",
            storageBucket: "ahmed-hassan-bb80b.firebasestorage.app",
            messagingSenderId: "503682153846",
            appId: "1:503682153846:web:93b3a174ab31e351a04e57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;

        if (window.initExpensesApp) { window.initExpensesApp(); }
    </script>
</head>
<body>

    <div class="stats-grid" id="statsContainer"></div>

    <div class="filter-bar">
        <label for="monthPicker">📅 مصروفات شهر (من يوم 5):</label>
        <input type="month" id="monthPicker" class="month-input" onchange="renderAll()">
    </div>

    <div class="card" id="expenseFormCard">
        <h2 id="expenseFormTitle">➕ إضافة مصروف جديد</h2>
        <input type="hidden" id="editExpenseId" value="">
        <div class="form-grid">
            <div class="form-group">
                <label>المبلغ</label>
                <input type="number" id="expAmount" placeholder="0.00" step="0.01" min="0" oninput="saveDraft()">
            </div>

            <div class="form-group">
                <label>من قام بالصرف</label>
                <div class="spender-row">
                    <select id="expSpender" onchange="saveDraft()">
                        <option value="">-- اختر أو أضف اسماً --</option>
                    </select>
                    <button type="button" class="icon-btn icon-btn-add" onclick="addNewSpenderPrompt()" title="إضافة اسم جديد">+</button>
                    <button type="button" class="icon-btn icon-btn-del" onclick="deleteSelectedSpender()" title="حذف الاسم المحدد">✕</button>
                </div>
            </div>

            <div class="form-group">
                <label>التاريخ</label>
                <input type="date" id="expDate" onchange="saveDraft()">
            </div>

            <div class="form-group full-width">
                <label>الوصف</label>
                <textarea id="expDesc" rows="2" placeholder="اكتب تفاصيل المصروف..." oninput="saveDraft()"></textarea>
            </div>

            <div class="form-group full-width">
                <button type="button" class="btn-submit" id="submitExpenseBtn" onclick="saveExpense()">💾 إضافة</button>
                <button type="button" id="cancelExpenseEditBtn" onclick="cancelExpenseEdit()" style="display:none; width:100%; margin-top:8px; padding:10px; border:none; border-radius:8px; background:#e5e7eb; color:#374151; font-weight:bold; cursor:pointer;">إلغاء التعديل</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>📋 جدول المصروفات</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>المبلغ</th>
                        <th>الوصف</th>
                        <th>القائم بالصرف</th>
                        <th>التاريخ</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="expensesTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let expenses = [];
        let spendersList = [];
        let currentUser = JSON.parse(localStorage.getItem('logged_user')) || { username: 'admin', role: 'admin' };

        const SYNC_QUEUE_KEY = 'sim_offline_sync_queue';

        function queueCloudOperation(entry) {
            try {
                if (window.parent && window.parent !== window && window.parent.SimAutoSync) {
                    window.parent.SimAutoSync.enqueue(entry);
                    return;
                }
            } catch (e) {}

            try {
                const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                const key = `${entry.op}::${entry.collectionName}::${entry.docId || ''}`;
                if ((entry.op === 'set' || entry.op === 'update') && String(entry.docId).startsWith('local_')) {
                    const addIdx = q.findIndex(i => i.op === 'add' && i.collectionName === entry.collectionName && String(i.docId) === String(entry.docId));
                    if (addIdx !== -1) {
                        q[addIdx].data = { ...q[addIdx].data, ...entry.data };
                        q[addIdx].timestamp = Date.now();
                        localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q));
                        notifyParentQueueUpdated();
                        return;
                    }
                }
                if (entry.op === 'delete' && String(entry.docId).startsWith('local_')) {
                    const filtered = q.filter(i => !(i.collectionName === entry.collectionName && String(i.docId) === String(entry.docId)));
                    localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(filtered));
                    notifyParentQueueUpdated();
                    return;
                }
                const idx = q.findIndex(i => `${i.op}::${i.collectionName}::${i.docId || ''}` === key);
                const item = { ...entry, timestamp: Date.now() };
                if (idx !== -1) {
                    if (entry.merge && q[idx].data && entry.data) item.data = { ...q[idx].data, ...entry.data };
                    q[idx] = item;
                } else {
                    q.push(item);
                }
                localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q));
                notifyParentQueueUpdated();
            } catch (e) {}
        }

        function notifyParentQueueUpdated() {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'SIM_QUEUE_UPDATED' }, '*');
                }
            } catch (e) {}
        }

        function getPendingIdsForCollection(collectionName) {
            try {
                const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                return new Set(q.filter(i => i.collectionName === collectionName && i.op !== 'delete').map(i => String(i.docId)));
            } catch (e) {
                return new Set();
            }
        }

        function getPendingDeletesForCollection(collectionName) {
            try {
                const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                return new Set(q.filter(i => i.collectionName === collectionName && i.op === 'delete').map(i => String(i.docId)));
            } catch (e) {
                return new Set();
            }
        }

        async function flushLocalQueueFallback() {
            try {
                if (window.parent && window.parent !== window && window.parent.SimAutoSync) {
                    await window.parent.SimAutoSync.flush();
                    return;
                }
                if (!navigator.onLine || !window.db) return;
                const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                if (q.length === 0) return;

                const remaining = [];
                for (const item of q) {
                    try {
                        if (item.op === 'add') {
                            const docRef = await window.addDoc(window.collection(window.db, item.collectionName), item.data);
                            if (item.localStorageKey) {
                                const arr = JSON.parse(localStorage.getItem(item.localStorageKey) || '[]');
                                arr.forEach(r => {
                                    if (String(r[item.idField || 'id']) === String(item.docId)) {
                                        r[item.idField || 'id'] = docRef.id;
                                        if (r.id === item.docId) r.id = docRef.id;
                                    }
                                });
                                localStorage.setItem(item.localStorageKey, JSON.stringify(arr));
                            }
                        } else if (item.op === 'set') {
                            await window.setDoc(window.doc(window.db, item.collectionName, String(item.docId)), item.data, item.merge !== false ? { merge: true } : undefined);
                        } else if (item.op === 'update') {
                            await window.updateDoc(window.doc(window.db, item.collectionName, String(item.docId)), item.data);
                        } else if (item.op === 'delete') {
                            await window.deleteDoc(window.doc(window.db, item.collectionName, String(item.docId)));
                        }
                    } catch (err) {
                        remaining.push(item);
                    }
                }
                localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(remaining));
            } catch (e) {}
        }

        window.addEventListener('online', async () => {
            await flushLocalQueueFallback();
            await loadCloudData();
        });

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'SIM_CLOUD_SYNCED') {
                loadLocalData();
                renderSpendersDropdown(document.getElementById('expSpender').value);
                renderAll();
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'expenses_records_offline' || e.key === 'expenses_spenders_offline' || e.key === 'app_config') {
                loadLocalData();
                renderSpendersDropdown(document.getElementById('expSpender').value);
                renderAll();
            }
        });

        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // دالة موحدة مع المبيعات والفواتير والصرف: الشهر يبدأ يوم 5 وينتهي يوم 4 من الشهر التالي
        function getAccountingMonth(dateStr, timestampFallback) {
            let year = NaN, month = NaN, day = NaN;
            if (dateStr) {
                const clean = String(dateStr).trim();
                const isoMatch = clean.match(/^(\d{4})[-/](\d{1,2})(?:[-/](\d{1,2}))?/);
                const dmyMatch = clean.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
                if (isoMatch) {
                    year = parseInt(isoMatch[1], 10);
                    month = parseInt(isoMatch[2], 10);
                    day = isoMatch[3] ? parseInt(isoMatch[3], 10) : 5;
                } else if (dmyMatch) {
                    day = parseInt(dmyMatch[1], 10);
                    month = parseInt(dmyMatch[2], 10);
                    year = parseInt(dmyMatch[3], 10);
                }
            }
            if ((isNaN(year) || isNaN(month)) && timestampFallback) {
                const d = new Date(Number(timestampFallback));
                if (!isNaN(d.getTime())) {
                    year = d.getFullYear();
                    month = d.getMonth() + 1;
                    day = d.getDate();
                }
            }
            if (isNaN(year) || isNaN(month)) return '';
            if (!isNaN(day) && day < 5) {
                month -= 1;
                if (month < 1) {
                    month = 12;
                    year -= 1;
                }
            }
            return `${year}-${String(month).padStart(2, '0')}`;
        }

        function getActiveCycleMonthStr() {
            return getAccountingMonth(getTodayStr(), Date.now());
        }

        function loadLocalData() {
            const localExp = JSON.parse(localStorage.getItem('expenses_records_offline') || '[]');
            const localSpenders = JSON.parse(localStorage.getItem('expenses_spenders_offline') || '[]');
            const appConfig = JSON.parse(localStorage.getItem('app_config') || '{}');

            if (Array.isArray(localExp)) expenses = localExp;

            const mergedSpenders = new Set([
                ...(Array.isArray(localSpenders) ? localSpenders : []),
                ...(Array.isArray(appConfig.spendersList) ? appConfig.spendersList : [])
            ]);
            expenses.forEach(e => { if (e.spender && e.spender.trim()) mergedSpenders.add(e.spender.trim()); });
            spendersList = Array.from(mergedSpenders);
        }

        function saveDraft() {
            const draft = {
                amount: document.getElementById('expAmount').value,
                spender: document.getElementById('expSpender').value,
                desc: document.getElementById('expDesc').value
            };
            localStorage.setItem('expenses_form_draft', JSON.stringify(draft));
        }

        function restoreDraft() {
            const draft = JSON.parse(localStorage.getItem('expenses_form_draft') || 'null');
            document.getElementById('expDate').value = getTodayStr();
            if (draft) {
                if (draft.amount) document.getElementById('expAmount').value = draft.amount;
                if (draft.desc) document.getElementById('expDesc').value = draft.desc;
                if (draft.spender && spendersList.includes(draft.spender)) {
                    document.getElementById('expSpender').value = draft.spender;
                }
            }
        }

        async function syncSpendersToStorageAndCloud() {
            localStorage.setItem('expenses_spenders_offline', JSON.stringify(spendersList));
            const appConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
            appConfig.spendersList = spendersList;
            appConfig.configUpdatedAt = Date.now();
            localStorage.setItem('app_config', JSON.stringify(appConfig));

            const appCfgPayload = { spendersList: spendersList, configUpdatedAt: appConfig.configUpdatedAt };
            const expCfgPayload = { spendersList: spendersList };

            try {
                if (!window.db || !navigator.onLine) throw new Error('offline');
                await window.setDoc(window.doc(window.db, "settings", "app_config"), appCfgPayload, { merge: true });
                await window.setDoc(window.doc(window.db, "settings", "expenses_config"), expCfgPayload, { merge: true });
            } catch (e) {
                queueCloudOperation({
                    op: 'set',
                    collectionName: 'settings',
                    docId: 'app_config',
                    data: appCfgPayload,
                    merge: true
                });
                queueCloudOperation({
                    op: 'set',
                    collectionName: 'settings',
                    docId: 'expenses_config',
                    data: expCfgPayload,
                    merge: true
                });
            }
        }

        async function loadCloudData() {
            try {
                if (!window.db || !navigator.onLine) return;

                await flushLocalQueueFallback();

                const mergedSpenders = new Set(spendersList);

                const expConfigSnap = await window.getDoc(window.doc(window.db, "settings", "expenses_config"));
                if (expConfigSnap.exists()) {
                    const data = expConfigSnap.data();
                    if (Array.isArray(data.spendersList)) {
                        data.spendersList.forEach(s => { if (s && s.trim()) mergedSpenders.add(s.trim()); });
                    }
                }

                const pendingExpIds = getPendingIdsForCollection("expenses");
                const pendingExpDeletes = getPendingDeletesForCollection("expenses");
                const localMap = new Map();
                expenses.forEach(e => {
                    if (e.id && !pendingExpDeletes.has(String(e.id))) {
                        localMap.set(String(e.id), e);
                    }
                });

                const querySnapshot = await window.getDocs(window.collection(window.db, "expenses"));
                const mergedExpenses = [];
                querySnapshot.forEach((docSnap) => {
                    const docId = String(docSnap.id);
                    if (pendingExpDeletes.has(docId)) return;
                    const data = { ...docSnap.data(), id: docId };
                    if (data.spender && data.spender.trim()) {
                        mergedSpenders.add(data.spender.trim());
                    }
                    const locExp = localMap.get(docId);
                    if (locExp && (pendingExpIds.has(docId) || (locExp.updatedAt || 0) > (data.updatedAt || 0))) {
                        mergedExpenses.push(locExp);
                    } else {
                        mergedExpenses.push(data);
                    }
                    localMap.delete(docId);
                });

                localMap.forEach((remExp, idKey) => {
                    if (String(idKey).startsWith('local_') || pendingExpIds.has(String(idKey))) {
                        mergedExpenses.push(remExp);
                    }
                });

                spendersList = Array.from(mergedSpenders);
                localStorage.setItem('expenses_spenders_offline', JSON.stringify(spendersList));
                mergedExpenses.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                expenses = mergedExpenses;
                localStorage.setItem('expenses_records_offline', JSON.stringify(expenses));
            } catch (e) {
                console.error("وضع الأوفلاين:", e);
            } finally {
                renderSpendersDropdown(document.getElementById('expSpender').value);
                renderAll();
            }
        }

        function initPage() {
            const monthPicker = document.getElementById('monthPicker');
            if (monthPicker && !monthPicker.value) {
                monthPicker.value = getActiveCycleMonthStr();
            }
            loadLocalData();
            renderSpendersDropdown();
            restoreDraft();
            renderAll();
        }

        window.initExpensesApp = async function() {
            initPage();
            await loadCloudData();
        };

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }

        function renderSpendersDropdown(selectedVal = '') {
            const selectEl = document.getElementById('expSpender');
            if (!selectEl) return;
            const currentVal = selectedVal || selectEl.value || '';
            let html = `<option value="">-- اختر الاسم --</option>`;
            spendersList.forEach(name => {
                html += `<option value="${name}" ${name === currentVal ? 'selected' : ''}>${name}</option>`;
            });
            selectEl.innerHTML = html;
        }

        async function addNewSpenderPrompt() {
            const newName = prompt('✨ أدخل اسم الشخص لإضافته في القائمة:');
            if (!newName || !newName.trim()) return;
            const trimmed = newName.trim();
            if (!spendersList.includes(trimmed)) {
                spendersList.push(trimmed);
                await syncSpendersToStorageAndCloud();
            }
            renderSpendersDropdown(trimmed);
            saveDraft();
            renderAll();
        }

        async function deleteSelectedSpender() {
            const selectEl = document.getElementById('expSpender');
            const selected = selectEl.value;
            if (!selected) {
                alert('⚠️ يرجى اختيار الاسم من القائمة أولاً لحذفه.');
                return;
            }
            if (confirm(`هل أنت متأكد من حذف (${selected}) من القائمة؟`)) {
                spendersList = spendersList.filter(s => s !== selected);
                await syncSpendersToStorageAndCloud();
                renderSpendersDropdown('');
                saveDraft();
                renderAll();
            }
        }

        function getFilteredExpenses() {
            const monthVal = document.getElementById('monthPicker').value;
            if (!monthVal) return expenses;

            return expenses.filter(item => {
                const itemAccMonth = getAccountingMonth(item.date, item.createdAt) || item.cycleMonth;
                return itemAccMonth === monthVal;
            });
        }

        function editExpense(id) {
            const item = expenses.find(e => String(e.id) === String(id));
            if (!item) return;
            document.getElementById('editExpenseId').value = item.id;
            document.getElementById('expAmount').value = item.amount;
            if (item.spender && !spendersList.includes(item.spender)) {
                spendersList.push(item.spender);
            }
            renderSpendersDropdown(item.spender || '');
            document.getElementById('expDate').value = item.date || getTodayStr();
            document.getElementById('expDesc').value = item.description || '';
            document.getElementById('expenseFormTitle').textContent = '✏️ تعديل المصروف';
            document.getElementById('submitExpenseBtn').textContent = '💾 حفظ التعديل';
            document.getElementById('cancelExpenseEditBtn').style.display = 'block';
            document.getElementById('expenseFormCard').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelExpenseEdit() {
            document.getElementById('editExpenseId').value = '';
            document.getElementById('expAmount').value = '';
            document.getElementById('expDesc').value = '';
            document.getElementById('expDate').value = getTodayStr();
            document.getElementById('expenseFormTitle').textContent = '➕ إضافة مصروف جديد';
            document.getElementById('submitExpenseBtn').textContent = '💾 إضافة';
            document.getElementById('cancelExpenseEditBtn').style.display = 'none';
            saveDraft();
        }

        async function saveExpense() {
            const editId = document.getElementById('editExpenseId').value;
            const amountEl = document.getElementById('expAmount');
            const spenderEl = document.getElementById('expSpender');
            const dateEl = document.getElementById('expDate');
            const descEl = document.getElementById('expDesc');

            const amount = parseFloat(amountEl.value);
            const spender = spenderEl.value.trim();
            const date = dateEl.value;
            const description = descEl.value.trim();

            if (isNaN(amount) || amount <= 0) {
                alert('⚠️ يرجى إدخال مبلغ صحيح.');
                amountEl.focus();
                return;
            }
            if (!spender) {
                alert('⚠️ يرجى اختيار من قام بالصرف أو إضافته بزر (+).');
                return;
            }
            if (!date) {
                alert('⚠️ يرجى تحديد التاريخ.');
                return;
            }
            if (!description) {
                alert('⚠️ يرجى كتابة وصف المصروف.');
                descEl.focus();
                return;
            }

            const btn = document.getElementById('submitExpenseBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الحفظ...';

            const nowTs = Date.now();
            const cycleMonth = getAccountingMonth(date, nowTs);

            const expenseData = {
                amount: amount,
                spender: spender,
                date: date,
                description: description,
                cycleMonth: cycleMonth,
                addedBy: currentUser.username || 'admin',
                createdAt: nowTs,
                updatedAt: nowTs
            };

            if (editId) {
                const idx = expenses.findIndex(e => String(e.id) === String(editId));
                if (idx !== -1) {
                    expenseData.createdAt = expenses[idx].createdAt || nowTs;
                    expenses[idx] = { ...expenses[idx], ...expenseData, id: editId };
                }
                localStorage.setItem('expenses_records_offline', JSON.stringify(expenses));

                try {
                    if (!window.db || !navigator.onLine) throw new Error('offline');
                    if (String(editId).startsWith('local_')) {
                        const docRef = await window.addDoc(window.collection(window.db, "expenses"), expenseData);
                        if (idx !== -1) expenses[idx].id = docRef.id;
                        localStorage.setItem('expenses_records_offline', JSON.stringify(expenses));
                    } else {
                        await window.setDoc(window.doc(window.db, "expenses", String(editId)), expenseData, { merge: true });
                    }
                } catch (e) {
                    queueCloudOperation({
                        op: String(editId).startsWith('local_') ? 'add' : 'set',
                        collectionName: 'expenses',
                        docId: String(editId),
                        data: { ...expenseData },
                        merge: true,
                        localStorageKey: 'expenses_records_offline',
                        idField: 'id'
                    });
                } finally {
                    btn.disabled = false;
                    cancelExpenseEdit();
                    renderAll();
                }
                return;
            }

            const tempId = 'local_' + nowTs;
            try {
                if (!window.db || !navigator.onLine) {
                    expenses.unshift({ id: tempId, ...expenseData });
                    throw new Error('offline');
                }
                const docRef = await window.addDoc(window.collection(window.db, "expenses"), expenseData);
                expenses.unshift({ id: docRef.id, ...expenseData });
            } catch (e) {
                if (!expenses.some(item => String(item.id) === tempId)) {
                    expenses.unshift({ id: tempId, ...expenseData });
                }
                queueCloudOperation({
                    op: 'add',
                    collectionName: 'expenses',
                    docId: tempId,
                    data: { ...expenseData },
                    localStorageKey: 'expenses_records_offline',
                    idField: 'id'
                });
            } finally {
                localStorage.setItem('expenses_records_offline', JSON.stringify(expenses));
                btn.disabled = false;
                cancelExpenseEdit();
                renderAll();
            }
        }

        async function deleteExpense(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المصروف؟')) return;

            expenses = expenses.filter(item => String(item.id) !== String(id));
            localStorage.setItem('expenses_records_offline', JSON.stringify(expenses));
            renderAll();

            try {
                if (!String(id).startsWith('local_')) {
                    if (!window.db || !navigator.onLine) throw new Error('offline');
                    await window.deleteDoc(window.doc(window.db, "expenses", String(id)));
                } else {
                    queueCloudOperation({
                        op: 'delete',
                        collectionName: 'expenses',
                        docId: String(id)
                    });
                }
            } catch (e) {
                queueCloudOperation({
                    op: 'delete',
                    collectionName: 'expenses',
                    docId: String(id)
                });
            }
        }

        function renderAll() {
            const filtered = getFilteredExpenses();
            const totalAmount = filtered.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

            const statsContainer = document.getElementById('statsContainer');
            let cardsHtml = `
                <div class="stat-card total-card">
                    <div class="stat-title">💰 إجمالي المصروفات</div>
                    <div class="stat-value">${totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                </div>
            `;

            spendersList.forEach(person => {
                const personTotal = filtered
                    .filter(item => item.spender === person)
                    .reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

                cardsHtml += `
                    <div class="stat-card">
                        <div class="stat-title">👤 مصروفات ${person}</div>
                        <div class="stat-value">${personTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                    </div>
                `;
            });
            statsContainer.innerHTML = cardsHtml;

            const tbody = document.getElementById('expensesTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-row">لا توجد مصروفات مسجلة في هذا الشهر</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((item, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td class="amount-cell">${Number(item.amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    <td>${item.description}</td>
                    <td><span class="person-badge">${item.spender}</span></td>
                    <td><strong>${item.date}</strong></td>
                    <td>
                        <button type="button" class="btn-edit-row" onclick="editExpense('${item.id}')">✏️ تعديل</button>
                        <button type="button" class="btn-del-row" onclick="deleteExpense('${item.id}')">🗑️ حذف</button>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
