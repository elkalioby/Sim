<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المصروفات - متجر سيم</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --danger: #ef4444;
            --success: #16a34a;
            --warning: #d97706;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 18px; }

        .container { max-width: 1150px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

        /* المربعات الإحصائية العلوية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }
        .stat-card.total-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            border: none;
        }
        .stat-card .stat-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-card.total-card .stat-title { color: #dbeafe; }
        .stat-card .stat-value {
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-card.total-card .stat-value { color: #ffffff; }
        .delete-person-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 5px;
            border-radius: 5px;
        }
        .delete-person-btn:hover { color: var(--danger); background: #fee2e2; }

        /* شريط فلتر الشهر */
        .filter-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .filter-group label { font-weight: 700; font-size: 0.9rem; color: var(--primary); }
        .filter-input, .filter-select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: #f8fafc;
            color: var(--text);
            outline: none;
        }
        .period-badge {
            background: #eff6ff;
            color: var(--primary-light);
            border: 1px solid #bfdbfe;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        /* قسم إضافة مصروف */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .form-header h3 { font-size: 1.05rem; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            align-items: end;
        }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group.full-width { grid-column: 1 / -1; }
        .input-group label { font-size: 0.85rem; font-weight: 600; color: var(--text); }
        .input-group input, .input-group select, .input-group textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 0.92rem;
            background: #f8fafc;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--primary-light);
            background: #fff;
        }
        .spender-row {
            display: flex;
            gap: 6px;
        }
        .spender-row select { flex: 1; }
        .btn-add-person {
            background: #eff6ff;
            color: var(--primary-light);
            border: 1px solid #bfdbfe;
            padding: 0 12px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-add-person:hover { background: var(--primary-light); color: white; }

        .btn-submit-expense {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            width: 100%;
        }
        .btn-submit-expense:hover { background: #15803d; }

        /* جدول المصروفات */
        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .table-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header h3 { font-size: 1rem; color: var(--primary); }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background: #f1f5f9; color: var(--text); font-weight: 700; white-space: nowrap; }
        tr:hover { background: #f8fafc; }
        .amount-badge {
            font-weight: 800;
            color: var(--danger);
        }
        .person-tag {
            background: #eff6ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .time-sub {
            display: block;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 2px;
        }
        .btn-del-row {
            background: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .btn-del-row:hover { background: var(--danger); color: white; }
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .filter-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. مربعات الإحصائيات (الإجمالي + مربع لكل شخص في القائمة) -->
    <div class="stats-grid" id="statsContainer"></div>

    <!-- 2. فلتر مصروفات الشهر (يحسب حتى يوم 5 من الشهر التالي) -->
    <div class="filter-bar">
        <div class="filter-group">
            <label for="filterMode">📅 تصفية المصروفات:</label>
            <select id="filterMode" class="filter-select" onchange="handleFilterChange()">
                <option value="month">حسب الشهر (حتى يوم 5 من الشهر التالي)</option>
                <option value="all">كل المصروفات (بدون فلتر)</option>
            </select>
            <input type="month" id="monthPicker" class="filter-input" onchange="renderAll()">
            <select id="cycleStartDay" class="filter-select" onchange="renderAll()" title="بداية حساب الشهر">
                <option value="6">من يوم 6 في الشهر إلى يوم 5 بالشهر التالي</option>
                <option value="1">من يوم 1 في الشهر إلى يوم 5 بالشهر التالي</option>
            </select>
        </div>
        <div class="period-badge" id="periodTextBadge">جاري حساب الفترة...</div>
    </div>

    <!-- 3. نموذج وزرار إضافة مصروف جديد -->
    <div class="form-card">
        <div class="form-header">
            <h3>➕ تسجيل مصروف جديد</h3>
        </div>
        <div class="form-grid">
            <div class="input-group">
                <label for="expAmount">المبلغ</label>
                <input type="number" id="expAmount" placeholder="0.00" step="0.01" min="0">
            </div>

            <div class="input-group">
                <label for="expSpender">من قام بالصرف</label>
                <div class="spender-row">
                    <select id="expSpender"></select>
                    <button type="button" class="btn-add-person" onclick="addNewSpender()">+ إضافة اسم</button>
                </div>
            </div>

            <div class="input-group">
                <label for="expDate">التاريخ</label>
                <input type="date" id="expDate">
            </div>

            <div class="input-group full-width">
                <label for="expDesc">الوصف / البيان</label>
                <textarea id="expDesc" rows="2" placeholder="اكتب تفاصيل أو سبب المصروف..."></textarea>
            </div>

            <div class="input-group full-width">
                <button type="button" class="btn-submit-expense" onclick="addExpense()">
                    <span>💾</span> إضافة مصروف
                </button>
            </div>
        </div>
    </div>

    <!-- 4. جدول المصروفات -->
    <div class="table-card">
        <div class="table-header">
            <h3>📋 سجل المصروفات</h3>
            <span id="recordsCount" style="font-size: 0.85rem; color: var(--text-light); font-weight: 600;"></span>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>المبلغ</th>
                        <th>الوصف / البيان</th>
                        <th>القائم بالصرف</th>
                        <th>التاريخ ووقت الإضافة</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="expensesTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const EXPENSES_KEY = 'sim_store_expenses';
    const SPENDERS_KEY = 'sim_store_spenders';

    let expenses = JSON.parse(localStorage.getItem(EXPENSES_KEY)) || [];
    let spenders = JSON.parse(localStorage.getItem(SPENDERS_KEY)) || [];

    // تهيئة التاريخ الافتراضي والشهر الحالي
    function initPage() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');

        // وضع تاريخ اليوم في خانة إضافة المصروف
        document.getElementById('expDate').value = `${yyyy}-${mm}-${dd}`;

        // إذا كان اليوم بين 1 و 5 من الشهر، فنحن ما زلنا في دورة الشهر السابق تلقائياً
        let cycleYear = yyyy;
        let cycleMonth = now.getMonth() + 1;
        if (now.getDate() <= 5) {
            cycleMonth -= 1;
            if (cycleMonth === 0) {
                cycleMonth = 12;
                cycleYear -= 1;
            }
        }
        document.getElementById('monthPicker').value = `${cycleYear}-${String(cycleMonth).padStart(2, '0')}`;

        renderSpendersDropdown();
        renderAll();
    }

    function saveToStorage() {
        localStorage.setItem(EXPENSES_KEY, JSON.stringify(expenses));
        localStorage.setItem(SPENDERS_KEY, JSON.stringify(spenders));
    }

    // تحديث القائمة المنسدلة للأشخاص
    function renderSpendersDropdown(selectedName = '') {
        const select = document.getElementById('expSpender');
        if (spenders.length === 0) {
            select.innerHTML = `<option value="">-- اضغط (+ إضافة اسم) أولاً --</option>`;
            return;
        }
        select.innerHTML = spenders.map(name => 
            `<option value="${name}" ${name === selectedName ? 'selected' : ''}>${name}</option>`
        ).join('');
    }

    // إضافة شخص جديد للقائمة المنسدلة ويظهر له مربع إحصائي فوراً
    function addNewSpender() {
        const newName = prompt('أدخل اسم الشخص لإضافته في قائمة الصرف:');
        if (!newName) return;
        const cleanName = newName.trim();
        if (!cleanName) return;

        if (spenders.includes(cleanName)) {
            alert('هذا الاسم موجود بالفعل في القائمة!');
            document.getElementById('expSpender').value = cleanName;
            return;
        }

        spenders.push(cleanName);
        saveToStorage();
        renderSpendersDropdown(cleanName);
        renderAll();
    }

    // حذف اسم شخص من القائمة المنسدلة
    function removeSpender(name) {
        if (!confirm(`هل تريد حذف "${name}" من قائمة الصرف؟ (لن يتم مسح مصروفاته السابقة من الجدول)`)) return;
        spenders = spenders.filter(s => s !== name);
        saveToStorage();
        renderSpendersDropdown();
        renderAll();
    }

    // حساب بداية ونهاية الدورة الشهرية (لغاية يوم 5 من الشهر التالي)
    function getFilterDateRange() {
        const mode = document.getElementById('filterMode').value;
        const monthVal = document.getElementById('monthPicker').value;
        const startDay = parseInt(document.getElementById('cycleStartDay').value, 10);

        if (mode === 'all' || !monthVal) {
            return { mode: 'all', start: null, end: null, label: 'عرض جميع المصروفات المسجلة' };
        }

        const [year, month] = monthVal.split('-').map(Number);
        
        // تاريخ البداية: يوم (6 أو 1) من الشهر المختار الساعة 00:00:00
        const startDate = new Date(year, month - 1, startDay, 0, 0, 0, 0);
        
        // تاريخ النهاية: يوم 5 من الشهر التالي الساعة 23:59:59
        const endDate = new Date(year, month, 5, 23, 59, 59, 999);

        const formatYMD = (d) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}/${m}/${day}`;
        };

        return {
            mode: 'month',
            start: startDate,
            end: endDate,
            label: `الفترة من ${formatYMD(startDate)} حتى ${formatYMD(endDate)}`
        };
    }

    function handleFilterChange() {
        const mode = document.getElementById('filterMode').value;
        document.getElementById('monthPicker').style.display = mode === 'all' ? 'none' : 'inline-block';
        document.getElementById('cycleStartDay').style.display = mode === 'all' ? 'none' : 'inline-block';
        renderAll();
    }

    // فلترة المصروفات بناءً على الفترة المختارة
    function getFilteredExpenses() {
        const range = getFilterDateRange();
        document.getElementById('periodTextBadge').innerText = range.label;

        if (range.mode === 'all') return expenses;

        return expenses.filter(item => {
            const [y, m, d] = item.date.split('-').map(Number);
            const itemDate = new Date(y, m - 1, d, 12, 0, 0);
            return itemDate >= range.start && itemDate <= range.end;
        });
    }

    // إضافة مصروف جديد للجدول
    function addExpense() {
        const amountInput = document.getElementById('expAmount');
        const spenderInput = document.getElementById('expSpender');
        const dateInput = document.getElementById('expDate');
        const descInput = document.getElementById('expDesc');

        const amount = parseFloat(amountInput.value);
        const spender = spenderInput.value;
        const date = dateInput.value;
        const description = descInput.value.trim();

        if (isNaN(amount) || amount <= 0) {
            alert('يرجى إدخال مبلغ صحيح أكبر من صفر.');
            amountInput.focus();
            return;
        }
        if (!spender) {
            alert('يرجى اختيار الشخص القائم بالصرف أو إضافة اسم جديد من زر (+ إضافة اسم).');
            return;
        }
        if (!date) {
            alert('يرجى تحديد تاريخ المصروف.');
            dateInput.focus();
            return;
        }
        if (!description) {
            alert('يرجى كتابة وصف المصروف.');
            descInput.focus();
            return;
        }

        const now = new Date();
        const timeAdded = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        const newExpense = {
            id: Date.now(),
            amount: amount,
            spender: spender,
            date: date,
            timeAdded: timeAdded,
            description: description
        };

        expenses.unshift(newExpense);
        saveToStorage();

        // تفريغ حقلي المبلغ والوصف لتسهيل الإضافة المتتالية
        amountInput.value = '';
        descInput.value = '';
        amountInput.focus();

        renderAll();
    }

    function deleteExpense(id) {
        if (!confirm('هل أنت متأكد من حذف هذا المصروف؟')) return;
        expenses = expenses.filter(item => item.id !== id);
        saveToStorage();
        renderAll();
    }

    // تحديث المربعات العلوية والجدول
    function renderAll() {
        const filtered = getFilteredExpenses();

        // 1. حساب الإجمالي العام وإجمالي كل شخص
        const totalAmount = filtered.reduce((sum, item) => sum + Number(item.amount), 0);

        const statsContainer = document.getElementById('statsContainer');
        let cardsHTML = `
            <div class="stat-card total-card">
                <div class="stat-title">
                    <span>💰 إجمالي المصروفات</span>
                </div>
                <div class="stat-value">${totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
            </div>
        `;

        // إنشاء مربع لكل شخص مضاف في القائمة المنسدلة
        spenders.forEach(person => {
            const personTotal = filtered
                .filter(item => item.spender === person)
                .reduce((sum, item) => sum + Number(item.amount), 0);

            cardsHTML += `
                <div class="stat-card">
                    <div class="stat-title">
                        <span>👤 مصروفات ${person}</span>
                        <button class="delete-person-btn" title="حذف الاسم من القائمة" onclick="removeSpender('${person}')">✖</button>
                    </div>
                    <div class="stat-value">${personTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                </div>
            `;
        });

        statsContainer.innerHTML = cardsHTML;

        // 2. تحديث جدول المصروفات
        const tbody = document.getElementById('expensesTableBody');
        document.getElementById('recordsCount').innerText = `عدد الحركات: ${filtered.length}`;

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state">لا توجد مصروفات مسجلة في هذه الفترة</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map((item, index) => `
            <tr>
                <td>${index + 1}</td>
                <td><span class="amount-badge">${Number(item.amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span></td>
                <td>${item.description}</td>
                <td><span class="person-tag">${item.spender}</span></td>
                <td>
                    <strong>${item.date}</strong>
                    <span class="time-sub">وقت الإضافة: ${item.timeAdded || '-'}</span>
                </td>
                <td>
                    <button class="btn-del-row" onclick="deleteExpense(${item.id})">حذف</button>
                </td>
            </tr>
        `).join('');
    }

    initPage();
</script>

</body>
</html>
