<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة حسابات العملاء والمبيعات والمخزون</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 900px; margin: 0 auto; }
        
        .card { background: var(--card); padding: 18px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--primary); border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #374151; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; outline: none; background: #fff; }
        
        #phone { text-align: right; direction: rtl; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-light); }
        input[readonly] { background-color: #f9fafb; font-weight: bold; color: var(--primary); }

        .autocomplete-wrapper { position: relative; }
        .customers-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            background: #ffffff;
            border: 1.5px solid var(--primary-light);
            border-radius: 10px;
            max-height: 210px;
            overflow-y: auto;
            z-index: 500;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            margin-top: 4px;
        }
        .customer-option {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px;
            transition: background 0.15s;
        }
        .customer-option:last-child { border-bottom: none; }
        .customer-option:hover, .customer-option:active { background: #eff6ff; }
        .customer-option-main { font-weight: 700; font-size: 0.9rem; color: var(--primary); }
        .customer-option-sub { font-size: 0.78rem; color: #64748b; display: flex; gap: 8px; flex-wrap: wrap; }
        
        .btn { padding: 10px 14px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-primary { background-color: var(--primary-light); color: white; width: 100%; margin-top: 10px; padding: 12px; }
        .btn-success { background-color: var(--success); color: white; padding: 7px 12px; font-size: 0.8rem; }
        .btn-danger { background-color: #fee2e2; color: var(--danger); padding: 7px 12px; font-size: 0.8rem; }
        .btn-warning { background-color: #fef3c7; color: var(--warning); padding: 7px 12px; font-size: 0.8rem; }
        .btn-gear { background: #e5e7eb; color: #374151; padding: 6px 10px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; }
        
        .cart-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.85rem; }
        .cart-table th, .cart-table td { border: 1px solid #e5e7eb; padding: 6px 8px; text-align: center; }
        .cart-table th { background: #f3f4f6; color: var(--primary); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-box { background: white; padding: 20px; border-radius: 14px; width: 100%; max-width: 450px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
        .modal-header h3 { color: var(--primary); font-size: 1.1rem; }
        .stock-row { display: flex; justify-content: space-between; align-items: center; background: #f9fafb; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e5e7eb; gap: 10px; }
        .stock-info { font-size: 0.9rem; font-weight: 600; color: var(--text); flex: 1; }

        .controls-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; align-items: center; }
        .controls-bar input { flex: 1; min-width: 180px; }
        .controls-bar select { width: auto; padding: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .filter-btn { background: #e5e7eb; color: #374151; padding: 10px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .filter-btn.active { background: var(--danger); color: white; }
        
        .customer-item { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fafafa; }
        .customer-item.has-debt { border-right: 5px solid var(--danger); }
        .customer-item.no-debt { border-right: 5px solid var(--success); }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
        .client-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .client-name { font-weight: bold; font-size: 1.05rem; color: var(--primary); }
        .shop-badge { background: #dbeafe; color: var(--primary); padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .market-badge { background: #fef3c7; color: #d97706; padding: 3px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; }
        .emp-badge { background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .phone-link { color: var(--primary-light); cursor: pointer; text-decoration: underline; font-weight: bold; }
        
        .item-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: white; padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center; border: 1px solid #f3f4f6; }
        .detail-box span { display: block; font-size: 0.75rem; color: #6b7280; }
        .detail-box strong { font-size: 0.95rem; }
        .debt-amount { color: var(--danger); }
        .paid-amount { color: var(--success); }
        .notes-box { font-size: 0.82rem; color: #4b5563; background: #f3f4f6; padding: 8px; border-radius: 6px; margin-bottom: 10px; white-space: pre-line; }
        
        .payments-log { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 0.8rem; }
        .payments-log-title { font-weight: bold; color: #15803d; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .payment-row { display: flex; justify-content: space-between; color: #166534; padding: 3px 0; border-bottom: 1px dashed #dcfce7; }
        .payment-row:last-child { border-bottom: none; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; flex-wrap: wrap; gap: 8px; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 15px; flex-wrap: wrap; }
        .page-btn { background: #e5e7eb; color: var(--text); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .page-btn.active { background: var(--primary); color: white; }

        @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLlNld1YOKrX6uq15aF4BhJjWPwV40osY",
            authDomain: "ahmed-hassan-bb80b.firebaseapp.com",
            projectId: "ahmed-hassan-bb80b",
            storageBucket: "ahmed-hassan-bb80b.firebasestorage.app",
            messagingSenderId: "503682153846",
            appId: "1:503682153846:web:93b3a174ab31e351a04e57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        
        if (window.initApp) { window.initApp(); }
    </script>
</head>
<body>

    <div class="card">
        <h2 id="formTitle">+ تسجيل فاتورة / حركة بيع جديدة</h2>
        <form id="saleForm">
            <input type="hidden" id="editRecordId" value="">
            <div class="form-grid">
                
                <div class="autocomplete-wrapper">
                    <label>اسم العميل *</label>
                    <input type="text" id="clientName" required autocomplete="off" placeholder="اكتب اسم العميل أو المحل للبحث..." oninput="filterCustomersDropdown()" onfocus="filterCustomersDropdown()">
                    <div id="customersDropdown" class="customers-dropdown"></div>
                </div>

                <div>
                    <label>اسم المحل وصورة المحل *</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="shopName" required placeholder="اسم المحل" style="flex:1;">
                        <input type="file" id="shopImageGallery" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                        <button type="button" class="btn" onclick="document.getElementById('shopImageGallery').click()" style="background:#e5e7eb; padding:8px 10px;" title="اختيار صورة من المعرض">📁</button>
                        <input type="file" id="shopImageCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleImageUpload(event)">
                        <button type="button" class="btn" onclick="document.getElementById('shopImageCamera').click()" style="background:#2563eb; color:white; padding:8px 10px;" title="التقاط صورة بالكاميرا">📷</button>
                    </div>
                </div>

                <div class="full-width">
                    <label>العنوان / السوق *</label>
                    <select id="marketName" required style="cursor:pointer;">
                        <option value="">-- اختر العنوان / السوق --</option>
                    </select>
                </div>

                <div class="full-width">
                    <label>رقم التليفون *</label>
                    <input type="tel" id="phone" required placeholder="05xxxxxxxx">
                </div>
                
                <div class="full-width" style="background:#f9fafb; padding:12px; border-radius:10px; border:1px solid #e5e7eb;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <label style="color:var(--primary); margin:0;">إضافة أصناف الفاتورة:</label>
                        <button type="button" class="btn-gear" onclick="openStockModal()" title="إدارة الأصناف والمخزون">⚙️</button>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;">
                        <div style="flex:2; min-width:150px;">
                            <label style="font-size:0.75rem;">الصنف</label>
                            <select id="currentItem"></select>
                        </div>
                        <div style="flex:1; min-width:70px;">
                            <label style="font-size:0.75rem;">العدد</label>
                            <input type="number" id="currentQty" step="any" placeholder="0">
                        </div>
                        <div style="flex:1; min-width:70px;">
                            <label style="font-size:0.75rem;">السعر</label>
                            <input type="number" id="currentPrice" step="any" placeholder="0">
                        </div>
                        <div>
                            <button type="button" class="btn" onclick="addItemToCart()" style="background:var(--primary); color:white; padding:10px 14px;">➕ إضافة</button>
                        </div>
                    </div>

                    <div id="cartContainer" style="margin-top:10px; display:none;">
                        <table class="cart-table">
                            <thead>
                                <tr>
                                    <th>الصنف</th>
                                    <th>العدد</th>
                                    <th>السعر</th>
                                    <th>الإجمالي</th>
                                    <th>حذف</th>
                                </tr>
                            </thead>
                            <tbody id="cartTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <label>إجمالي الفاتورة (تلقائي)</label>
                    <input type="number" id="total" readonly value="0">
                </div>
                <div>
                    <label>المبلغ المدفوع الآن</label>
                    <input type="number" id="paid" step="any" placeholder="" oninput="calcRemaining()">
                </div>
                <div class="full-width">
                    <label>المديونية المتبقية (تلقائي)</label>
                    <input type="number" id="remaining" readonly value="0" style="color: var(--danger);" oninput="toggleReminderVisibility()">
                </div>
                
                <div id="reminderSection" class="full-width" style="display:none; background:#fef3c7; padding:12px; border-radius:10px; border:1px solid #f59e0b;">
                    <div class="form-grid" style="margin:0;">
                        <div>
                            <label style="color:#b45309;">موعد التنبيه / السداد</label>
                            <input type="date" id="reminderDate">
                        </div>
                        <div>
                            <label style="color:#b45309;">وقت التنبيه</label>
                            <input type="time" id="reminderTime" value="09:00">
                        </div>
                    </div>
                </div>

                <div class="full-width">
                    <label>ملاحظات</label>
                    <textarea id="notes" rows="2" placeholder="مواعيد سداد أو تفاصيل إضافية..."></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">حفظ الفاتورة ومزامنتها</button>
            <button type="button" class="btn" id="cancelEditBtn" onclick="resetForm()" style="background:#e5e7eb; color:#374151; width:100%; margin-top:8px; display:none;">إلغاء التعديل</button>
        </form>
    </div>

    <div class="modal-overlay" id="stockModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>📦 إدارة الأصناف ورصيد المخزون</h3>
                <button type="button" class="btn" onclick="closeStockModal()" style="background:#e5e7eb; padding:4px 8px; font-size:0.8rem;">✕ إغلاق</button>
            </div>
            <div id="modalStockList" style="max-height:250px; overflow-y:auto; margin-bottom:12px;"></div>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-bottom:12px;">سجل العملاء والمديونيات</h2>

        <div class="controls-bar">
            <input type="text" id="searchInput" placeholder="ابحث باسم العميل، المحل، العنوان، أو التليفون..." oninput="currentPage=1; renderRecords()">
            <select id="timeFilter" onchange="currentPage=1; renderRecords()">
                <option value="all">كل الفترات</option>
                <option value="today">اليوم</option>
                <option value="week">هذا الأسبوع (آخر 7 أيام)</option>
                <option value="month">هذا الشهر</option>
            </select>
            <button class="filter-btn" id="debtFilterBtn" onclick="currentPage=1; toggleDebtFilter()">المديونيات فقط</button>
        </div>

        <div id="recordsList"><p style="text-align:center; color:#6b7280; padding:20px;">جاري جلب البيانات...</p></div>
        <div id="paginationContainer" class="pagination"></div>
    </div>

    <script>
        let records = [];
        let currentCart = [];
        let stockInventory = {};
        let autoStockInventory = {};
        let stockOffsets = {};
        let deletedStockItems = [];
        let configUpdatedAt = 0;
        let marketList = [];
        let savedCustomersList = [];
        let currentUser = JSON.parse(localStorage.getItem('logged_user')) || { username: 'مجهول', role: 'employee' };

        let tempImageBase64 = '';
        let showDebtOnly = false;
        let currentPage = 1;
        const itemsPerPage = 5;

        document.getElementById('reminderDate').valueAsDate = new Date();

        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.autocomplete-wrapper');
            const dropdown = document.getElementById('customersDropdown');
            if (wrapper && dropdown && !wrapper.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        window.addEventListener('storage', async function(e) {
            if (e.key === 'app_config' || e.key === 'markets_list_offline' || e.key === 'customers_records_offline' || e.key === 'scanned_sims_offline' || e.key === 'sales_records_offline') {
                loadLocalConfig();
                loadSavedCustomers();
                syncLocalMarkets();
                await calculateStockFromSims();
                updateMarketSelect();
                updateItemSelects();
                renderModalStockList();
            }
        });

        function loadLocalConfig() {
            const localConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
            if (localConfig) {
                deletedStockItems = localConfig.deletedStockItems || [];
                stockOffsets = localConfig.stockOffsets || {};
                configUpdatedAt = localConfig.configUpdatedAt || 0;
            }
        }

        function syncLocalMarkets() {
            const localConfig = JSON.parse(localStorage.getItem('app_config') || '{}');
            const localMarketsOffline = JSON.parse(localStorage.getItem('markets_list_offline') || '[]');
            const merged = new Set([
                ...(Array.isArray(localConfig.marketList) ? localConfig.marketList : []),
                ...(Array.isArray(localMarketsOffline) ? localMarketsOffline : []),
                ...marketList
            ]);
            savedCustomersList.forEach(c => { if (c.marketName && c.marketName.trim()) merged.add(c.marketName.trim()); });
            records.forEach(r => { if (r.marketName && r.marketName.trim()) merged.add(r.marketName.trim()); });
            marketList = Array.from(merged);
        }

        window.initApp = async function() {
            loadLocalConfig();
            loadSavedCustomers();
            
            const localRecords = JSON.parse(localStorage.getItem('sales_records_offline'));
            if (localRecords) {
                records = localRecords;
            }

            syncLocalMarkets();
            await calculateStockFromSims();
            updateMarketSelect();
            updateItemSelects();
            renderRecords();

            try {
                if (window.db) {
                    const mergedMarkets = new Set(marketList);

                    const configRef = window.doc(window.db, "settings", "app_config");
                    const configSnap = await window.getDoc(configRef);
                    if (configSnap.exists()) {
                        const data = configSnap.data();
                        if (Array.isArray(data.marketList)) {
                            data.marketList.forEach(m => { if (m && m.trim()) mergedMarkets.add(m.trim()); });
                        }
                        const cloudUpdatedAt = data.configUpdatedAt || 0;
                        if (cloudUpdatedAt >= configUpdatedAt) {
                            deletedStockItems = data.deletedStockItems || deletedStockItems;
                            stockOffsets = data.stockOffsets || stockOffsets;
                            configUpdatedAt = cloudUpdatedAt;
                            localStorage.setItem('app_config', JSON.stringify({
                                marketList: Array.from(mergedMarkets),
                                stockInventory,
                                stockOffsets,
                                deletedStockItems,
                                configUpdatedAt
                            }));
                        } else {
                            // رفع التعديلات المحلية الأحدث إلى السحابة
                            await saveConfig();
                        }
                    }

                    const marketsConfigSnap = await window.getDoc(window.doc(window.db, "settings", "markets_config"));
                    if (marketsConfigSnap.exists()) {
                        const mData = marketsConfigSnap.data();
                        if (Array.isArray(mData.marketsList)) {
                            mData.marketsList.forEach(m => { if (m && m.trim()) mergedMarkets.add(m.trim()); });
                        }
                    }

                    const custSnap = await window.getDocs(window.collection(window.db, "customers"));
                    if (!custSnap.empty) {
                        savedCustomersList = [];
                        custSnap.forEach(d => {
                            const cData = d.data();
                            savedCustomersList.push({ id: d.id, ...cData });
                            if (cData.marketName && cData.marketName.trim()) {
                                mergedMarkets.add(cData.marketName.trim());
                            }
                        });
                        localStorage.setItem('customers_records_offline', JSON.stringify(savedCustomersList));
                    }

                    marketList = Array.from(mergedMarkets);
                    localStorage.setItem('markets_list_offline', JSON.stringify(marketList));
                    updateMarketSelect();

                    await loadCloudRecords();
                }
            } catch (e) {
                console.log("وضع الأوفلاين مفعل.");
            }
        };

        async function calculateStockFromSims() {
            let sims = JSON.parse(localStorage.getItem('scanned_sims_offline')) || [];
            if (window.db) {
                try {
                    const simsSnap = await window.getDocs(window.collection(window.db, "scanned_sims"));
                    if (!simsSnap.empty) {
                        sims = [];
                        simsSnap.forEach(d => sims.push(d.data()));
                        localStorage.setItem('scanned_sims_offline', JSON.stringify(sims));
                    }
                } catch(err) {}
            }

            autoStockInventory = {};
            sims.forEach(item => {
                const cat = item.category || item.company || 'Mobily';
                let dur = item.duration;
                if (!dur || dur === '-' || dur === 'غير محدد' || dur === '') {
                    dur = (cat === 'Redbull') ? '30' : '60';
                }
                const itemKey = `${cat} (${dur})`;
                autoStockInventory[itemKey] = (autoStockInventory[itemKey] || 0) + 1;
            });

            records.forEach(r => {
                if (r.cartItems && Array.isArray(r.cartItems)) {
                    r.cartItems.forEach(ci => {
                        if (autoStockInventory[ci.item] === undefined) {
                            autoStockInventory[ci.item] = 0;
                        }
                        autoStockInventory[ci.item] -= ci.qty;
                    });
                }
            });

            sims.forEach(item => {
                const cat = item.category || item.company;
                if (cat && autoStockInventory[cat] === undefined && autoStockInventory[`${cat} (60)`] === undefined) {
                    autoStockInventory[cat] = 1;
                }
            });

            // دمج الرصيد التلقائي مع التعديلات اليدوية المحفوظة (stockOffsets)
            stockInventory = {};
            const allKeys = new Set([
                ...Object.keys(autoStockInventory),
                ...Object.keys(stockOffsets || {})
            ]);

            allKeys.forEach(key => {
                const base = autoStockInventory[key] || 0;
                const offset = (stockOffsets && stockOffsets[key] !== undefined) ? parseFloat(stockOffsets[key]) : 0;
                const finalQty = base + offset;
                stockInventory[key] = finalQty >= 0 ? finalQty : 0;
            });

            deletedStockItems.forEach(delItem => {
                delete stockInventory[delItem];
            });
        }

        function loadSavedCustomers() {
            const localCust = JSON.parse(localStorage.getItem('customers_records_offline')) || [];
            savedCustomersList = localCust;
        }

        function filterCustomersDropdown() {
            const inputEl = document.getElementById('clientName');
            const dropdown = document.getElementById('customersDropdown');
            const query = (inputEl.value || '').trim().toLowerCase();

            if (!savedCustomersList || savedCustomersList.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            const matched = savedCustomersList.filter(c => {
                const cName = (c.clientName || '').toLowerCase();
                const sName = (c.shopName || '').toLowerCase();
                const mName = (c.marketName || '').toLowerCase();
                const phone = (c.phone || '');
                if (!query) return true;
                return cName.includes(query) || sName.includes(query) || mName.includes(query) || phone.includes(query);
            });

            if (matched.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            dropdown.innerHTML = matched.map((c, index) => {
                const displayClient = (c.clientName && c.clientName !== 'بدون اسم') ? c.clientName : (c.shopName || 'عميل');
                return `
                    <div class="customer-option" onclick="selectCustomerFromList('${c.id || index}')">
                        <div class="customer-option-main">👤 ${displayClient} ${c.shopName ? `— 🏪 ${c.shopName}` : ''}</div>
                        <div class="customer-option-sub">
                            ${c.marketName ? `<span>📍 ${c.marketName}</span>` : ''}
                            ${c.phone ? `<span>📞 ${c.phone}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            dropdown.style.display = 'block';
        }

        function selectCustomerFromList(idOrIdx) {
            const c = savedCustomersList.find((item, idx) => String(item.id || idx) === String(idOrIdx));
            if (!c) return;

            const displayClient = (c.clientName && c.clientName !== 'بدون اسم') ? c.clientName : (c.shopName || '');
            document.getElementById('clientName').value = displayClient;
            if (c.shopName) document.getElementById('shopName').value = c.shopName;
            if (c.phone) document.getElementById('phone').value = c.phone;

            if (c.marketName) {
                if (!marketList.includes(c.marketName)) {
                    marketList.push(c.marketName);
                }
                updateMarketSelect(c.marketName);
            }
            if (c.shopImage) {
                tempImageBase64 = c.shopImage;
            }

            document.getElementById('customersDropdown').style.display = 'none';
        }

        async function saveConfig() {
            configUpdatedAt = Date.now();
            const dataToSave = {
                marketList,
                stockInventory,
                stockOffsets,
                deletedStockItems,
                configUpdatedAt
            };
            localStorage.setItem('app_config', JSON.stringify(dataToSave));
            localStorage.setItem('markets_list_offline', JSON.stringify(marketList));
            try {
                if (window.db) {
                    const configRef = window.doc(window.db, "settings", "app_config");
                    await window.setDoc(configRef, dataToSave, { merge: true });
                }
            } catch (e) {}
        }

        function updateItemSelects() {
            const select = document.getElementById('currentItem');
            const itemKeys = Object.keys(stockInventory);
            
            if (itemKeys.length === 0) {
                select.innerHTML = `<option value="">-- لا توجد أصناف متاحة في المخزون --</option>`;
                return;
            }

            select.innerHTML = itemKeys.map(item => {
                const currentStock = stockInventory[item] !== undefined ? stockInventory[item] : 0;
                return `<option value="${item}">${item} (المتاحة: ${currentStock})</option>`;
            }).join('');
        }

        function updateMarketSelect(selectedVal = '') {
            const select = document.getElementById('marketName');
            const currentVal = selectedVal || select.value || '';
            const sortedMarkets = [...marketList].sort((a, b) => a.localeCompare(b, 'ar'));

            select.innerHTML = `<option value="">-- اختر العنوان / السوق --</option>` + 
                sortedMarkets.map(m => `<option value="${m}" ${m === currentVal ? 'selected' : ''}>${m}</option>`).join('');
        }

        function openStockModal() {
            updateItemSelects();
            renderModalStockList();
            document.getElementById('stockModal').style.display = 'flex';
        }

        function closeStockModal() {
            document.getElementById('stockModal').style.display = 'none';
        }

        function renderModalStockList() {
            const container = document.getElementById('modalStockList');
            const keys = Object.keys(stockInventory);
            if (keys.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#6b7280;">لا توجد أصناف في المخزون حالياً.</p>';
                return;
            }
            container.innerHTML = keys.map(item => {
                const qty = stockInventory[item] !== undefined ? stockInventory[item] : 0;
                return `
                    <div class="stock-row">
                        <div class="stock-info">📦 ${item} : <strong>${qty} وحدة</strong></div>
                        <div style="display:flex; gap:6px;">
                            <button type="button" class="btn btn-warning" onclick="editModalStock('${item}')" style="padding:5px 10px; font-size:0.85rem;" title="تعديل الرصيد">✏️</button>
                            <button type="button" class="btn btn-danger" onclick="deleteModalStock('${item}')" style="padding:5px 10px; font-size:0.85rem;" title="حذف الصنف">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function editModalStock(item) {
            const currentQty = stockInventory[item] !== undefined ? stockInventory[item] : 0;
            const newQtyStr = prompt(`أدخل الرصيد الجديد للصنف (${item}):`, currentQty);
            if (newQtyStr === null) return;
            const newQty = parseFloat(newQtyStr);
            if (isNaN(newQty) || newQty < 0) return;

            const baseAuto = autoStockInventory[item] || 0;
            stockOffsets[item] = newQty - baseAuto;
            stockInventory[item] = newQty;

            updateItemSelects();
            renderModalStockList();
            await saveConfig();
        }

        async function deleteModalStock(item) {
            if (confirm(`هل أنت متأكد من حذف الصنف (${item}) من المخزون؟`)) {
                delete stockInventory[item];
                delete stockOffsets[item];
                if (!deletedStockItems.includes(item)) {
                    deletedStockItems.push(item);
                }
                updateItemSelects();
                renderModalStockList();
                await saveConfig();
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { tempImageBase64 = e.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function addItemToCart() {
            const item = document.getElementById('currentItem').value;
            const qty = parseFloat(document.getElementById('currentQty').value);
            const price = parseFloat(document.getElementById('currentPrice').value);

            if (!item) {
                alert('يرجى اختيار الصنف.');
                return;
            }

            if (isNaN(qty) || qty <= 0 || isNaN(price) || price < 0) {
                alert('يرجى إدخال عدد وسعر صحيحين.');
                return;
            }

            const currentAvailable = stockInventory[item] || 0;
            if (qty > currentAvailable) {
                alert(`⚠️ الكمية المطلوبة (${qty}) أكبر من المخزون المتاح (${currentAvailable}) لهذا الصنف!`);
                return;
            }

            currentCart.push({ item, qty, price, total: qty * price });
            document.getElementById('currentQty').value = '';
            document.getElementById('currentPrice').value = '';
            renderCart();
        }

        function removeFromCart(index) {
            currentCart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartContainer');
            const tbody = document.getElementById('cartTableBody');
            
            if (currentCart.length === 0) {
                container.style.display = 'none';
                tbody.innerHTML = '';
                document.getElementById('total').value = '0';
                calcRemaining();
                return;
            }

            container.style.display = 'block';
            let grandTotal = 0;
            tbody.innerHTML = currentCart.map((c, idx) => {
                grandTotal += c.total;
                return `<tr>
                    <td>${c.item}</td>
                    <td>${c.qty}</td>
                    <td>${c.price}</td>
                    <td>${c.total}</td>
                    <td><button type="button" class="btn btn-danger" onclick="removeFromCart(${idx})" style="padding:2px 6px;">حذف</button></td>
                </tr>`;
            }).join('');

            document.getElementById('total').value = grandTotal;
            calcRemaining();
        }

        function calcRemaining() {
            const total = parseFloat(document.getElementById('total').value) || 0;
            const paid = parseFloat(document.getElementById('paid').value) || 0;
            const remaining = total - paid;
            document.getElementById('remaining').value = remaining >= 0 ? remaining : 0;
            toggleReminderVisibility();
        }

        function toggleReminderVisibility() {
            const remaining = parseFloat(document.getElementById('remaining').value) || 0;
            document.getElementById('reminderSection').style.display = remaining > 0 ? 'block' : 'none';
        }

        window.loadCloudRecords = async function() {
            try {
                if(!window.db) return;
                const localUnsynced = records.filter(r => r.firebaseId && String(r.firebaseId).startsWith('local_'));
                const querySnapshot = await window.getDocs(window.collection(window.db, "sales_records"));
                const cloudRecords = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    cloudRecords.push({ ...data, firebaseId: docSnap.id });
                    if (data.marketName && data.marketName.trim() && !marketList.includes(data.marketName.trim())) {
                        marketList.push(data.marketName.trim());
                    }
                });
                records = [...cloudRecords, ...localUnsynced];
                localStorage.setItem('sales_records_offline', JSON.stringify(records));
                updateMarketSelect();
                await calculateStockFromSims();
                updateItemSelects();
                renderModalStockList();
                renderRecords();
            } catch (e) {}
        };

        document.getElementById('saleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (currentCart.length === 0) {
                alert('يرجى إضافة صنف واحد على الأقل.');
                return;
            }

            const marketVal = document.getElementById('marketName').value;
            if (!marketVal) {
                alert('يرجى اختيار العنوان / السوق.');
                return;
            }

            const editId = document.getElementById('editRecordId').value;
            const remaining = parseFloat(document.getElementById('remaining').value) || 0;
            const paidNow = parseFloat(document.getElementById('paid').value) || 0;
            const totalVal = parseFloat(document.getElementById('total').value) || 0;

            let paymentsHistory = [];
            let originalDate = new Date().toISOString().split('T')[0];
            let originalTimestamp = Date.now();

            if (editId) {
                const oldRec = records.find(r => r.firebaseId === editId);
                if (oldRec) {
                    originalDate = oldRec.date || originalDate;
                    originalTimestamp = oldRec.timestamp || originalTimestamp;
                    if (oldRec.paymentsHistory) {
                        paymentsHistory = [...oldRec.paymentsHistory];
                    }
                }
            }

            if (paidNow > 0 && (!editId || paymentsHistory.length === 0)) {
                paymentsHistory.push({
                    date: new Date().toISOString().split('T')[0],
                    amount: paidNow,
                    employee: currentUser.username
                });
            }

            const recordData = {
                date: originalDate,
                timestamp: originalTimestamp,
                clientName: document.getElementById('clientName').value,
                shopName: document.getElementById('shopName').value,
                marketName: marketVal,
                phone: document.getElementById('phone').value,
                employee: currentUser.username,
                cartItems: currentCart,
                itemsSummary: currentCart.map(c => `${c.item} (عدد: ${c.qty}، سعر: ${c.price})`).join(' | '),
                total: totalVal,
                paid: paidNow,
                remaining: remaining,
                paymentsHistory: paymentsHistory,
                reminderDate: remaining > 0 ? document.getElementById('reminderDate').value : '',
                reminderTime: remaining > 0 ? document.getElementById('reminderTime').value : '',
                notes: document.getElementById('notes').value,
                shopImage: tempImageBase64 || ''
            };

            try {
                if (editId) {
                    // تحديث السجل في المصفوفة المحلية فوراً
                    records = records.map(r => r.firebaseId === editId ? { ...recordData, firebaseId: editId } : r);
                    localStorage.setItem('sales_records_offline', JSON.stringify(records));

                    if (window.db) {
                        if (editId.startsWith('local_')) {
                            const docRef = await window.addDoc(window.collection(window.db, "sales_records"), recordData);
                            records = records.map(r => r.firebaseId === editId ? { ...recordData, firebaseId: docRef.id } : r);
                            localStorage.setItem('sales_records_offline', JSON.stringify(records));
                        } else {
                            await window.setDoc(window.doc(window.db, "sales_records", editId), recordData, { merge: true });
                        }
                    }
                    alert('تم تعديل الفاتورة وتحديث المخزون بنجاح!');
                } else {
                    if (window.db) {
                        const docRef = await window.addDoc(window.collection(window.db, "sales_records"), recordData);
                        records.push({ ...recordData, firebaseId: docRef.id });
                    } else {
                        recordData.firebaseId = 'local_' + Date.now();
                        records.push(recordData);
                    }
                    localStorage.setItem('sales_records_offline', JSON.stringify(records));
                    alert('تم حفظ الفاتورة بنجاح!');
                }

                await calculateStockFromSims();
                await saveConfig();
                updateItemSelects();
                resetForm();
                renderRecords();
            } catch (err) {
                if (editId) {
                    records = records.map(r => r.firebaseId === editId ? { ...recordData, firebaseId: editId } : r);
                } else {
                    recordData.firebaseId = 'local_' + Date.now();
                    records.push(recordData);
                }
                localStorage.setItem('sales_records_offline', JSON.stringify(records));
                await calculateStockFromSims();
                await saveConfig();
                updateItemSelects();
                alert('تم حفظ التعديلات محلياً.');
                resetForm();
                renderRecords();
            }
        });

        function resetForm() {
            document.getElementById('saleForm').reset();
            document.getElementById('editRecordId').value = '';
            document.getElementById('formTitle').innerText = '+ تسجيل فاتورة / حركة بيع جديدة';
            document.getElementById('submitBtn').innerText = 'حفظ الفاتورة ومزامنتها';
            document.getElementById('cancelEditBtn').style.display = 'none';
            updateMarketSelect('');
            currentCart = [];
            tempImageBase64 = '';
            renderCart();
            document.getElementById('reminderDate').valueAsDate = new Date();
            toggleReminderVisibility();
        }

        function editRecord(firebaseId) {
            const r = records.find(item => item.firebaseId === firebaseId);
            if (!r) return;

            document.getElementById('editRecordId').value = r.firebaseId;
            document.getElementById('clientName').value = r.clientName || '';
            document.getElementById('shopName').value = r.shopName || '';
            if (r.marketName && !marketList.includes(r.marketName)) {
                marketList.push(r.marketName);
            }
            updateMarketSelect(r.marketName || '');
            document.getElementById('phone').value = r.phone || '';
            document.getElementById('paid').value = r.paid || '';
            document.getElementById('reminderDate').value = r.reminderDate || '';
            document.getElementById('reminderTime').value = r.reminderTime || '09:00';
            document.getElementById('notes').value = r.notes || '';
            tempImageBase64 = r.shopImage || '';

            currentCart = r.cartItems ? [...r.cartItems] : [];
            renderCart();

            document.getElementById('formTitle').innerText = '✏️ تعديل بيانات الفاتورة';
            document.getElementById('submitBtn').innerText = 'حفظ التعديلات';
            document.getElementById('cancelEditBtn').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function makePartialPayment(firebaseId) {
            const r = records.find(item => item.firebaseId === firebaseId);
            if (!r) return;

            const addPayStr = prompt(`المديونية الحالية على (${r.clientName}): ${r.remaining}\nأدخل المبلغ المراد سداده الآن:`);
            if (!addPayStr) return;
            const addPay = parseFloat(addPayStr);
            if (isNaN(addPay) || addPay <= 0 || addPay > r.remaining) return;

            r.paid = (r.paid || 0) + addPay;
            r.remaining = (r.remaining || 0) - addPay;
            
            if (!r.paymentsHistory) r.paymentsHistory = [];
            r.paymentsHistory.push({
                date: new Date().toISOString().split('T')[0],
                amount: addPay,
                employee: currentUser.username
            });

            r.notes = (r.notes || '') + `\n[سداد دفعة بقيمة ${addPay} بواسطة ${currentUser.username}]`;

            localStorage.setItem('sales_records_offline', JSON.stringify(records));
            renderRecords();

            try {
                if (window.db && !firebaseId.startsWith('local_')) {
                    await window.setDoc(window.doc(window.db, "sales_records", firebaseId), {
                        paid: r.paid,
                        remaining: r.remaining,
                        paymentsHistory: r.paymentsHistory,
                        notes: r.notes
                    }, { merge: true });
                }
                alert('تم تسجيل الدفعة بنجاح!');
            } catch (e) {
                alert('تم تسجيل الدفعة محلياً.');
            }
        }

        function renderRecords() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const timeFilter = document.getElementById('timeFilter').value;
            const list = document.getElementById('recordsList');
            const paginationContainer = document.getElementById('paginationContainer');
            
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;
            const currentMonthStr = `${year}-${month}`;
            
            const d = new Date(now);
            d.setDate(d.getDate() - 7);
            const weekAgoStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            let filtered = records.filter(r => {
                const matchesSearch = (r.clientName && r.clientName.toLowerCase().includes(search)) ||
                                      (r.shopName && r.shopName.toLowerCase().includes(search)) ||
                                      (r.marketName && r.marketName.toLowerCase().includes(search)) ||
                                      (r.phone && r.phone.includes(search));
                
                if (!matchesSearch) return false;
                if (timeFilter === 'today' && r.date !== todayStr) return false;
                if (timeFilter === 'week' && (!r.date || r.date < weekAgoStr || r.date > todayStr)) return false;
                if (timeFilter === 'month' && (!r.date || !r.date.startsWith(currentMonthStr))) return false;
                return true;
            });

            if (showDebtOnly) filtered = filtered.filter(r => r.remaining > 0);
            filtered.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#6b7280; padding:20px;">لا توجد سجلات مطابقة.</p>';
                paginationContainer.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const paginatedItems = filtered.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            list.innerHTML = paginatedItems.map(r => {
                let paymentsHtml = '';
                if (r.paymentsHistory && r.paymentsHistory.length > 0) {
                    paymentsHtml = `
                        <div class="payments-log">
                            <div class="payments-log-title">📜 سجل المدفوعات والدفعات:</div>
                            ${r.paymentsHistory.map(p => `
                                <div class="payment-row">
                                    <span>📅 ${p.date} (بواسطة: ${p.employee || 'admin'})</span>
                                    <strong style="color:#15803d;">+${p.amount}</strong>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                return `
                    <div class="customer-item ${r.remaining > 0 ? 'has-debt' : 'no-debt'}">
                        <div class="item-header">
                            <div class="client-info">
                                <span class="client-name">${r.clientName}</span>
                                <span class="shop-badge">🏪 ${r.shopName}</span>
                                ${r.marketName ? `<span class="market-badge">📍 ${r.marketName}</span>` : ''}
                                ${r.employee ? `<span class="emp-badge">👤 ${r.employee}</span>` : ''}
                                <span>📞 <strong class="phone-link" onclick="window.location.href='tel:${r.phone}'">${r.phone}</strong></span>
                            </div>
                        </div>
                        <div style="font-size: 0.85rem; color:#4b5563; margin-bottom:6px;">الأصناف: ${r.itemsSummary || 'غير محدد'}</div>
                        <div class="item-details">
                            <div class="detail-box"><span>إجمالي الفاتورة</span><strong>${r.total}</strong></div>
                            <div class="detail-box"><span>المدفوع</span><strong class="paid-amount">${r.paid}</strong></div>
                            <div class="detail-box"><span>المتبقي</span><strong class="debt-amount">${r.remaining}</strong></div>
                        </div>
                        ${paymentsHtml}
                        ${r.notes ? `<div class="notes-box" style="margin-top:8px;">💬 <strong>ملاحظات:</strong> ${r.notes}</div>` : ''}
                        <div class="card-footer">
                            <span style="font-size: 0.78rem; color:#6b7280;">📅 ${r.date}</span>
                            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                ${r.remaining > 0 ? `<button class="btn btn-success" onclick="makePartialPayment('${r.firebaseId}')" style="padding:6px 10px; font-size:0.78rem;">💵 تسديد دفعة</button>` : ''}
                                <button class="btn btn-warning" onclick="editRecord('${r.firebaseId}')">✏️ تعديل</button>
                                <button class="btn btn-danger" onclick="deleteRecord('${r.firebaseId}')">🗑️ حذف</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            let pagesHtml = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">السابق</button>`;
            for (let i = 1; i <= totalPages; i++) {
                pagesHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }
            pagesHtml += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">التالي</button>`;
            paginationContainer.innerHTML = pagesHtml;
        }

        function changePage(page) {
            currentPage = page;
            renderRecords();
        }

        function toggleDebtFilter() {
            showDebtOnly = !showDebtOnly;
            const btn = document.getElementById('debtFilterBtn');
            btn.classList.toggle('active', showDebtOnly);
            btn.innerText = showDebtOnly ? 'عرض الكل' : 'المديونيات فقط';
            renderRecords();
        }

        async function deleteRecord(firebaseId) {
            if (confirm('هل أنت متأكد من حذف هذا السجل وإعادة الكميات للمخزون؟')) {
                try {
                    if (window.db && !firebaseId.startsWith('local_')) {
                        await window.deleteDoc(window.doc(window.db, "sales_records", firebaseId));
                    }
                    records = records.filter(item => item.firebaseId !== firebaseId);
                    localStorage.setItem('sales_records_offline', JSON.stringify(records));
                    await calculateStockFromSims();
                    await saveConfig();
                    updateItemSelects();
                    alert('تم الحذف بنجاح.');
                    renderRecords();
                } catch (e) {
                    alert('حدث خطأ أثناء الحذف.');
                }
            }
        }
    </script>
</body>
</html>
